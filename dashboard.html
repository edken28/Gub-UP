<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --brand-blue: #2563eb; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; opacity: 0; transition: opacity 0.5s ease; }
        .auth-ready #main-layout { display: flex; opacity: 1; }
        
        /* Loader Styles */
        #loader { position: fixed; inset: 0; background: #f1f5f9; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid var(--brand-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .auth-ready #loader { display: none; }

        .chart-card { background: white; border-radius: 2rem; padding: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="loader">
        <div class="spinner mb-4"></div>
        <p class="text-navy font-bold animate-pulse">Connecting to Health Network...</p>
    </div>

    <div id="main-layout" class="flex flex-col md:flex-row min-h-screen w-full">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-200">
                        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></div>
                        <span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="package" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="file-bar-chart" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Disease Reports</span>
                    </a>
                    
                    <div id="internal-consoles" class="pt-6 hidden">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-5 mb-2">Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 bg-emerald-50 px-5 py-4 rounded-2xl font-bold mb-2">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 bg-red-50 px-5 py-4 rounded-2xl font-bold">
                            <i data-lucide="shield-alert" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b p-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl"><i data-lucide="menu"></i></button>
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Analytics Dashboard</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl border">
                    <i data-lucide="user" class="w-4 h-4 text-blue-600"></i>
                    <span id="user-display" class="font-bold text-navy text-sm">...</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
                <div class="chart-card" data-aos="fade-up">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            <h3 class="text-xl font-bold text-navy">Disease Incident Trends</h3>
                            <p class="text-xs text-slate-400 font-medium">Research Data Source: RHU Reports</p>
                        </div>
                        <div class="flex gap-2">
                            <select id="d-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-navy outline-none"></select>
                            <select id="d-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-navy outline-none">
                                <option value="Dengue">Dengue</option>
                                <option value="Flu">Flu</option>
                                <option value="COVID-19">COVID-19</option>
                            </select>
                        </div>
                    </div>
                    <div class="h-[300px] w-full">
                        <canvas id="diseaseChart"></canvas>
                    </div>
                </div>

                <div class="chart-card" data-aos="fade-up" data-aos-delay="100">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <div>
                            <h3 class="text-xl font-bold text-navy">Medicine Inventory Levels</h3>
                            <p class="text-xs text-slate-400 font-medium">Research Data Source: BHW Console</p>
                        </div>
                        <div class="flex gap-2">
                            <select id="s-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-navy outline-none"></select>
                            <select id="s-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold text-navy outline-none">
                                <option value="Paracetamol (Acetaminophen)">Paracetamol</option>
                                <option value="Amoxicillin">Amoxicillin</option>
                                <option value="Vitamin C">Vitamin C</option>
                            </select>
                        </div>
                    </div>
                    <div class="h-[300px] w-full">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // CONFIG
        const brgys = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const labels = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Populate Dropdowns
        const options = `<option value="All">All Barangays</option>` + brgys.map(b => `<option value="${b}">${b}</option>`).join('');
        document.getElementById('d-brgy').innerHTML = options;
        document.getElementById('s-brgy').innerHTML = options;

        // Initialize Charts
        const chartStyle = (color) => ({
            type: 'line',
            data: { labels, datasets: [{ data: [], borderColor: color, backgroundColor: color+'22', fill: true, tension: 0.4, borderWeight: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        const dChart = new Chart(document.getElementById('diseaseChart'), chartStyle('#ef4444'));
        const sChart = new Chart(document.getElementById('stockChart'), chartStyle('#10b981'));

        // CORE SYNC FUNCTION
        function updateCharts() {
            const dbry = document.getElementById('d-brgy').value;
            const dcat = document.getElementById('d-cat').value;
            const sbry = document.getElementById('s-brgy').value;
            const scat = document.getElementById('s-cat').value;

            // Disease Sync
            onSnapshot(collection(db, "disease_cases"), (snap) => {
                const data = new Array(12).fill(0);
                snap.forEach(doc => {
                    const r = doc.data();
                    if ((dbry === "All" || r.barangay === dbry) && r.name === dcat) {
                        const month = r.createdAt?.toDate ? r.createdAt.toDate().getMonth() : null;
                        if (month !== null) data[month] += parseInt(r.count || 0);
                    }
                });
                dChart.data.datasets[0].data = data;
                dChart.update();
            });

            // Stock Sync
            onSnapshot(collection(db, "medicine_inventory"), (snap) => {
                const data = new Array(12).fill(0);
                snap.forEach(doc => {
                    const r = doc.data();
                    if ((sbry === "All" || r.barangay === sbry) && r.name === scat) {
                        const month = r.createdAt?.toDate ? r.createdAt.toDate().getMonth() : null;
                        // Use latest count for that month
                        if (month !== null) data[month] = parseInt(r.count || 0);
                    }
                });
                sChart.data.datasets[0].data = data;
                sChart.update();
            });
        }

        // AUTH & INIT
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    document.getElementById('user-display').innerText = userData.name;
                    
                    if (userData.role === 'bhw' || userData.role === 'rhu') {
                        document.getElementById('internal-consoles').classList.remove('hidden');
                        if (userData.role === 'bhw') document.getElementById('bhw-link').classList.remove('hidden');
                        if (userData.role === 'rhu') document.getElementById('rhu-link').classList.remove('hidden');
                    }
                }
                document.body.classList.add('auth-ready');
                lucide.createIcons();
                AOS.init();
                updateCharts();
            } else {
                window.location.href = "login.html";
            }
        });

        // EVENTS
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', updateCharts));
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('sidebar-closed');
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
