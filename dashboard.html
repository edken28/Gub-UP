<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        /* SIDEBAR & MOBILE MENU */
        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s ease;
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) {
            #sidebar { position: sticky; transform: translateX(0); width: 300px; }
            #mobile-top-bar { display: none; }
        }
        .sidebar-open { transform: translateX(0) !important; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 900; }
        #overlay.active { display: block; }

        /* DYNAMIC FILTERS */
        .hidden-filter { display: none !important; }
        
        /* SEARCH ENGINE UI */
        .search-results { 
            display: none; position: absolute; top: 105%; left: 0; right: 0; 
            background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; 
            max-height: 250px; overflow-y: auto; z-index: 500; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
        }
        .search-results.active { display: block; }
        .search-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f8fafc; font-size: 13px; font-weight: 600; transition: all 0.2s; }
        .search-item:hover { background: #f1f5f9; color: #2563eb; padding-left: 25px; }

        /* CUSTOM SCROLLBAR */
        .search-results::-webkit-scrollbar { width: 6px; }
        .search-results::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <div id="overlay"></div>

    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button id="close-menu" class="lg:hidden text-slate-400 p-2"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-100">
                        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50">
                        <i data-lucide="package" class="text-emerald-500"></i><span>Medicine Stocks</span>
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50">
                        <i data-lucide="file-bar-chart" class="text-amber-500"></i><span>Disease Reports</span>
                    </a>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors"><i data-lucide="log-out"></i> Logout</button>
            </div>
        </aside>

        <main class="flex-1 w-full">
            <div id="mobile-top-bar" class="lg:hidden bg-white border-b border-slate-100 px-5 py-4 flex items-center justify-between sticky top-0 z-40">
                <button id="open-menu" class="p-2 bg-slate-50 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white"><i data-lucide="plus" class="w-4 h-4"></i></div>
            </div>

            <header class="bg-white/80 backdrop-blur-md border-b px-6 md:px-10 py-6 sticky top-0 z-30">
                <div id="live-clock" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Loading...</div>
                <h1 class="text-navy font-bold text-2xl">Dashboard Overview</h1>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto space-y-8">
                
                <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm p-6 md:p-10" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10">
                        <div>
                            <h3 class="text-2xl font-bold text-navy flex items-center gap-2"><i data-lucide="activity" class="text-red-500"></i> Disease Cases</h3>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1"><span id="d-label" class="text-red-500">All Diseases</span> • Total: <span id="d-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                            <select id="d-mode" class="p-3 bg-slate-50 rounded-2xl font-bold text-navy text-xs outline-none border border-transparent focus:border-blue-200">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="d-year-select" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs outline-none"></select>
                            <select id="d-month-select" class="p-3 bg-amber-50 rounded-2xl font-bold text-amber-600 text-xs outline-none hidden-filter"></select>
                            <select id="d-brgy" class="p-3 bg-slate-50 rounded-2xl font-bold text-navy text-xs outline-none"></select>
                            <div class="relative flex-1 min-w-[200px]">
                                <input type="text" id="d-search" placeholder="Search Disease..." class="w-full p-3 bg-slate-50 rounded-2xl font-bold text-xs outline-none focus:ring-2 ring-red-100">
                                <div id="d-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="diseaseChart"></canvas></div>
                </div>

                <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm p-6 md:p-10" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10">
                        <div>
                            <h3 class="text-2xl font-bold text-navy flex items-center gap-2"><i data-lucide="pill" class="text-emerald-500"></i> Medicine Stocks</h3>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1"><span id="m-label" class="text-emerald-500">All Medicines</span> • Total: <span id="m-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                            <select id="m-mode" class="p-3 bg-slate-50 rounded-2xl font-bold text-navy text-xs outline-none border border-transparent focus:border-emerald-200">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="m-year-select" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs outline-none"></select>
                            <select id="m-month-select" class="p-3 bg-emerald-50 rounded-2xl font-bold text-emerald-600 text-xs outline-none hidden-filter"></select>
                            <select id="m-brgy" class="p-3 bg-slate-50 rounded-2xl font-bold text-navy text-xs outline-none"></select>
                            <div class="relative flex-1 min-w-[200px]">
                                <input type="text" id="m-search" placeholder="Search Medicine..." class="w-full p-3 bg-slate-50 rounded-2xl font-bold text-xs outline-none focus:ring-2 ring-emerald-100">
                                <div id="m-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="stockChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DATA LISTS
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ["2024", "2025", "2026"];
        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        const diseases = [
            "Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox", 
            "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", 
            "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", 
            "Viral gastroenteritis", "Tuberculosis", "Pneumonia", "Typhoid fever", "Leptospirosis", "Cholera", "Diphtheria", "Pertussis", 
            "Tetanus", "Meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Malaria", "Schistosomiasis", "Hypertension", 
            "Diabetes", "Heart failure", "Stroke", "Asthma", "COPD", "Cancer", "Depression", "Anxiety", "Malnutrition"
        ];

        const medicines = [
            "Paracetamol", "Ibuprofen", "Mefenamic acid", "Aspirin", "Naproxen", "Diclofenac", "Celecoxib", "Chlorphenamine", 
            "Diphenhydramine", "Cetirizine", "Loratadine", "Ambroxol", "Guaifenesin", "Salbutamol inhaler", "Omeprazole", 
            "Loperamide", "ORS", "Povidone iodine", "Amoxicillin", "Azithromycin", "Ciprofloxacin", "Doxycycline", "Amlodipine", 
            "Losartan", "Metformin", "Insulin", "Atorvastatin", "Vitamin C", "Multivitamins", "Iron (Ferrous sulfate)", "Alcohol", "Hand sanitizer"
        ];

        let curD = "", curM = "";

        // UI SETUP
        const fill = (id, list, valIsIdx = false) => {
            document.getElementById(id).innerHTML = list.map((item, i) => `<option value="${valIsIdx ? i : item}">${item}</option>`).join('');
        };
        fill('d-brgy', barangays); fill('m-brgy', barangays);
        fill('d-year-select', years); fill('m-year-select', years);
        fill('d-month-select', monthNames, true); fill('m-month-select', monthNames, true);
        
        document.getElementById('d-year-select').value = "2026";
        document.getElementById('m-year-select').value = "2026";

        // HAMBURGER LOGIC
        const toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('sidebar-open');
            document.getElementById('overlay').classList.toggle('active');
        };
        document.getElementById('open-menu').onclick = toggleSidebar;
        document.getElementById('close-menu').onclick = toggleSidebar;
        document.getElementById('overlay').onclick = toggleSidebar;

        // MODE SWITCHING (Yearly vs Monthly)
        const updateModeUI = (type) => {
            const mode = document.getElementById(`${type}-mode`).value;
            document.getElementById(`${type}-year-select`).classList.toggle('hidden-filter', mode === 'monthly');
            document.getElementById(`${type}-month-select`).classList.toggle('hidden-filter', mode === 'yearly');
            sync();
        };
        document.getElementById('d-mode').onchange = () => updateModeUI('d');
        document.getElementById('m-mode').onchange = () => updateModeUI('m');

        // SEARCH ENGINE (Auto-close)
        window.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) {
                document.querySelectorAll('.search-results').forEach(r => r.classList.remove('active'));
            }
        });

        const setupSearch = (inputId, resId, list, type) => {
            const input = document.getElementById(inputId);
            const res = document.getElementById(resId);
            input.oninput = () => {
                const q = input.value.toLowerCase();
                const filtered = list.filter(i => i.toLowerCase().includes(q));
                res.innerHTML = filtered.map(i => `<div class="search-item">${i}</div>`).join('');
                res.classList.toggle('active', filtered.length > 0);
                res.querySelectorAll('.search-item').forEach(el => {
                    el.onclick = () => {
                        input.value = el.innerText;
                        res.classList.remove('active');
                        if (type === 'd') { curD = el.innerText; document.getElementById('d-label').innerText = el.innerText; }
                        else { curM = el.innerText; document.getElementById('m-label').innerText = el.innerText; }
                        sync();
                    };
                });
            };
        };
        setupSearch('d-search', 'd-results', diseases, 'd');
        setupSearch('m-search', 'm-results', medicines, 'm');

        // CHART SYNC
        function getWeekOfMonth(date) {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            return Math.ceil((date.getDate() + firstDay) / 7);
        }

        const createChart = (id, color) => new Chart(document.getElementById(id), {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: color, backgroundColor: color+'11', fill: true, tension: 0.4, borderWidth: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
        const dChart = createChart('diseaseChart', '#ef4444');
        const mChart = createChart('stockChart', '#10b981');

        function sync() {
            // Logic for Disease Chart
            const dMode = document.getElementById('d-mode').value;
            const dYear = parseInt(document.getElementById('d-year-select').value);
            const dMonth = parseInt(document.getElementById('d-month-select').value);
            const dBrgy = document.getElementById('d-brgy').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let data = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labels = dMode === 'yearly' ? monthNames.map(m => m.substring(0,3)) : ["W1", "W2", "W3", "W4", "W5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if (!d) return;
                    if ((curD === "" || r.name === curD) && (dBrgy === "All Areas" || r.barangay === dBrgy)) {
                        if (dMode === 'yearly' && d.getFullYear() === dYear) {
                            data[d.getMonth()] += Number(r.count || 0); total += Number(r.count || 0);
                        } else if (dMode === 'monthly' && d.getMonth() === dMonth && d.getFullYear() === 2026) {
                            const wk = getWeekOfMonth(d) - 1; if(wk >= 0 && wk < 5) data[wk] += Number(r.count || 0); total += Number(r.count || 0);
                        }
                    }
                });
                dChart.data.labels = labels; dChart.data.datasets[0].data = data; dChart.update();
                document.getElementById('d-total').innerText = total;
            });

            // Logic for Medicine Chart
            const mMode = document.getElementById('m-mode').value;
            const mYear = parseInt(document.getElementById('m-year-select').value);
            const mMonth = parseInt(document.getElementById('m-month-select').value);
            const mBrgy = document.getElementById('m-brgy').value;

            onSnapshot(collection(db, "medicine_inventory"), snap => {
                let data = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labels = mMode === 'yearly' ? monthNames.map(m => m.substring(0,3)) : ["W1", "W2", "W3", "W4", "W5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if (!d) return;
                    if ((curM === "" || r.name === curM) && (mBrgy === "All Areas" || r.barangay === mBrgy)) {
                        if (mMode === 'yearly' && d.getFullYear() === mYear) {
                            data[d.getMonth()] += Number(r.count || 0); total += Number(r.count || 0);
                        } else if (mMode === 'monthly' && d.getMonth() === mMonth && d.getFullYear() === 2026) {
                            const wk = getWeekOfMonth(d) - 1; if(wk >= 0 && wk < 5) data[wk] += Number(r.count || 0); total += Number(r.count || 0);
                        }
                    }
                });
                mChart.data.labels = labels; mChart.data.datasets[0].data = data; mChart.update();
                document.getElementById('m-total').innerText = total;
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 800, once: true });
                    lucide.createIcons();
                    sync();
                }
            } else { window.location.href = "login.html"; }
        });

        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }, 1000);

        document.querySelectorAll('select').forEach(s => s.onchange = sync);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
