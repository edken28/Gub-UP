<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        
        /* THE FIX: Manual Month Selector Styling */
        .month-selector { display: none; } /* Default hidden */

        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s ease;
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) { #sidebar { position: sticky; transform: translateX(0); width: 300px; } }
        .sidebar-open { transform: translateX(0) !important; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; }
        #overlay.active { display: block; }
        .search-results { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .search-results.active { display: block; }
    </style>
</head>
<body class="min-h-screen">
    <div id="overlay"></div>
    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-blue-900 text-lg">GUB-UP</h1>
                        </div>
                    </div>
                    <button id="close-sidebar" class="lg:hidden"><i data-lucide="x"></i></button>
                </div>
                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-4 rounded-2xl font-bold shadow-lg"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50"><i data-lucide="package" class="text-emerald-500"></i> Medicine Stocks</a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50"><i data-lucide="file-bar-chart" class="text-amber-500"></i> Disease Reports</a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-sky-50"><i data-lucide="phone" class="text-sky-500"></i> Hotlines</a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-4 font-bold hover:bg-emerald-50"><i data-lucide="user-cog"></i> BHW</a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-4 font-bold hover:bg-red-50"><i data-lucide="shield-check"></i> RHU</a>
                    </div>
                </nav>
            </div>
            <button id="logout-btn" class="mt-auto p-8 flex items-center gap-3 text-slate-400 font-bold"><i data-lucide="log-out"></i> Logout</button>
        </aside>

        <main class="flex-1">
            <header class="bg-white/80 border-b px-10 py-6 sticky top-0 z-30 flex justify-between items-center">
                <h1 class="text-blue-900 font-bold text-2xl">Welcome, <span id="welcome-name">User</span></h1>
                <button id="open-sidebar" class="lg:hidden p-2 bg-slate-100 rounded-lg"><i data-lucide="menu"></i></button>
            </header>

            <div class="p-10 space-y-8">
                <div class="bg-white rounded-[2.5rem] border p-10 shadow-sm" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-10">
                        <h3 class="text-2xl font-bold text-blue-900">Disease Cases</h3>
                        <div class="flex flex-wrap gap-2">
                            <select id="d-mode" class="p-3 bg-slate-100 rounded-2xl font-bold text-xs">
                                <option value="yearly">Yearly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                            <select id="d-year" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs"></select>
                            
                            <select id="d-month" class="month-selector p-3 bg-amber-50 rounded-2xl font-bold text-amber-600 text-xs"></select>
                            
                            <select id="d-brgy" class="p-3 bg-slate-100 rounded-2xl font-bold text-xs"></select>
                            <input type="text" id="d-search" placeholder="Search..." class="p-3 bg-slate-100 rounded-2xl font-bold text-xs outline-none">
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="diseaseChart"></canvas></div>
                </div>

                <div class="bg-white rounded-[2.5rem] border p-10 shadow-sm" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-10">
                        <h3 class="text-2xl font-bold text-blue-900">Medicine Stocks</h3>
                        <div class="flex flex-wrap gap-2">
                            <select id="m-mode" class="p-3 bg-slate-100 rounded-2xl font-bold text-xs">
                                <option value="yearly">Yearly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                            <select id="m-year" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs"></select>
                            <select id="m-month" class="month-selector p-3 bg-emerald-50 rounded-2xl font-bold text-emerald-600 text-xs"></select>
                            <select id="m-brgy" class="p-3 bg-slate-100 rounded-2xl font-bold text-xs"></select>
                            <input type="text" id="m-search" placeholder="Search..." class="p-3 bg-slate-100 rounded-2xl font-bold text-xs outline-none">
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="stockChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ["2024", "2025", "2026"];
        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        const fill = (id, list, useIdx = false) => {
            document.getElementById(id).innerHTML = list.map((v, i) => `<option value="${useIdx ? i : v}">${v}</option>`).join('');
        };
        fill('d-year', years); fill('m-year', years);
        fill('d-month', months, true); fill('m-month', months, true);
        fill('d-brgy', barangays); fill('m-brgy', barangays);

        // Sidebar Fix
        document.getElementById('open-sidebar').onclick = () => { document.getElementById('sidebar').classList.add('sidebar-open'); document.getElementById('overlay').classList.add('active'); };
        document.getElementById('close-sidebar').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };

        // THE FORCE REVEAL LOGIC
        const toggleMonthCategory = (prefix) => {
            const mode = document.getElementById(`${prefix}-mode`).value;
            const monthEl = document.getElementById(`${prefix}-month`);
            
            if (mode === 'monthly') {
                monthEl.style.display = "block"; // Force show
            } else {
                monthEl.style.display = "none"; // Force hide
            }
            sync();
        };

        document.getElementById('d-mode').onchange = () => toggleMonthCategory('d');
        document.getElementById('m-mode').onchange = () => toggleMonthCategory('m');

        // Charts
        const dChart = new Chart(document.getElementById('diseaseChart'), { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#ef4444', backgroundColor: '#ef444411', fill: true }] }, options: { responsive: true, maintainAspectRatio: false } });
        const mChart = new Chart(document.getElementById('stockChart'), { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#10b981', backgroundColor: '#10b98111', fill: true }] }, options: { responsive: true, maintainAspectRatio: false } });

        function sync() {
            const dMode = document.getElementById('d-mode').value;
            const dYear = document.getElementById('d-year').value;
            const dMonth = document.getElementById('d-month').value;
            const dBrgy = document.getElementById('d-brgy').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let counts = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = dMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                snap.forEach(doc => {
                    const r = doc.data(); const date = r.createdAt?.toDate();
                    if(!date) return;
                    if(dBrgy === "All Areas" || r.barangay === dBrgy) {
                        if(dMode === 'yearly' && date.getFullYear() == dYear) counts[date.getMonth()] += Number(r.count);
                        else if(dMode === 'monthly' && date.getMonth() == dMonth && date.getFullYear() == dYear) {
                            const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) counts[wk] += Number(r.count);
                        }
                    }
                });
                dChart.data.labels = labs; dChart.data.datasets[0].data = counts; dChart.update();
            });

            // Same for medicine...
            const mMode = document.getElementById('m-mode').value;
            const mYear = document.getElementById('m-year').value;
            const mMonth = document.getElementById('m-month').value;
            const mBrgy = document.getElementById('m-brgy').value;
            onSnapshot(collection(db, "medicine_inventory"), snap => {
                let counts = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = mMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                snap.forEach(doc => {
                    const r = doc.data(); const date = r.createdAt?.toDate();
                    if(!date) return;
                    if(mBrgy === "All Areas" || r.barangay === mBrgy) {
                        if(mMode === 'yearly' && date.getFullYear() == mYear) counts[date.getMonth()] += Number(r.count);
                        else if(mMode === 'monthly' && date.getMonth() == mMonth && date.getFullYear() == mYear) {
                            const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) counts[wk] += Number(r.count);
                        }
                    }
                });
                mChart.data.labels = labs; mChart.data.datasets[0].data = counts; mChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) {
                    const u = s.data(); document.getElementById('welcome-name').innerText = u.name;
                    if(u.role === 'bhw' || u.role === 'rhu') {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if(u.role === 'bhw') document.getElementById('bhw-link').classList.remove('hidden');
                        if(u.role === 'rhu') document.getElementById('rhu-link').classList.remove('hidden');
                    }
                }
                document.body.classList.add('auth-ready');
                lucide.createIcons();
                AOS.init();
                sync();
            } else { window.location.href = "login.html"; }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
