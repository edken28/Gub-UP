<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        .dropdown-list {
            display: none; position: absolute;
            top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #e2e8f0;
            border-radius: 1rem; max-height: 200px;
            overflow-y: auto; z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 600; }
        .dropdown-item:hover { background-color: #f0fdf4; color: #10b981; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .chart-card { background: white; border-radius: 2rem; border: 1px solid #f1f5f9; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-100 transition-all">
                        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><i data-lucide="layout-dashboard" class="w-4 h-4 text-white"></i></div>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 transition-all group">
                        <div class="w-8 h-8 bg-emerald-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="package" class="w-4 h-4 text-emerald-600 group-hover:text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>

                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 transition-all group">
                        <div class="w-8 h-8 bg-amber-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="file-bar-chart" class="w-4 h-4 text-amber-600 group-hover:text-white"></i>
                        </div>
                        <span>Disease Reports</span>
                    </a>

                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-blue-50 transition-all group">
                        <div class="w-8 h-8 bg-blue-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="phone" class="w-4 h-4 text-blue-600 group-hover:text-white"></i>
                        </div>
                        <span>Hotlines</span>
                    </a>

                    <div id="internal-consoles" class="pt-6 pb-2 hidden">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                        <a href="rhu-console.html" id="rhu-link" class="hidden items-center gap-3 bg-red-50 text-red-600 px-5 py-4 rounded-2xl font-bold mb-2 transition-all">
                            <i data-lucide="shield-alert" class="w-5 h-5"></i><span>RHU Console</span>
                        </a>
                        <a href="bhw-console.html" id="bhw-link" class="hidden items-center gap-3 bg-emerald-50 text-emerald-600 px-5 py-4 rounded-2xl font-bold transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i><span>BHW Console</span>
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                    <h2 class="text-[10px] md:text-sm font-bold text-slate-400 uppercase tracking-widest">Research Monitoring</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-xs md:text-sm">Guest</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto space-y-8">
                
                <div class="chart-card" data-aos="fade-up">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h3 class="text-xl font-black text-navy">Disease Cases</h3>
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Total Found: <span id="d-total" class="text-blue-600">0</span></p>
                        </div>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 w-full md:w-auto">
                            <select id="d-year" class="p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none">
                                <option value="2025">2025</option><option value="2026">2026</option>
                            </select>
                            <select id="d-brgy" class="p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none"></select>
                            <div class="relative col-span-2">
                                <input type="text" id="d-search" placeholder="Search Disease..." class="w-full p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none">
                                <div id="d-drop" class="dropdown-list custom-scrollbar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="diseaseChart"></canvas></div>
                </div>

                <div class="chart-card" data-aos="fade-up" data-aos-delay="100">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h3 class="text-xl font-black text-navy">Medicine Stocks</h3>
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest">Latest Stock: <span id="m-total" class="text-emerald-500">0</span></p>
                        </div>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 w-full md:w-auto">
                            <select id="m-year" class="p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none">
                                <option value="2025">2025</option><option value="2026">2026</option>
                            </select>
                            <select id="m-brgy" class="p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none"></select>
                            <div class="relative col-span-2">
                                <input type="text" id="m-search" placeholder="Search Medicine..." class="w-full p-3 bg-slate-50 border-none rounded-xl text-[11px] font-black text-navy outline-none">
                                <div id="m-drop" class="dropdown-list custom-scrollbar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="stockChart"></canvas></div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const diseases = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Measles", "Mumps", "Stroke", "Hypertension", "Diabetes", "Asthma", "Tuberculosis", "Pneumonia", "Diarrhea", "STIs"]; 
        const medicines = ["Paracetamol (Acetaminophen)", "Ibuprofen", "Mefenamic acid", "Amoxicillin", "Vitamin A", "Vitamin C", "Amlodipine", "Losartan", "Metformin"];

        let activeDisease = "Dengue fever";
        let activeMedicine = "Vitamin A";

        // Setup Dropdowns
        const fill = (id, list) => document.getElementById(id).innerHTML = list.map(i => `<option value="${i}">${i}</option>`).join('');
        fill('d-brgy', barangays); fill('m-brgy', barangays);

        // Search Setup
        const setupSearch = (inputId, dropId, list, type) => {
            const input = document.getElementById(inputId);
            const drop = document.getElementById(dropId);
            input.oninput = () => {
                const val = input.value.toLowerCase();
                const filtered = list.filter(m => m.toLowerCase().includes(val));
                drop.innerHTML = filtered.map(m => `<div class="dropdown-item">${m}</div>`).join('');
                drop.classList.toggle('active', val.length > 0);
                drop.querySelectorAll('.dropdown-item').forEach(el => el.onclick = () => {
                    input.value = el.innerText;
                    if(type === 'd') activeDisease = el.innerText; else activeMedicine = el.innerText;
                    drop.classList.remove('active'); sync();
                });
            };
        };
        setupSearch('d-search', 'd-drop', diseases, 'd');
        setupSearch('m-search', 'm-drop', medicines, 'm');

        // Charts
        const createChart = (id, label, color) => new Chart(document.getElementById(id), {
            type: 'line',
            data: { labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], 
            datasets: [{ label: label, data: [], borderColor: color, backgroundColor: color+'15', fill: true, tension: 0.4, borderWeight: 3 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true } } }
        });
        const dChart = createChart('diseaseChart', activeDisease, '#2563eb');
        const mChart = createChart('stockChart', activeMedicine, '#10b981');

        function sync() {
            const dy = parseInt(document.getElementById('d-year').value);
            const dbry = document.getElementById('d-brgy').value;
            const my = parseInt(document.getElementById('m-year').value);
            const mbry = document.getElementById('m-brgy').value;

            dChart.data.datasets[0].label = activeDisease;
            mChart.data.datasets[0].label = activeMedicine;

            onSnapshot(collection(db, "disease_cases"), (snap) => {
                const res = new Array(12).fill(0); let total = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const d = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if(d && d.getFullYear() === dy && r.name === activeDisease && (dbry === "All Areas" || r.barangay === dbry)) {
                        res[d.getMonth()] += Number(r.count || 0); total += Number(r.count || 0);
                    }
                });
                document.getElementById('d-total').innerText = total;
                dChart.data.datasets[0].data = res; dChart.update();
            });

            onSnapshot(collection(db, "medicine_inventory"), (snap) => {
                const res = new Array(12).fill(0); let last = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const d = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if(d && d.getFullYear() === my && r.name === activeMedicine && (mbry === "All Areas" || r.barangay === mbry)) {
                        res[d.getMonth()] = Number(r.count || 0); last = Number(r.count || 0);
                    }
                });
                document.getElementById('m-total').innerText = last;
                mChart.data.datasets[0].data = res; mChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) { window.location.href="login.html"; return; }
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if(uDoc.exists()){
                const d = uDoc.data();
                document.getElementById('user-name-display').innerText = d.name;
                if(d.role === 'rhu' || d.role === 'bhw'){
                    document.getElementById('internal-consoles').classList.remove('hidden');
                    if(d.role === 'rhu') document.getElementById('rhu-link').classList.add('flex');
                    if(d.role === 'bhw') document.getElementById('bhw-link').classList.add('flex');
                }
            }
            document.body.classList.add('auth-ready');
            AOS.init({ duration: 800, once: true });
            lucide.createIcons();
            sync();
        });

        document.querySelectorAll('select').forEach(s => s.onchange = sync);
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('sidebar-closed');
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href="login.html");
    </script>
</body>
</html>
