<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUB-UP Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { position: fixed; top: 0; left: 0; height: 100vh; width: 280px; background: white; z-index: 1000; transform: translateX(-100%); transition: 0.3s transform ease-in-out; border-right: 1px solid #e2e8f0; }
        .sidebar.active { transform: translateX(0); }
        @media (min-width: 1024px) { .sidebar { transform: translateX(0); position: sticky; width: 300px; } }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }
        .search-results { display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 50; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .search-results.active { display: block; }
        .item-row { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .item-row:hover { background: #eff6ff; color: #2563eb; }
    </style>
</head>
<body class="flex min-h-screen">

    <div id="overlay" class="overlay"></div>

    <aside id="sidebar" class="sidebar flex flex-col p-6">
        <div class="flex items-center justify-between mb-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i data-lucide="activity"></i></div>
                <h1 class="font-extrabold text-slate-800 text-xl tracking-tight">GUB-UP</h1>
            </div>
            <button id="close-btn" class="lg:hidden p-2 text-slate-400"><i data-lucide="x"></i></button>
        </div>
        
        <nav class="space-y-2 flex-1">
            <a href="#" class="flex items-center gap-3 p-4 bg-blue-50 text-blue-600 rounded-xl font-bold"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="stock.html" class="flex items-center gap-3 p-4 text-slate-500 hover:bg-slate-50 rounded-xl font-bold"><i data-lucide="package"></i> Medicine Stocks</a>
            <a href="reports.html" class="flex items-center gap-3 p-4 text-slate-500 hover:bg-slate-50 rounded-xl font-bold"><i data-lucide="file-text"></i> Disease Reports</a>
            <a href="hotlines.html" class="flex items-center gap-3 p-4 text-slate-500 hover:bg-slate-50 rounded-xl font-bold"><i data-lucide="phone"></i> Hotlines</a>
        </nav>

        <button id="logout-btn" class="flex items-center gap-3 p-4 text-red-500 font-bold border-t mt-4"><i data-lucide="log-out"></i> Logout</button>
    </aside>

    <main class="flex-1">
        <div class="lg:hidden flex items-center justify-between p-4 bg-white border-b">
            <button id="menu-btn" class="p-2 bg-slate-100 rounded-lg"><i data-lucide="menu"></i></button>
            <span class="font-bold text-blue-600">GUB-UP</span>
            <div class="w-8 h-8 bg-blue-100 rounded-full"></div>
        </div>

        <div class="p-4 lg:p-10 max-w-6xl mx-auto space-y-6">
            
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Disease Cases</h2>
                        <p class="text-xs font-bold text-red-500 uppercase tracking-widest"><span id="d-label">All Cases</span>: <span id="d-total">0</span></p>
                    </div>
                    
                    <div class="grid grid-cols-2 md:flex gap-2">
                        <select id="d-mode" class="p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200">
                            <option value="yearly">Yearly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                        <select id="d-picker" class="p-3 bg-blue-50 text-blue-700 rounded-xl text-xs font-bold outline-none border border-blue-100"></select>
                        <select id="d-area" class="p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200"></select>
                        <div class="relative col-span-2 md:w-48">
                            <input type="text" id="d-search" placeholder="Search..." class="w-full p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200">
                            <div id="d-res" class="search-results"></div>
                        </div>
                    </div>
                </div>
                <div class="h-64 md:h-80"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-extrabold text-slate-800">Medicine Stocks</h2>
                        <p class="text-xs font-bold text-emerald-500 uppercase tracking-widest"><span id="m-label">All Items</span>: <span id="m-total">0</span></p>
                    </div>
                    
                    <div class="grid grid-cols-2 md:flex gap-2">
                        <select id="m-mode" class="p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200">
                            <option value="yearly">Yearly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                        <select id="m-picker" class="p-3 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold outline-none border-emerald-100"></select>
                        <select id="m-area" class="p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200"></select>
                        <div class="relative col-span-2 md:w-48">
                            <input type="text" id="m-search" placeholder="Search..." class="w-full p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-200">
                            <div id="m-res" class="search-results"></div>
                        </div>
                    </div>
                </div>
                <div class="h-64 md:h-80"><canvas id="stockChart"></canvas></div>
            </div>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DATA LISTS
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ['2024', '2025', '2026'];
        const brgys = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const diseases = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Measles", "Mumps", "Rubella", "Chickenpox", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Rabies", "HIV infection", "Tuberculosis", "Pneumonia", "Typhoid fever", "Leptospirosis", "Cholera", "Hypertension", "Diabetes", "Asthma"];
        const medicines = ["Paracetamol", "Ibuprofen", "Mefenamic acid", "Aspirin", "Amoxicillin", "Azithromycin", "Ciprofloxacin", "Amlodipine", "Losartan", "Metformin", "Vitamin C", "Multivitamins", "Alcohol"];

        let selD = "", selM = "";

        // 1. MOBILE MENU TOGGLE
        const side = document.getElementById('sidebar');
        const ovr = document.getElementById('overlay');
        const toggleMenu = () => { side.classList.toggle('active'); ovr.classList.toggle('active'); };
        
        document.getElementById('menu-btn').onclick = toggleMenu;
        document.getElementById('close-btn').onclick = toggleMenu;
        ovr.onclick = toggleMenu;

        // 2. THE MORPHING CATEGORY LOGIC
        const fillSelect = (id, list, useIdx) => {
            const el = document.getElementById(id);
            el.innerHTML = list.map((v, i) => `<option value="${useIdx ? i : v}">${v}</option>`).join('');
        };

        const setupMorph = (prefix) => {
            const modeSel = document.getElementById(`${prefix}-mode`);
            const picker = document.getElementById(`${prefix}-picker`);
            
            const refreshPicker = () => {
                if(modeSel.value === 'yearly') fillSelect(`${prefix}-picker`, years, false);
                else fillSelect(`${prefix}-picker`, months, true);
                sync();
            };
            
            modeSel.onchange = refreshPicker;
            refreshPicker(); // Initial run
        };

        fillSelect('d-area', brgys, false);
        fillSelect('m-area', brgys, false);
        setupMorph('d'); setupMorph('m');

        // 3. SEARCH LOGIC
        const setupSearch = (inpId, resId, list, type) => {
            const inp = document.getElementById(inpId);
            const res = document.getElementById(resId);
            
            inp.oninput = () => {
                const val = inp.value.toLowerCase();
                const matches = list.filter(x => x.toLowerCase().includes(val));
                res.innerHTML = matches.map(m => `<div class="item-row">${m}</div>`).join('');
                res.classList.toggle('active', val.length > 0 && matches.length > 0);
                
                res.querySelectorAll('.item-row').forEach(row => {
                    row.onclick = () => {
                        inp.value = row.innerText;
                        res.classList.remove('active');
                        if(type === 'd') { selD = row.innerText; document.getElementById('d-label').innerText = row.innerText; }
                        else { selM = row.innerText; document.getElementById('m-label').innerText = row.innerText; }
                        sync();
                    };
                });
            };
        };
        setupSearch('d-search', 'd-res', diseases, 'd');
        setupSearch('m-search', 'm-res', medicines, 'm');

        // Close search when clicking outside
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.relative')) document.querySelectorAll('.search-results').forEach(r => r.classList.remove('active'));
        });

        // 4. CHART & DATA SYNC
        const dCtx = document.getElementById('diseaseChart').getContext('2d');
        const mCtx = document.getElementById('stockChart').getContext('2d');
        const dChart = new Chart(dCtx, { type: 'line', data: { labels: [], datasets: [{ borderColor: '#ef4444', backgroundColor: '#ef444410', fill: true, tension: 0.4, data: [] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        const mChart = new Chart(mCtx, { type: 'line', data: { labels: [], datasets: [{ borderColor: '#10b981', backgroundColor: '#10b98110', fill: true, tension: 0.4, data: [] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });

        function sync() {
            // Process Disease
            const dMode = document.getElementById('d-mode').value;
            const dVal = document.getElementById('d-picker').value;
            const dArea = document.getElementById('d-area').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let counts = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = dMode === 'yearly' ? months.map(m => m.slice(0,3)) : ["W1", "W2", "W3", "W4", "W5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if(!d) return;
                    if((selD==="" || r.name===selD) && (dArea==="All Areas" || r.barangay===dArea)) {
                        if(dMode === 'yearly' && d.getFullYear() == dVal) { counts[d.getMonth()] += Number(r.count||0); total += Number(r.count||0); }
                        else if(dMode === 'monthly' && d.getMonth() == dVal && d.getFullYear() == 2026) {
                            const wk = Math.ceil(d.getDate() / 7) - 1; if(wk>=0 && wk<5) counts[wk] += Number(r.count||0); total += Number(r.count||0);
                        }
                    }
                });
                dChart.data.labels = labs; dChart.data.datasets[0].data = counts; dChart.update();
                document.getElementById('d-total').innerText = total;
            });

            // Process Medicine (Similar logic...)
            const mMode = document.getElementById('m-mode').value;
            const mVal = document.getElementById('m-picker').value;
            const mArea = document.getElementById('m-area').value;

            onSnapshot(collection(db, "medicine_inventory"), snap => {
                let counts = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = mMode === 'yearly' ? months.map(m => m.slice(0,3)) : ["W1", "W2", "W3", "W4", "W5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if(!d) return;
                    if((selM==="" || r.name===selM) && (mArea==="All Areas" || r.barangay===mArea)) {
                        if(mMode === 'yearly' && d.getFullYear() == mVal) { counts[d.getMonth()] += Number(r.count||0); total += Number(r.count||0); }
                        else if(mMode === 'monthly' && d.getMonth() == mVal && d.getFullYear() == 2026) {
                            const wk = Math.ceil(d.getDate() / 7) - 1; if(wk>=0 && wk<5) counts[wk] += Number(r.count||0); total += Number(r.count||0);
                        }
                    }
                });
                mChart.data.labels = labs; mChart.data.datasets[0].data = counts; mChart.update();
                document.getElementById('m-total').innerText = total;
            });
        }

        onAuthStateChanged(auth, user => { if(!user) window.location.href="login.html"; else { lucide.createIcons(); sync(); } });
        document.querySelectorAll('select').forEach(s => s.onchange = sync);
    </script>
</body>
</html>
