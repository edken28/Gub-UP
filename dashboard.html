<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        .month-selector { display: none; } 
        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) { #sidebar { position: sticky; transform: translateX(0); width: 300px; } }
        .sidebar-open { transform: translateX(0) !important; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 900; }
        #overlay.active { display: block; }
        .search-results { 
            display: none; position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #e2e8f0; border-radius: 1rem; 
            z-index: 110; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto;
        }
        .search-results.active { display: block; }
        .search-item { padding: 10px 15px; cursor: pointer; font-size: 12px; font-weight: 600; border-bottom: 1px solid #f8fafc; }
        .search-item:hover { background: #eff6ff; color: #2563eb; }
    </style>
</head>
<body class="min-h-screen">
    <div id="overlay"></div>
    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="activity"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-blue-900 text-xl">GUB-UP</h1>
                            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Health System</p>
                        </div>
                    </div>
                    <button id="close-sidebar" class="lg:hidden p-2 text-slate-400"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-3.5 rounded-2xl font-semibold shadow-xl shadow-blue-100">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 hover:text-emerald-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-emerald-50 transition-all">
                        <i data-lucide="pill" class="text-emerald-500"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart-2" class="text-amber-500"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 hover:text-sky-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-sky-50 transition-all">
                        <i data-lucide="phone-call" class="text-sky-500"></i> Hotlines
                    </a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-5">Internal Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-3.5 font-semibold hover:bg-emerald-50 rounded-2xl transition-all">
                            <i data-lucide="users" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-3.5 font-semibold hover:bg-red-50 rounded-2xl transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 min-w-0">
            <header class="bg-white/80 backdrop-blur-md border-b px-6 py-4 sticky top-0 z-30 flex items-center justify-between lg:justify-end">
                <button id="open-sidebar" class="lg:hidden p-2.5 bg-white border border-slate-200 rounded-xl text-blue-900 shadow-sm">
                    <i data-lucide="menu"></i>
                </button>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-right">
                        <p id="live-clock" class="text-[10px] font-bold text-blue-600 uppercase">Loading...</p>
                        <h2 class="text-slate-900 font-bold text-sm">Welcome, <span id="welcome-name" class="text-blue-600">User</span></h2>
                    </div>
                    <div class="w-10 h-10 bg-slate-100 rounded-full border-2 border-white flex items-center justify-center text-slate-400">
                        <i data-lucide="user"></i>
                    </div>
                </div>
            </header>

            <div class="p-6 lg:p-10 space-y-8 max-w-[1400px] mx-auto">
                
                <div class="bg-white rounded-[2rem] border border-slate-100 p-6 lg:p-8 shadow-sm" data-aos="fade-up">
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-8">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">Disease Statistics</h3>
                            <p class="text-xs font-bold text-red-500 mt-1 uppercase tracking-widest"><span id="d-label">All Diseases</span> • Total: <span id="d-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                            <select id="d-mode" class="flex-1 xl:flex-none p-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="d-year" class="flex-1 xl:flex-none p-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-[11px] outline-none"></select>
                            <select id="d-month" class="month-selector flex-1 xl:flex-none p-3 bg-amber-50 text-amber-600 rounded-xl font-bold text-[11px] outline-none"></select>
                            <select id="d-brgy" class="flex-1 xl:flex-none p-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none"></select>
                            <div class="relative w-full xl:w-64">
                                <input type="text" id="d-search" placeholder="Search disease..." class="w-full px-4 py-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none">
                                <div id="d-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[400px]"><canvas id="diseaseChart"></canvas></div>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 p-6 lg:p-8 shadow-sm" data-aos="fade-up" data-aos-delay="100">
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-8">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">Inventory Levels</h3>
                            <p class="text-xs font-bold text-emerald-500 mt-1 uppercase tracking-widest"><span id="m-label">All Medicines</span> • Total: <span id="m-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                            <select id="m-mode" class="flex-1 xl:flex-none p-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="m-year" class="flex-1 xl:flex-none p-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-[11px] outline-none"></select>
                            <select id="m-month" class="month-selector flex-1 xl:flex-none p-3 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-[11px] outline-none"></select>
                            <select id="m-brgy" class="flex-1 xl:flex-none p-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none"></select>
                            <div class="relative w-full xl:w-64">
                                <input type="text" id="m-search" placeholder="Search medicine..." class="w-full px-4 py-3 bg-slate-100 rounded-xl font-bold text-[11px] outline-none">
                                <div id="m-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[400px]"><canvas id="stockChart"></canvas></div>
                    
                    <div id="top-meds-container" class="mt-8 pt-8 border-t border-slate-50">
                        <h4 class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Stock Highlights</h4>
                        <div id="top-meds-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ["2024", "2025", "2026"];
        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        let curD = "", curM = "";

        const fill = (id, list, useIdx = false) => {
            document.getElementById(id).innerHTML = list.map((v, i) => `<option value="${useIdx ? i : v}">${v}</option>`).join('');
        };
        fill('d-year', years); fill('m-year', years);
        fill('d-month', months, true); fill('m-month', months, true);
        fill('d-brgy', barangays); fill('m-brgy', barangays);

        document.getElementById('open-sidebar').onclick = () => { document.getElementById('sidebar').classList.add('sidebar-open'); document.getElementById('overlay').classList.add('active'); };
        document.getElementById('close-sidebar').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };
        document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };

        const updateVisibility = (prefix) => {
            const mode = document.getElementById(`${prefix}-mode`).value;
            const monthEl = document.getElementById(`${prefix}-month`);
            monthEl.style.display = mode === 'monthly' ? 'inline-block' : 'none';
            sync();
        };
        document.getElementById('d-mode').addEventListener('change', () => updateVisibility('d'));
        document.getElementById('m-mode').addEventListener('change', () => updateVisibility('m'));

        const opt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
        const dChart = new Chart(document.getElementById('diseaseChart'), { type: 'line', data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f611', fill: true, tension: 0.4 }] }, options: opt });
        const mChart = new Chart(document.getElementById('stockChart'), { type: 'line', data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#10b981', backgroundColor: '#10b98111', fill: true, tension: 0.4 }] }, options: opt });

        // Global storage for medicine data to combine collections
        let masterMedData = {};

        function sync() {
            const dMode = document.getElementById('d-mode').value;
            const dYear = document.getElementById('d-year').value;
            const dMonth = document.getElementById('d-month').value;
            const dBrgy = document.getElementById('d-brgy').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let counts = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = dMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const date = r.createdAt?.toDate();
                    if(!date) return;
                    if((curD === "" || r.name === curD) && (dBrgy === "All Areas" || r.barangay === dBrgy)) {
                        if(dMode === 'yearly' && date.getFullYear() == dYear) { counts[date.getMonth()] += Number(r.count); total += Number(r.count); }
                        else if(dMode === 'monthly' && date.getMonth() == dMonth && date.getFullYear() == dYear) {
                            const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) { counts[wk] += Number(r.count); total += Number(r.count); }
                        }
                    }
                });
                dChart.data.labels = labs; dChart.data.datasets[0].data = counts; dChart.update();
                document.getElementById('d-total').innerText = total.toLocaleString();
            });

            // FIXED Medicine Logic
            const mMode = document.getElementById('m-mode').value;
            const mYear = document.getElementById('m-year').value;
            const mMonth = document.getElementById('m-month').value;
            const mBrgy = document.getElementById('m-brgy').value;

            const targetCols = ["medicine_inventory", "medicine_stocks"];
            
            targetCols.forEach(colName => {
                onSnapshot(collection(db, colName), snap => {
                    masterMedData[colName] = snap.docs.map(d => ({...d.data(), id: d.id}));
                    
                    let combinedCounts = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                    let labs = mMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                    let grandTotal = 0;
                    let ranking = {};

                    Object.values(masterMedData).flat().forEach(r => {
                        const date = r.createdAt?.toDate();
                        if(!date) return;
                        
                        if((curM === "" || r.name === curM) && (mBrgy === "All Areas" || r.barangay === mBrgy)) {
                            const countVal = Number(r.count || 0);
                            
                            if(mMode === 'yearly' && date.getFullYear() == mYear) { 
                                combinedCounts[date.getMonth()] += countVal; grandTotal += countVal; 
                                ranking[r.name] = (ranking[r.name] || 0) + countVal;
                            }
                            else if(mMode === 'monthly' && date.getMonth() == mMonth && date.getFullYear() == mYear) {
                                const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                                if(wk>=0 && wk<5) { combinedCounts[wk] += countVal; grandTotal += countVal; }
                                ranking[r.name] = (ranking[r.name] || 0) + countVal;
                            }
                        }
                    });

                    mChart.data.labels = labs; mChart.data.datasets[0].data = combinedCounts; mChart.update();
                    document.getElementById('m-total').innerText = grandTotal.toLocaleString();
                    
                    // Update Top Medicines UI
                    const topList = Object.entries(ranking).sort((a,b) => b[1]-a[1]).slice(0,3);
                    document.getElementById('top-meds-list').innerHTML = topList.length ? topList.map(([name, qty]) => `
                        <div class="bg-slate-50 p-4 rounded-2xl flex items-center justify-between">
                            <span class="font-bold text-xs text-slate-700">${name}</span>
                            <span class="font-black text-emerald-600 text-sm">${qty.toLocaleString()}</span>
                        </div>
                    `).join('') : '<p class="text-[10px] font-bold text-slate-300">No data for selected period</p>';
                });
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) {
                    const u = s.data(); document.getElementById('welcome-name').innerText = u.name;
                    const isInternal = ['admin', 'bhw', 'rhu'].includes(u.role);
                    if(isInternal) {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if(u.role === 'admin') {
                            document.getElementById('bhw-link').classList.remove('hidden');
                            document.getElementById('rhu-link').classList.remove('hidden');
                        } else {
                            const link = document.getElementById(`${u.role}-link`);
                            if(link) link.classList.remove('hidden');
                        }
                    }
                }
                document.body.classList.add('auth-ready');
                lucide.createIcons();
                AOS.init();
                updateVisibility('d'); updateVisibility('m');
            } else { window.location.href = "login.html"; }
        });

        setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleString(); }, 1000);
        document.querySelectorAll('select').forEach(s => s.addEventListener('change', sync));
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
