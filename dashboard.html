<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gray-white: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; opacity: 0; transition: opacity 0.8s ease-out; }
        .content-visible #main-layout { display: flex; opacity: 1; }
        @media (max-width: 768px) { .sidebar-closed { transform: translateX(-100%); } .sidebar-open { transform: translateX(0); } }
        #loader-container { position: fixed; inset: 0; background-color: var(--bg-gray-white); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded#loader-container { opacity: 0; pointer-events: none; visibility: hidden; }
        .chart-card { background: white; border-radius: 2.5rem; padding: 1.5rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <div id="loader-container">
        <div class="spinner"></div>
    </div>

    <div id="main-layout" class="flex flex-col md:flex-row w-full min-h-screen">
        <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-[60] w-72 bg-white border-r border-slate-100 flex flex-col h-screen transition-transform duration-300 sidebar-closed md:translate-x-0 md:flex">
             <div class="p-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white"><i data-lucide="plus"></i></div>
                    <h1 class="font-bold text-navy text-lg">GUB-UP</h1>
                </div>
                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-brand-blue text-white px-5 py-4 rounded-2xl font-bold">Dashboard</a>
                    <div id="internal-consoles-section" class="pt-6 hidden">
                        <a href="rhu-console.html" id="rhu-disease-link" class="hidden block p-4 bg-red-50 text-red-600 rounded-2xl mb-2">RHU Console</a>
                        <a href="bhw-console.html" id="worker-secret-link" class="hidden block p-4 bg-emerald-50 text-emerald-600 rounded-2xl">BHW Console</a>
                    </div>
                </nav>
             </div>
        </aside>

        <main class="flex-1 overflow-x-hidden p-4 md:p-8 space-y-6">
            <div class="chart-card">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-navy">Disease Active Cases</h3>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <select id="disease-view" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold">
                            <option value="weekly">Weekly</option>
                            <option value="monthly" selected>Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                        <select id="disease-brgy" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold"></select>
                        <select id="disease-cat" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold">
                            <option value="Dengue">Dengue</option>
                            <option value="Flu">Flu</option>
                            <option value="COVID-19">COVID-19</option>
                        </select>
                    </div>
                </div>
                <div class="h-[300px] md:h-[400px]"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-navy">Medicine Inventory</h3>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <select id="stock-view" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold">
                            <option value="weekly">Weekly</option>
                            <option value="monthly" selected>Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                        <select id="stock-brgy" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold"></select>
                        <select id="stock-cat" class="bg-slate-100 rounded-xl px-3 py-2 text-xs font-bold">
                            <option value="Paracetamol">Paracetamol</option>
                            <option value="Amoxicillin">Amoxicillin</option>
                        </select>
                    </div>
                </div>
                <div class="h-[300px] md:h-[400px]"><canvas id="stockChart"></canvas></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { /* ... your config ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const brgys = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const populateBrgy = (id) => {
            document.getElementById(id).innerHTML = `<option value="All">All Barangays</option>` + brgys.map(b => `<option value="${b}">${b}</option>`).join('');
        };
        populateBrgy('disease-brgy'); populateBrgy('stock-brgy');

        // Helper to get labels based on View
        const getLabels = (view) => {
            if(view === 'weekly') return ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            if(view === 'yearly') return ['2022', '2023', '2024', '2025', '2026'];
            return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        };

        const chartConfig = (color) => ({
            type: 'line',
            data: { labels: getLabels('monthly'), datasets: [{ data: [], borderColor: color, backgroundColor: color+'22', fill: true, tension: 0.3 }] },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 10 } } // Auto-scales to fit large numbers
                },
                plugins: { legend: { display: false } }
            }
        });

        const dChart = new Chart(document.getElementById('diseaseChart'), chartConfig('#ef4444'));
        const sChart = new Chart(document.getElementById('stockChart'), chartConfig('#10b981'));

        function syncData(colName, chart, brgyId, catId, viewId, dateField) {
            const brgy = document.getElementById(brgyId).value;
            const cat = document.getElementById(catId).value;
            const view = document.getElementById(viewId).value;

            onSnapshot(collection(db, colName), (snap) => {
                let size = view === 'weekly' ? 7 : (view === 'yearly' ? 5 : 12);
                const results = new Array(size).fill(0);
                chart.data.labels = getLabels(view);

                snap.forEach(doc => {
                    const r = doc.data();
                    if ((brgy === "All" || r.barangay === brgy) && (r.name === cat)) {
                        const date = r[dateField]?.toDate ? r[dateField].toDate() : new Date();
                        let index;
                        if(view === 'weekly') index = (date.getDay() + 6) % 7; // Mon-Sun
                        else if(view === 'yearly') index = date.getFullYear() - 2022;
                        else index = date.getMonth();

                        if(index >= 0 && index < size) results[index] += parseInt(r.count || r.quantity || 0);
                    }
                });
                chart.data.datasets[0].data = results;
                chart.update();
            });
        }

        const triggerSync = () => {
            syncData("disease_cases", dChart, "disease-brgy", "disease-cat", "disease-view", "createdAt");
            syncData("medicine_inventory", sChart, "stock-brgy", "stock-cat", "stock-view", "updatedAt");
        };

        document.querySelectorAll('select').forEach(s => s.addEventListener('change', triggerSync));
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const role = userDoc.data().role;
                    if (role === 'rhu' || role === 'bhw') {
                        document.getElementById('internal-consoles-section').classList.remove('hidden');
                        if(role === 'rhu') document.getElementById('rhu-disease-link').classList.remove('hidden');
                        if(role === 'bhw') document.getElementById('worker-secret-link').classList.remove('hidden');
                    }
                }
                triggerSync();
                document.getElementById('loader-container').classList.add('loaded');
                document.body.classList.add('content-visible');
                lucide.createIcons();
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>
