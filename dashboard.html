<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        .chart-card { background: white; border-radius: 2rem; padding: 1.5rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        #loader-container { position: fixed; inset: 0; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .loaded#loader-container { opacity: 0; pointer-events: none; }
        /* Custom Scrollbar for Search Lists */
        .search-results { max-height: 200px; overflow-y: auto; display: none; position: absolute; width: 100%; z-index: 50; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .search-item { padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
        .search-item:hover { background: #eff6ff; color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex">

    <div id="loader-container">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>

    <aside class="w-72 bg-[#1e293b] text-white flex flex-col h-screen sticky top-0">
        <div class="p-8 flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center"><i data-lucide="plus"></i></div>
            <h1 class="text-xl font-bold tracking-tight">GUB-UP</h1>
        </div>
        
        <nav class="flex-1 px-4 space-y-2">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-4 mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 px-4 py-3 rounded-xl font-semibold shadow-lg">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
            </a>
            <a href="stock.html" class="flex items-center gap-3 text-slate-300 px-4 py-3 rounded-xl font-semibold hover:bg-white/10">
                <i data-lucide="package" class="w-5 h-5"></i> Medicine Stocks
            </a>
            <a href="reports.html" class="flex items-center gap-3 text-slate-300 px-4 py-3 rounded-xl font-semibold hover:bg-white/10">
                <i data-lucide="file-text" class="w-5 h-5"></i> Disease Reports
            </a>
            <a href="hotlines.html" class="flex items-center gap-3 text-slate-300 px-4 py-3 rounded-xl font-semibold hover:bg-white/10">
                <i data-lucide="phone-call" class="w-5 h-5"></i> Emergency Hotlines
            </a>

            <div id="admin-section" class="pt-6 hidden">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-4 mb-2">Internal Consoles</p>
                <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-400 px-4 py-3 rounded-xl font-bold hover:bg-red-500/10">RHU Access</a>
                <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-400 px-4 py-3 rounded-xl font-bold hover:bg-emerald-500/10">BHW Access</a>
            </div>
        </nav>

        <div class="p-4 border-t border-white/10">
            <button id="logout-btn" class="w-full flex items-center gap-3 text-slate-400 hover:text-red-400 px-4 py-3 font-bold transition-all">
                <i data-lucide="log-out"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-navy">Research Monitoring</h2>
            <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl shadow-sm border">
                <span id="user-display" class="font-bold text-navy text-sm">Guest</span>
                <i data-lucide="user" class="w-4 h-4 text-blue-600"></i>
            </div>
        </header>

        <div class="space-y-8 max-w-6xl">
            <div class="chart-card">
                <div class="flex flex-col gap-4 mb-6">
                    <div>
                        <h3 class="text-lg font-bold text-navy">Disease Cases</h3>
                        <p class="text-xs text-slate-400 font-medium"><span id="d-name-label">Select Disease</span> • Total: <span id="d-count" class="text-blue-600 font-bold">0</span></p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <select id="d-year" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"><option value="2025">2025</option><option value="2026">2026</option></select>
                        <select id="d-view" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select>
                        <select id="d-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"></select>
                        <div class="relative">
                            <input type="text" id="d-search" placeholder="Search Disease..." class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none focus:border-blue-600">
                            <div id="d-results" class="search-results"></div>
                        </div>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="flex flex-col gap-4 mb-6">
                    <div>
                        <h3 class="text-lg font-bold text-navy">Medicine Stocks</h3>
                        <p class="text-xs text-slate-400 font-medium"><span id="m-name-label">Select Medicine</span> • Level: <span id="m-count" class="text-emerald-500 font-bold">0</span></p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <select id="m-year" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"><option value="2025">2025</option><option value="2026">2026</option></select>
                        <select id="m-view" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"><option value="monthly">Monthly</option><option value="weekly">Weekly</option></select>
                        <select id="m-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none"></select>
                        <div class="relative">
                            <input type="text" id="m-search" placeholder="Search Medicine..." class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs font-bold outline-none focus:border-blue-600">
                            <div id="m-results" class="search-results"></div>
                        </div>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="stockChart"></canvas></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const diseaseList = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Measles", "Mumps", "Stroke", "Hypertension", "Diabetes", "Asthma", "Tuberculosis (Pulmonary TB)", "Pneumonia (bacterial)", "STIs"]; // (Shortened for space, but you can paste your full list here)
        const medicineList = ["Paracetamol (Acetaminophen)", "Ibuprofen", "Mefenamic acid", "Amoxicillin", "Vitamin A", "Vitamin C", "Amlodipine", "Losartan", "Metformin", "Insulin"]; 

        let selectedDisease = "Dengue fever";
        let selectedMedicine = "Vitamin A";

        // Fill Barangay Dropdowns
        const fillBrgy = (id) => {
            const el = document.getElementById(id);
            el.innerHTML = barangays.map(b => `<option value="${b}">${b}</option>`).join('');
        };
        fillBrgy('d-brgy'); fillBrgy('m-brgy');

        // Search Functionality
        const setupSearch = (inputId, resultsId, list, type) => {
            const input = document.getElementById(inputId);
            const res = document.getElementById(resultsId);
            
            input.onfocus = () => { res.style.display = 'block'; filter(); };
            input.oninput = filter;
            
            function filter() {
                const val = input.value.toLowerCase();
                const filtered = list.filter(i => i.toLowerCase().includes(val));
                res.innerHTML = filtered.map(item => `<div class="search-item">${item}</div>`).join('');
                res.querySelectorAll('.search-item').forEach(el => {
                    el.onclick = () => {
                        input.value = el.innerText;
                        res.style.display = 'none';
                        if(type === 'd') selectedDisease = el.innerText;
                        else selectedMedicine = el.innerText;
                        sync();
                    };
                });
            }
            document.addEventListener('click', (e) => { if(!input.contains(e.target)) res.style.display = 'none'; });
        };
        setupSearch('d-search', 'd-results', diseaseList, 'd');
        setupSearch('m-search', 'm-results', medicineList, 'm');

        // Charts
        const createChart = (id, label, color) => new Chart(document.getElementById(id), {
            type: 'line',
            data: { labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], 
            datasets: [{ label: label, data: [], borderColor: color, backgroundColor: color+'22', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true } } }
        });

        const dChart = createChart('diseaseChart', selectedDisease, '#ef4444');
        const mChart = createChart('stockChart', selectedMedicine, '#10b981');

        function sync() {
            const dy = parseInt(document.getElementById('d-year').value);
            const dbry = document.getElementById('d-brgy').value;
            const my = parseInt(document.getElementById('m-year').value);
            const mbry = document.getElementById('m-brgy').value;

            document.getElementById('d-name-label').innerText = selectedDisease;
            document.getElementById('m-name-label').innerText = selectedMedicine;

            // Update Legends (Removing "undefined")
            dChart.data.datasets[0].label = selectedDisease;
            mChart.data.datasets[0].label = selectedMedicine;

            onSnapshot(collection(db, "disease_cases"), (snap) => {
                const res = new Array(12).fill(0); let total = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if(date && date.getFullYear() === dy && r.name === selectedDisease && (dbry === "All Areas" || r.barangay === dbry)) {
                        res[date.getMonth()] += Number(r.count || 0); total += Number(r.count || 0);
                    }
                });
                document.getElementById('d-count').innerText = total;
                dChart.data.datasets[0].data = res; dChart.update();
            });

            onSnapshot(collection(db, "medicine_inventory"), (snap) => {
                const res = new Array(12).fill(0); let last = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if(date && date.getFullYear() === my && r.name === selectedMedicine && (mbry === "All Areas" || r.barangay === mbry)) {
                        res[date.getMonth()] = Number(r.count || 0); last = Number(r.count || 0);
                    }
                });
                document.getElementById('m-count').innerText = last;
                mChart.data.datasets[0].data = res; mChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) { window.location.href="login.html"; return; }
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if(uDoc.exists()) {
                const d = uDoc.data();
                document.getElementById('user-display').innerText = d.name;
                if(d.role === "rhu" || d.role === "bhw") {
                    document.getElementById('admin-section').classList.remove('hidden');
                    if(d.role === "rhu") document.getElementById('rhu-link').classList.remove('hidden');
                    if(d.role === "bhw") document.getElementById('bhw-link').classList.remove('hidden');
                }
            }
            sync();
            setTimeout(() => { document.getElementById('loader-container').classList.add('loaded'); lucide.createIcons(); }, 1000);
        });

        document.querySelectorAll('select').forEach(s => s.onchange = sync);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href="login.html");
    </script>
</body>
</html>
