<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        
        .month-selector { display: none; } /* Controlled by JS */

        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) { #sidebar { position: sticky; transform: translateX(0); width: 300px; } }
        .sidebar-open { transform: translateX(0) !important; }
        
        #overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(4px); z-index: 900; }
        #overlay.active { display: block; }

        .search-results { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .search-results.active { display: block; }
        
        /* Custom Select Styling */
        select { cursor: pointer; transition: all 0.2s ease; }
        select:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="min-h-screen">
    <div id="overlay"></div>
    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-blue-900 text-xl tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Health System</p>
                        </div>
                    </div>
                    <button id="close-sidebar" class="lg:hidden p-2 hover:bg-slate-50 rounded-lg text-slate-400"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-3.5 rounded-2xl font-semibold shadow-xl shadow-blue-100 transition-all active:scale-95">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-500 hover:text-emerald-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-emerald-50 transition-all">
                        <i data-lucide="package" class="w-5 h-5"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-500 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart" class="w-5 h-5"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-500 hover:text-sky-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-sky-50 transition-all">
                        <i data-lucide="phone" class="w-5 h-5"></i> Hotlines
                    </a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-5">Internal Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-3.5 font-semibold hover:bg-emerald-50 rounded-2xl transition-all">
                            <i data-lucide="user-cog" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-3.5 font-semibold hover:bg-red-50 rounded-2xl transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 min-w-0">
            <header class="bg-white/80 backdrop-blur-md border-b px-6 py-4 sticky top-0 z-30 flex items-center justify-between lg:justify-end">
                <button id="open-sidebar" class="lg:hidden p-2.5 bg-white border border-slate-200 rounded-xl text-blue-900 shadow-sm">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-right">
                        <p id="live-clock" class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">Loading...</p>
                        <h2 class="text-slate-900 font-bold text-sm">Welcome, <span id="welcome-name" class="text-blue-600">User</span></h2>
                    </div>
                    <div class="w-10 h-10 bg-slate-100 rounded-full border-2 border-white shadow-sm flex items-center justify-center text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                </div>
            </header>

            <div class="p-6 lg:p-10 space-y-8 max-w-[1400px] mx-auto">
                
                <div class="bg-white rounded-[2rem] border border-slate-100 p-6 lg:p-8 shadow-sm hover:shadow-md transition-shadow" data-aos="fade-up">
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-8">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">Disease Statistics</h3>
                            <p class="text-xs font-medium text-slate-400 mt-1">Real-time disease case tracking across Gubat</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                            <select id="d-mode" class="flex-1 xl:flex-none p-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 focus:ring-blue-500 outline-none">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="d-year" class="flex-1 xl:flex-none p-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-[11px] border-none ring-1 ring-blue-100 outline-none"></select>
                            
                            <select id="d-month" class="month-selector flex-1 xl:flex-none p-3 bg-amber-50 text-amber-600 rounded-xl font-bold text-[11px] border-none ring-1 ring-amber-100 outline-none"></select>
                            
                            <select id="d-brgy" class="flex-1 xl:flex-none p-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 outline-none"></select>
                            
                            <div class="relative w-full xl:w-64">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                                <input type="text" id="d-search" placeholder="Filter by disease..." class="w-full pl-10 pr-4 py-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 focus:ring-blue-500 outline-none">
                                <div id="d-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[400px] relative">
                        <canvas id="diseaseChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 p-6 lg:p-8 shadow-sm hover:shadow-md transition-shadow" data-aos="fade-up" data-aos-delay="100">
                    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 mb-8">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800">Inventory Levels</h3>
                            <p class="text-xs font-medium text-slate-400 mt-1">Monitoring medical supply availability</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                            <select id="m-mode" class="flex-1 xl:flex-none p-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 outline-none">
                                <option value="yearly">Yearly View</option>
                                <option value="monthly">Monthly View</option>
                            </select>
                            <select id="m-year" class="flex-1 xl:flex-none p-3 bg-blue-50 text-blue-600 rounded-xl font-bold text-[11px] border-none ring-1 ring-blue-100 outline-none"></select>
                            
                            <select id="m-month" class="month-selector flex-1 xl:flex-none p-3 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-[11px] border-none ring-1 ring-emerald-100 outline-none"></select>
                            
                            <select id="m-brgy" class="flex-1 xl:flex-none p-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 outline-none"></select>
                            
                            <div class="relative w-full xl:w-64">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i>
                                <input type="text" id="m-search" placeholder="Filter by medicine..." class="w-full pl-10 pr-4 py-3 bg-slate-50 rounded-xl font-bold text-[11px] border-none ring-1 ring-slate-100 focus:ring-blue-500 outline-none">
                                <div id="m-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[400px] relative">
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ["2024", "2025", "2026"];
        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        let selectedDisease = "";
        let selectedMedicine = "";

        const fill = (id, list, useIdx = false) => {
            document.getElementById(id).innerHTML = list.map((v, i) => `<option value="${useIdx ? i : v}">${v}</option>`).join('');
        };
        fill('d-year', years); fill('m-year', years);
        fill('d-month', months, true); fill('m-month', months, true);
        fill('d-brgy', barangays); fill('m-brgy', barangays);

        // Sidebar Fix
        document.getElementById('open-sidebar').onclick = () => { document.getElementById('sidebar').classList.add('sidebar-open'); document.getElementById('overlay').classList.add('active'); };
        document.getElementById('close-sidebar').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };
        document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };

        // Force Reveal Month Selector
        const toggleMonthCategory = (prefix) => {
            const mode = document.getElementById(`${prefix}-mode`).value;
            const monthEl = document.getElementById(`${prefix}-month`);
            monthEl.style.display = (mode === 'monthly') ? "block" : "none";
            sync();
        };
        document.getElementById('d-mode').onchange = () => toggleMonthCategory('d');
        document.getElementById('m-mode').onchange = () => toggleMonthCategory('m');

        // Charts Initialization (Fixing "Undefined" by providing an empty label string)
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { display: false },
                tooltip: { backgroundColor: '#1e293b', padding: 12, borderRadius: 10 }
            },
            scales: {
                y: { grid: { color: '#f1f5f9' }, border: { display: false } },
                x: { grid: { display: false } }
            }
        };

        const dChart = new Chart(document.getElementById('diseaseChart'), { 
            type: 'line', 
            data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.05)', fill: true, tension: 0.4, borderWeight: 3, pointRadius: 4, pointBackgroundColor: '#fff' }] }, 
            options: commonOptions 
        });

        const mChart = new Chart(document.getElementById('stockChart'), { 
            type: 'line', 
            data: { labels: [], datasets: [{ label: '', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.05)', fill: true, tension: 0.4, borderWeight: 3, pointRadius: 4, pointBackgroundColor: '#fff' }] }, 
            options: commonOptions 
        });

        function sync() {
            const dMode = document.getElementById('d-mode').value;
            const dYear = document.getElementById('d-year').value;
            const dMonth = document.getElementById('d-month').value;
            const dBrgy = document.getElementById('d-brgy').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let counts = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = dMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                snap.forEach(doc => {
                    const r = doc.data(); const date = r.createdAt?.toDate();
                    if(!date) return;
                    if((selectedDisease === "" || r.name === selectedDisease) && (dBrgy === "All Areas" || r.barangay === dBrgy)) {
                        if(dMode === 'yearly' && date.getFullYear() == dYear) counts[date.getMonth()] += Number(r.count);
                        else if(dMode === 'monthly' && date.getMonth() == dMonth && date.getFullYear() == dYear) {
                            const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) counts[wk] += Number(r.count);
                        }
                    }
                });
                dChart.data.labels = labs; 
                dChart.data.datasets[0].label = selectedDisease || "Total Cases"; // Fixed undefined
                dChart.data.datasets[0].data = counts; 
                dChart.update();
            });

            // Inventory Logic
            const mMode = document.getElementById('m-mode').value;
            const mYear = document.getElementById('m-year').value;
            const mMonth = document.getElementById('m-month').value;
            const mBrgy = document.getElementById('m-brgy').value;
            onSnapshot(collection(db, "medicine_inventory"), snap => {
                let counts = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = mMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                snap.forEach(doc => {
                    const r = doc.data(); const date = r.createdAt?.toDate();
                    if(!date) return;
                    if((selectedMedicine === "" || r.name === selectedMedicine) && (mBrgy === "All Areas" || r.barangay === mBrgy)) {
                        if(mMode === 'yearly' && date.getFullYear() == mYear) counts[date.getMonth()] += Number(r.count);
                        else if(mMode === 'monthly' && date.getMonth() == mMonth && date.getFullYear() == mYear) {
                            const wk = Math.ceil((date.getDate() + new Date(date.getFullYear(), date.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) counts[wk] += Number(r.count);
                        }
                    }
                });
                mChart.data.labels = labs; 
                mChart.data.datasets[0].label = selectedMedicine || "Stock Levels"; // Fixed undefined
                mChart.data.datasets[0].data = counts; 
                mChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) {
                    const u = s.data(); document.getElementById('welcome-name').innerText = u.name;
                    if(u.role === 'bhw' || u.role === 'rhu') {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if(u.role === 'bhw') document.getElementById('bhw-link').classList.remove('hidden');
                        if(u.role === 'rhu') document.getElementById('rhu-link').classList.remove('hidden');
                    }
                }
                document.body.classList.add('auth-ready');
                lucide.createIcons();
                AOS.init({ duration: 800, once: true });
                sync();
            } else { window.location.href = "login.html"; }
        });

        // Search logic remains the same (just add selectedDisease = el.innerText inside the click)
        // [Existing search logic from previous snippets can be kept or added here]

        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleString();
        }, 1000);

        document.querySelectorAll('select').forEach(s => s.onchange = sync);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
