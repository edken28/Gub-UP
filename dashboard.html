<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gray-white: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        .bg-navy { background-color: #1e3a8a; }
        #main-layout { display: none; opacity: 0; transition: opacity 0.8s ease-out; }
        .content-visible #main-layout { display: flex; opacity: 1; }
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
        #loader-container {
            position: fixed; inset: 0; background-color: var(--bg-gray-white);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb; border-radius: 50%;
            animation: spin 1s linear infinite; margin-top: 2rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded#loader-container { opacity: 0; pointer-events: none; visibility: hidden; }
        .chart-card { background: white; border-radius: 2.5rem; padding: 1.5rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <div id="loader-container">
        <div class="flex flex-col items-center">
            <div class="flex items-center gap-4 mb-2">
                <div class="w-16 h-16 bg-brand-blue rounded-full flex items-center justify-center text-white shadow-2xl animate-bounce">
                    <i data-lucide="plus" class="w-8 h-8"></i>
                </div>
                <h1 class="text-3xl font-bold text-navy">GUB-UP</h1>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-[60] w-72 bg-white border-r border-slate-100 flex flex-col h-screen transition-transform duration-300 sidebar-closed md:translate-x-0 md:flex">
        <div class="p-8">
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus" class="w-6 h-6"></i></div>
                    <div><h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1><p class="text-[10px] text-brand-blue uppercase font-black tracking-widest mt-1">Health Network</p></div>
                </div>
                <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
            </div>
            <nav class="space-y-3">
                <a href="dashboard.html" class="flex items-center gap-3 bg-brand-blue text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-200">
                    <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></div>
                    <span>Dashboard</span>
                </a>
                <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 hover:text-emerald-600 transition-all group">
                    <div class="w-8 h-8 bg-emerald-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center"><i data-lucide="package" class="w-4 h-4 text-emerald-600 group-hover:text-white"></i></div>
                    <span>Medicine Stocks</span>
                </a>
                <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 hover:text-amber-600 transition-all group">
                    <div class="w-8 h-8 bg-amber-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center"><i data-lucide="file-bar-chart" class="w-4 h-4 text-amber-600 group-hover:text-white"></i></div>
                    <span>Disease Reports</span>
                </a>
                <div id="internal-consoles-section" class="pt-6 pb-2 hidden">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                    <a href="rhu-console.html" id="rhu-disease-link" class="hidden flex items-center gap-3 bg-red-50 text-red-600 px-5 py-4 rounded-2xl font-bold hover:bg-red-600 hover:text-white transition-all mb-2"><i data-lucide="shield-alert" class="w-5 h-5"></i> RHU Console</a>
                    <a href="bhw-console.html" id="worker-secret-link" class="hidden flex items-center gap-3 bg-emerald-50 text-emerald-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-600 hover:text-white transition-all"><i data-lucide="shield-check" class="w-5 h-5"></i> BHW Console</a>
                </div>
            </nav>
        </div>
        <div class="mt-auto p-8 border-t border-slate-50">
            <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i> Logout</button>
        </div>
    </aside>

    <main id="main-layout" class="flex-1 overflow-x-hidden">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
            <h2 class="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">Health Analytics Dashboard</h2>
            <div id="user-display" class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl">
                <span id="user-name-display" class="font-bold text-navy text-xs">Guest</span>
            </div>
        </header>

        <div class="p-4 md:p-8 max-w-7xl mx-auto space-y-8">
            <div class="chart-card">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-red-600">Active Disease Cases</h3>
                        <p class="text-xs text-slate-400">Monthly trend monitoring</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <select id="disease-brgy" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy brgy-list"></select>
                        <select id="disease-cat" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy">
                            <option value="Dengue">Dengue</option>
                            <option value="Flu">Flu</option>
                            <option value="COVID-19">COVID-19</option>
                        </select>
                        <select id="disease-year" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy">
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                        </select>
                    </div>
                </div>
                <div class="h-[300px] w-full"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-emerald-600">Medicine Inventory</h3>
                        <p class="text-xs text-slate-400">Stock level tracking</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <select id="stock-brgy" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy brgy-list"></select>
                        <select id="stock-cat" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy">
                            <option value="Paracetamol">Paracetamol</option>
                            <option value="Amoxicillin">Amoxicillin</option>
                        </select>
                        <select id="stock-year" class="bg-slate-50 border rounded-xl px-2 py-2 text-[10px] font-bold text-navy">
                            <option value="2026">2026</option>
                        </select>
                    </div>
                </div>
                <div class="h-[300px] w-full"><canvas id="stockChart"></canvas></div>
            </div>
        </div>
    </main>

    <script type="module">

        const firebaseConfig = {

            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        // Populate Dropdowns
        document.querySelectorAll('.brgy-list').forEach(select => {
            select.innerHTML = `<option value="All">All Barangays</option>` + barangays.map(b => `<option value="${b}">${b}</option>`).join('');
        });

        // Setup Charts
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const diseaseCtx = document.getElementById('diseaseChart').getContext('2d');
        const stockCtx = document.getElementById('stockChart').getContext('2d');

        let diseaseChart = new Chart(diseaseCtx, {
            type: 'line',
            data: { labels: months, datasets: [{ label: 'Cases', borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.4, data: Array(12).fill(0) }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        let stockChart = new Chart(stockCtx, {
            type: 'line',
            data: { labels: months, datasets: [{ label: 'Stock', borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4, data: Array(12).fill(0) }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Role-based Access & Initialization
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const userData = userDoc.data();
                document.getElementById('user-name-display').innerText = userData.name;
                if (userData.role === "rhu" || userData.role === "bhw") {
                    document.getElementById('internal-consoles-section').classList.remove('hidden');
                    if (userData.role === "rhu") document.getElementById('rhu-disease-link').classList.remove('hidden');
                    if (userData.role === "bhw") document.getElementById('worker-secret-link').classList.remove('hidden');
                }
            }
            document.getElementById('loader-container').classList.add('loaded');
            document.body.classList.add('content-visible');
            lucide.createIcons();
            loadDiseaseData();
            loadStockData();
        });

        function loadStockData() {

    </script>
</body>
</html>
