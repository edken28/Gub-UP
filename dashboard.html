<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gray-white: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; opacity: 0; transition: opacity 0.8s ease-out; }
        .content-visible #main-layout { display: flex; opacity: 1; }
        .chart-card { background: white; border-radius: 2.5rem; padding: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        #loader-container { position: fixed; inset: 0; background: var(--bg-gray-white); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded#loader-container { opacity: 0; pointer-events: none; visibility: hidden; transition: 0.5s; }
        @media (max-width: 768px) { .sidebar-closed { transform: translateX(-100%); } .sidebar-open { transform: translateX(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row">

    <div id="loader-container">
        <div class="flex flex-col items-center">
            <div class="spinner"></div>
            <h1 class="mt-4 font-bold text-navy">GUB-UP Syncing...</h1>
        </div>
    </div>

    <div id="main-layout" class="flex flex-col md:flex-row w-full min-h-screen">
        <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-[60] w-72 bg-white border-r border-slate-100 flex flex-col h-screen transition-transform duration-300 sidebar-closed md:translate-x-0">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                    <h1 class="font-bold text-navy text-lg">GUB-UP</h1>
                </div>
                <nav class="space-y-3">
                    <a href="#" class="flex items-center gap-3 bg-brand-blue text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-200">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50">
                        <i data-lucide="package" class="w-4 h-4 text-emerald-500"></i> Stocks
                    </a>
                    <div id="internal-consoles-section" class="pt-6 hidden">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-5 mb-2">Internal</p>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 bg-red-50 text-red-600 px-5 py-4 rounded-2xl font-bold mb-2">RHU Console</a>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 bg-emerald-50 text-emerald-600 px-5 py-4 rounded-2xl font-bold">BHW Console</a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t"><button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full"><i data-lucide="log-out"></i> Logout</button></div>
        </aside>

        <main class="flex-1 p-4 md:p-8 space-y-8">
            <header class="flex justify-between items-center mb-8">
                <button onclick="toggleSidebar()" class="md:hidden p-2 bg-white rounded-xl"><i data-lucide="menu"></i></button>
                <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-2xl shadow-sm">
                    <span id="user-name-display" class="font-bold text-navy text-sm">Loading...</span>
                </div>
            </header>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-100 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="font-bold text-navy">Research Period</h2>
                    <p class="text-xs text-slate-400">Select the year to view health trends</p>
                </div>
                <select id="year-filter" class="bg-brand-blue text-white rounded-xl px-6 py-3 font-bold outline-none shadow-lg">
                    <option value="2024">Year 2024</option>
                    <option value="2025" selected>Year 2025</option>
                    <option value="2026">Year 2026</option>
                </select>
            </div>

            <div class="chart-card">
                <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-navy">Disease Trends</h3>
                        <div class="mt-2 bg-red-50 text-red-600 px-4 py-1 rounded-full text-xs font-bold inline-block">
                            Total Cases: <span id="total-disease-count">0</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select id="disease-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                        <select id="disease-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-navy">Medicine Inventory</h3>
                        <div class="mt-2 bg-emerald-50 text-emerald-600 px-4 py-1 rounded-full text-xs font-bold inline-block">
                            Latest Level: <span id="total-stock-count">0</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select id="stock-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                        <select id="stock-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="stockChart"></canvas></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const diseases = ["Stroke", "Dengue", "Flu", "COVID-19", "Tuberculosis", "Pneumonia", "Hypertension", "Diabetes", "Asthma", "Diarrhea", "Measles"];
        const medicines = ["Vitamin A", "Paracetamol", "Ibuprofen", "Mefenamic acid", "Amoxicillin", "Vitamin C", "Amlodipine", "Losartan", "Metformin"];

        const populate = (id, list, all = true) => {
            const el = document.getElementById(id);
            el.innerHTML = (all ? '<option value="All">All Barangays</option>' : '') + list.map(i => `<option value="${i}">${i}</option>`).join('');
        };

        populate('disease-brgy', barangays);
        populate('stock-brgy', barangays);
        populate('disease-cat', diseases, false);
        populate('stock-cat', medicines, false);

        const createChart = (id, color) => new Chart(document.getElementById(id), {
            type: 'line',
            data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], datasets: [{ data: [], borderColor: color, backgroundColor: color + '1A', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
        });

        const dChart = createChart('diseaseChart', '#ef4444');
        const sChart = createChart('stockChart', '#10b981');

        function sync() {
            const year = parseInt(document.getElementById('year-filter').value);
            const dbry = document.getElementById('disease-brgy').value;
            const dcat = document.getElementById('disease-cat').value;
            const sbry = document.getElementById('stock-brgy').value;
            const scat = document.getElementById('stock-cat').value;

            // DISEASE LOGIC
            onSnapshot(collection(db, "disease_cases"), (snap) => {
                const results = new Array(12).fill(0);
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if (date && date.getFullYear() === year) {
                        if ((dbry === "All" || r.barangay === dbry) && r.name.trim().toLowerCase() === dcat.toLowerCase()) {
                            const val = Number(r.count || 0);
                            results[date.getMonth()] += val;
                            total += val;
                        }
                    }
                });
                document.getElementById('total-disease-count').innerText = total;
                dChart.data.datasets[0].data = results;
                dChart.update();
            });

            // STOCK LOGIC
            onSnapshot(collection(db, "medicine_inventory"), (snap) => {
                const results = new Array(12).fill(0);
                let latest = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if (date && date.getFullYear() === year) {
                        if ((sbry === "All" || r.barangay === sbry) && r.name.trim().toLowerCase() === scat.toLowerCase()) {
                            const val = Number(r.count || 0);
                            results[date.getMonth()] = val;
                            latest = val;
                        }
                    }
                });
                document.getElementById('total-stock-count').innerText = latest;
                sChart.data.datasets[0].data = results;
                sChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if (uDoc.exists()) {
                const d = uDoc.data();
                document.getElementById('user-name-display').innerText = d.name;
                if (d.role === "rhu" || d.role === "bhw") {
                    document.getElementById('internal-consoles-section').classList.remove('hidden');
                    if (d.role === "rhu") document.getElementById('rhu-link').classList.remove('hidden');
                    if (d.role === "bhw") document.getElementById('bhw-link').classList.remove('hidden');
                }
            }
            sync();
            setTimeout(() => { document.getElementById('loader-container').classList.add('loaded'); document.body.classList.add('content-visible'); lucide.createIcons(); AOS.init(); }, 800);
        });

        document.querySelectorAll('select').forEach(s => s.addEventListener('change', sync));
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
        window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('sidebar-closed'); document.getElementById('sidebar').classList.toggle('sidebar-open'); };
    </script>
</body>
</html>
