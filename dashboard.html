<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        
        /* Sidebar Styling */
        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s ease;
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) { #sidebar { position: sticky; transform: translateX(0); width: 300px; } }
        .sidebar-open { transform: translateX(0) !important; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 900; }
        #overlay.active { display: block; }

        /* Search Results */
        .search-results { 
            display: none; position: absolute; top: 100%; left: 0; right: 0; 
            background: white; border: 1px solid #e2e8f0; border-radius: 1rem; 
            max-height: 250px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
        }
        .search-results.active { display: block; }
        .search-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 500; }
        .search-item:hover { background: #f0f9ff; color: #2563eb; }
    </style>
</head>
<body class="min-h-screen">

    <div id="overlay"></div>

    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-blue-900 text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button id="close-sidebar" class="lg:hidden text-slate-400"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-blue-100">
                        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50">
                        <i data-lucide="package" class="text-emerald-500"></i><span>Medicine Stocks</span>
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50">
                        <i data-lucide="file-bar-chart" class="text-amber-500"></i><span>Disease Reports</span>
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-sky-50">
                        <i data-lucide="phone" class="text-sky-500"></i><span>Hotlines</span>
                    </a>

                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-5 mb-2">Internal Consoles</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 mb-1"><i data-lucide="user-cog"></i> BHW</a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-4 rounded-2xl font-bold hover:bg-red-50"><i data-lucide="shield-check"></i> RHU</a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full"><i data-lucide="log-out"></i> Logout</button>
            </div>
        </aside>

        <main class="flex-1 w-full">
            <div class="lg:hidden bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-40">
                <button id="open-sidebar" class="p-2 bg-slate-50 rounded-xl text-blue-900"><i data-lucide="menu"></i></button>
                <div class="w-8 h-8 bg-blue-50 rounded-full flex items-center justify-center text-blue-600"><i data-lucide="user" class="w-4 h-4"></i></div>
            </div>

            <header class="bg-white/80 backdrop-blur-md border-b px-6 md:px-10 py-6 sticky top-0 z-30">
                <div id="live-clock" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">Loading...</div>
                <h1 class="text-blue-900 font-bold text-2xl">Welcome, <span id="welcome-name">User</span>!</h1>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto space-y-8">
                
                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-6 md:p-10 shadow-sm" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10">
                        <div>
                            <h3 class="text-2xl font-bold text-blue-900">Disease Cases</h3>
                            <p class="text-[10px] font-black text-red-500 uppercase tracking-widest mt-1"><span id="d-label">All Diseases</span> • Total: <span id="d-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                            <select id="d-mode" class="p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none">
                                <option value="yearly">Yearly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                            <select id="d-year" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs outline-none"></select>
                            <select id="d-month" class="hidden p-3 bg-amber-50 rounded-2xl font-bold text-amber-600 text-xs outline-none"></select>
                            <select id="d-brgy" class="p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none"></select>
                            <div class="relative flex-1 min-w-[180px]">
                                <input type="text" id="d-search" placeholder="Search Disease..." class="w-full p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none">
                                <div id="d-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="diseaseChart"></canvas></div>
                </div>

                <div class="bg-white rounded-[2.5rem] border border-slate-100 p-6 md:p-10 shadow-sm" data-aos="fade-up">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-10">
                        <div>
                            <h3 class="text-2xl font-bold text-blue-900">Medicine Stocks</h3>
                            <p class="text-[10px] font-black text-emerald-500 uppercase tracking-widest mt-1"><span id="m-label">All Medicines</span> • Total: <span id="m-total">0</span></p>
                        </div>
                        <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                            <select id="m-mode" class="p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none">
                                <option value="yearly">Yearly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                            <select id="m-year" class="p-3 bg-blue-50 rounded-2xl font-bold text-blue-600 text-xs outline-none"></select>
                            <select id="m-month" class="hidden p-3 bg-emerald-50 rounded-2xl font-bold text-emerald-600 text-xs outline-none"></select>
                            <select id="m-brgy" class="p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none"></select>
                            <div class="relative flex-1 min-w-[180px]">
                                <input type="text" id="m-search" placeholder="Search Medicine..." class="w-full p-3 bg-slate-100 rounded-2xl font-bold text-blue-900 text-xs outline-none">
                                <div id="m-results" class="search-results"></div>
                            </div>
                        </div>
                    </div>
                    <div class="h-[350px]"><canvas id="stockChart"></canvas></div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const years = ["2024", "2025", "2026"];
        const barangays = ["All Areas", "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        
        // Full Lists
        const diseases = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Measles", "Mumps", "Rubella", "Tuberculosis", "Hypertension", "Diabetes", "Asthma"];
        const medicines = ["Paracetamol", "Ibuprofen", "Amoxicillin", "Amlodipine", "Losartan", "Metformin", "Vitamin C", "Multivitamins", "Alcohol"];

        let curD = "", curM = "";

        // UI HELPERS
        const fill = (id, list, useIdx = false) => {
            document.getElementById(id).innerHTML = list.map((v, i) => `<option value="${useIdx ? i : v}">${v}</option>`).join('');
        };
        fill('d-year', years); fill('m-year', years);
        fill('d-month', months, true); fill('m-month', months, true);
        fill('d-brgy', barangays); fill('m-brgy', barangays);

        // Sidebar Fix
        const toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('sidebar-open');
            document.getElementById('overlay').classList.toggle('active');
        };
        document.getElementById('open-sidebar').onclick = toggleSidebar;
        document.getElementById('close-sidebar').onclick = toggleSidebar;
        document.getElementById('overlay').onclick = toggleSidebar;

        // POP-UP TRIGGER (THE FIX)
        const toggleMonthCategory = (prefix) => {
            const mode = document.getElementById(`${prefix}-mode`).value;
            const monthEl = document.getElementById(`${prefix}-month`);
            if (mode === 'monthly') {
                monthEl.classList.remove('hidden');
            } else {
                monthEl.classList.add('hidden');
            }
            sync(); // Refresh graph
        };

        document.getElementById('d-mode').onchange = () => toggleMonthCategory('d');
        document.getElementById('m-mode').onchange = () => toggleMonthCategory('m');

        // Charts
        const dChart = new Chart(document.getElementById('diseaseChart'), { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#ef4444', backgroundColor: '#ef444411', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        const mChart = new Chart(document.getElementById('stockChart'), { type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#10b981', backgroundColor: '#10b98111', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });

        // Database Sync
        function sync() {
            const dMode = document.getElementById('d-mode').value;
            const dYear = document.getElementById('d-year').value;
            const dMonth = document.getElementById('d-month').value;
            const dBrgy = document.getElementById('d-brgy').value;

            onSnapshot(collection(db, "disease_cases"), snap => {
                let data = dMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = dMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if(!d) return;
                    if((curD==="" || r.name===curD) && (dBrgy==="All Areas" || r.barangay===dBrgy)) {
                        if(dMode==='yearly' && d.getFullYear() == dYear) { data[d.getMonth()] += Number(r.count||0); total += Number(r.count||0); }
                        else if(dMode==='monthly' && d.getMonth() == dMonth && d.getFullYear() == dYear) {
                            const wk = Math.ceil((d.getDate() + new Date(d.getFullYear(), d.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) data[wk] += Number(r.count||0); total += Number(r.count||0);
                        }
                    }
                });
                dChart.data.labels = labs; dChart.data.datasets[0].data = data; dChart.update();
                document.getElementById('d-total').innerText = total;
            });
            
            // Medicine Sync (same logic)
            const mMode = document.getElementById('m-mode').value;
            const mYear = document.getElementById('m-year').value;
            const mMonth = document.getElementById('m-month').value;
            const mBrgy = document.getElementById('m-brgy').value;

            onSnapshot(collection(db, "medicine_inventory"), snap => {
                let data = mMode === 'yearly' ? new Array(12).fill(0) : new Array(5).fill(0);
                let labs = mMode === 'yearly' ? months.map(m => m.substring(0,3)) : ["Wk 1", "Wk 2", "Wk 3", "Wk 4", "Wk 5"];
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data(); const d = r.createdAt?.toDate();
                    if(!d) return;
                    if((curM==="" || r.name===curM) && (mBrgy==="All Areas" || r.barangay===mBrgy)) {
                        if(mMode==='yearly' && d.getFullYear() == mYear) { data[d.getMonth()] += Number(r.count||0); total += Number(r.count||0); }
                        else if(mMode==='monthly' && d.getMonth() == mMonth && d.getFullYear() == mYear) {
                            const wk = Math.ceil((d.getDate() + new Date(d.getFullYear(), d.getMonth(), 1).getDay()) / 7) - 1;
                            if(wk>=0 && wk<5) data[wk] += Number(r.count||0); total += Number(r.count||0);
                        }
                    }
                });
                mChart.data.labels = labs; mChart.data.datasets[0].data = data; mChart.update();
                document.getElementById('m-total').innerText = total;
            });
        }

        // AUTH & ROLES
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) {
                    const u = s.data(); document.getElementById('welcome-name').innerText = u.name;
                    if(u.role === 'bhw' || u.role === 'rhu') {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if(u.role === 'bhw') document.getElementById('bhw-link').classList.remove('hidden');
                        if(u.role === 'rhu') document.getElementById('rhu-link').classList.remove('hidden');
                    }
                }
                document.body.classList.add('auth-ready');
                AOS.init({ duration: 800, once: true });
                lucide.createIcons();
                sync();
            } else { window.location.href = "login.html"; }
        });

        // Search Handlers
        const setupSearch = (inputId, resId, list, type) => {
            const input = document.getElementById(inputId);
            const res = document.getElementById(resId);
            input.oninput = () => {
                const q = input.value.toLowerCase();
                const filtered = list.filter(i => i.toLowerCase().includes(q));
                res.innerHTML = filtered.map(i => `<div class="search-item">${i}</div>`).join('');
                res.classList.toggle('active', q.length > 0);
                res.querySelectorAll('.search-item').forEach(el => {
                    el.onclick = () => {
                        input.value = el.innerText;
                        res.classList.remove('active');
                        if (type === 'd') { curD = el.innerText; document.getElementById('d-label').innerText = el.innerText; }
                        else { curM = el.innerText; document.getElementById('m-label').innerText = el.innerText; }
                        sync();
                    };
                });
            };
        };
        setupSearch('d-search', 'd-results', diseases, 'd');
        setupSearch('m-search', 'm-results', medicines, 'm');

        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }, 1000);

        document.querySelectorAll('select').forEach(s => s.onchange = sync);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
