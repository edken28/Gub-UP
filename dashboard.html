<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-gray-white: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        #main-layout { display: none; opacity: 0; transition: opacity 0.8s ease-out; }
        .content-visible #main-layout { display: flex; opacity: 1; }
        .chart-card { background: white; border-radius: 2.5rem; padding: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        select { cursor: pointer; transition: all 0.2s; }
        select:hover { border-color: #2563eb; }
        #loader-container { position: fixed; inset: 0; background: var(--bg-gray-white); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loaded#loader-container { opacity: 0; pointer-events: none; visibility: hidden; transition: 0.5s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="loader-container">
        <div class="flex flex-col items-center">
            <div class="spinner"></div>
            <h1 class="mt-4 font-bold text-navy">GUB-UP Research Portal</h1>
        </div>
    </div>

    <div id="main-layout" class="flex flex-col md:flex-row w-full min-h-screen">
        <aside id="sidebar" class="fixed md:sticky top-0 left-0 z-[60] w-72 bg-white border-r border-slate-100 flex flex-col h-screen transition-transform duration-300 -translate-x-full md:translate-x-0">
            <div class="p-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white"><i data-lucide="plus"></i></div>
                    <h1 class="font-bold text-navy text-xl">GUB-UP</h1>
                </div>
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-brand-blue text-white px-5 py-4 rounded-2xl font-bold shadow-lg">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50">
                        <i data-lucide="package" class="w-4 h-4 text-emerald-500"></i> Stocks
                    </a>
                    <div id="internal-consoles-section" class="pt-6 hidden">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-5 mb-2">Consoles</p>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 bg-red-50 text-red-600 px-5 py-4 rounded-2xl font-bold mb-2">RHU Access</a>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 bg-emerald-50 text-emerald-600 px-5 py-4 rounded-2xl font-bold">BHW Access</a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold"><i data-lucide="log-out"></i> Logout</button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8 space-y-8 overflow-x-hidden">
            <header class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Live Research Monitoring</h2>
                <div class="bg-white px-4 py-2 rounded-2xl shadow-sm flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-50 text-brand-blue rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-sm">Guest</span>
                </div>
            </header>

            <div class="chart-card">
                <div class="flex flex-col gap-6 mb-8">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 id="disease-title-dynamic" class="text-xl font-bold text-navy">Loading Disease Trends...</h3>
                            <p class="text-xs text-slate-400 mt-1">Total Reported Cases: <span id="total-d-count" class="text-brand-blue font-bold">0</span></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <select id="d-year" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy">
                            <option value="2024">2024</option>
                            <option value="2025" selected>2025</option>
                            <option value="2026">2026</option>
                        </select>
                        <select id="d-view" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy">
                            <option value="monthly">Monthly</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <select id="d-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                        <select id="d-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="diseaseChart"></canvas></div>
            </div>

            <div class="chart-card">
                <div class="flex flex-col gap-6 mb-8">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 id="medicine-title-dynamic" class="text-xl font-bold text-navy">Loading Inventory Trends...</h3>
                            <p class="text-xs text-slate-400 mt-1">Latest Stock Count: <span id="total-m-count" class="text-emerald-500 font-bold">0</span></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <select id="m-year" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy">
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026" selected>2026</option>
                        </select>
                        <select id="m-view" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy">
                            <option value="monthly">Monthly</option>
                            <option value="weekly">Weekly</option>
                        </select>
                        <select id="m-brgy" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                        <select id="m-cat" class="bg-slate-50 border rounded-xl px-3 py-2 text-[10px] font-bold text-navy"></select>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="stockChart"></canvas></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];
        const diseaseList = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox (Varicella)", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", "Human papillomavirus (HPV) infection", "Cytomegalovirus infection", "Epstein-Barr virus infection", "Viral gastroenteritis", "Viral meningitis", "Viral pneumonia", "Tuberculosis (Pulmonary TB)", "Extrapulmonary tuberculosis", "Multidrug-resistant TB", "Pneumonia (bacterial)", "Typhoid fever", "Paratyphoid fever", "Leptospirosis", "Cholera", "Shigellosis", "Diphtheria", "Pertussis (Whooping cough)", "Tetanus", "Neonatal tetanus", "Meningococcal meningitis", "Bacterial meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Chlamydia", "Bacterial skin infections", "Cellulitis", "Impetigo", "Rheumatic fever", "Rheumatic heart disease", "Scarlet fever", "Sepsis", "Anthrax", "Helicobacter pylori infection", "Malaria", "Schistosomiasis", "Ascariasis", "Trichuriasis", "Hookworm infection", "Filariasis", "Amebiasis", "Giardiasis", "Toxoplasmosis", "Strongyloidiasis", "Taeniasis (Tapeworm)", "Cysticercosis", "Cryptosporidiosis", "Candidiasis", "Tinea (Ringworm)", "Athlete’s foot", "Onychomycosis", "Aspergillosis", "Histoplasmosis", "Cryptococcosis", "Hypertension", "Coronary artery disease", "Myocardial infarction (Heart attack)", "Stroke", "Heart failure", "Arrhythmia", "Cardiomyopathy", "Peripheral artery disease", "Type 1 diabetes", "Type 2 diabetes", "Prediabetes", "Dyslipidemia", "Obesity", "Metabolic syndrome", "Hyperthyroidism", "Hypothyroidism", "Goiter", "Polycystic ovary syndrome (PCOS)", "Asthma", "COPD", "Chronic bronchitis", "Emphysema", "Allergic rhinitis", "Sinusitis", "Pulmonary fibrosis", "Breast cancer", "Lung cancer", "Liver cancer", "Colorectal cancer", "Cervical cancer", "Prostate cancer", "Stomach cancer", "Nasopharyngeal cancer", "Ovarian cancer", "Pancreatic cancer", "Leukemia", "Lymphoma", "Thyroid cancer", "Skin cancer", "Depression", "Anxiety disorders", "Bipolar disorder", "Schizophrenia", "Epilepsy", "Migraine", "Alzheimer’s disease", "Parkinson’s disease", "Dementia", "Stroke-related neurological deficits", "Malnutrition", "Stunting", "Wasting", "Vitamin A deficiency", "Iron deficiency anemia", "Iodine deficiency disorder", "Rickets", "Kwashiorkor", "Marasmus", "Acute gastroenteritis", "Flood-related leptospirosis", "Skin fungal infections (post-flood)", "Conjunctivitis", "Diarrheal diseases", "Kidney stones", "Chronic kidney disease", "Urinary tract stones", "Gallstones", "Peptic ulcer disease", "Gastroesophageal reflux disease (GERD)", "Arthritis", "Osteoarthritis", "Rheumatoid arthritis", "Gout", "Osteoporosis", "Back pain", "Scoliosis", "Hernia", "Hemorrhoids", "Appendicitis", "Gallbladder disease", "Dental caries", "Periodontal disease", "Acne", "Eczema", "Psoriasis", "Scabies", "Contact dermatitis", "Heat rash (Prickly heat)", "Urticaria (Hives)", "Keloids", "Alcohol use disorder", "Liver cirrhosis", "Fatty liver disease", "Drug dependence", "Nicotine dependence", "Substance-induced psychosis", "Endometriosis", "Uterine fibroids", "Pelvic inflammatory disease", "Ectopic pregnancy", "Pre-eclampsia", "Gestational diabetes", "Infertility", "STIs"];
        const medicineList = ["Paracetamol (Acetaminophen)", "Ibuprofen", "Mefenamic acid", "Aspirin", "Naproxen", "Diclofenac", "Celecoxib", "Ketoprofen", "Phenylephrine", "Pseudoephedrine", "Chlorphenamine", "Diphenhydramine", "Cetirizine", "Loratadine", "Carbocisteine", "Ambroxol", "Guaifenesin", "Dextromethorphan", "Salbutamol inhaler", "Oxymetazoline nasal spray", "Steam inhalation solutions", "Fexofenadine", "Levocetirizine", "Hydrocortisone cream", "Antacids (Aluminum hydroxide, Magnesium hydroxide)", "Sodium bicarbonate", "Omeprazole", "Lansoprazole", "Pantoprazole", "Esomeprazole", "Loperamide", "Oral Rehydration Salts (ORS)", "Simethicone", "Domperidone", "Metoclopramide", "Hyoscine butylbromide", "Povidone iodine", "Hydrogen peroxide", "Mupirocin ointment", "Clotrimazole cream", "Ketoconazole cream", "Calamine lotion", "Zinc oxide", "Permethrin", "Acyclovir cream", "Amoxicillin", "Amoxicillin + Clavulanic acid", "Azithromycin", "Clarithromycin", "Cefuroxime", "Ceftriaxone", "Ciprofloxacin", "Levofloxacin", "Doxycycline", "Metronidazole", "Co-trimoxazole", "Isoniazid", "Rifampicin", "Pyrazinamide", "Ethambutol", "Fixed-dose TB combinations", "Amlodipine", "Losartan", "Telmisartan", "Captopril", "Enalapril", "Metoprolol", "Atenolol", "Hydrochlorothiazide", "Metformin", "Glimepiride", "Gliclazide", "Insulin (Regular, NPH, Glargine)", "Sitagliptin", "Empagliflozin", "Atorvastatin", "Simvastatin", "Rosuvastatin", "Budesonide inhaler", "Fluticasone", "Ipratropium bromide", "Fluoxetine", "Sertraline", "Escitalopram", "Amitriptyline", "Risperidone", "Quetiapine", "Alprazolam", "Diazepam", "Vitamin A", "Vitamin B1 (Thiamine)", "Vitamin B6", "Vitamin B12", "Vitamin C", "Vitamin D3", "Vitamin E", "Vitamin K", "B-complex capsules", "B1 + B6 + B12 combinations", "Iron (Ferrous sulfate)", "Calcium carbonate", "Calcium + Vitamin D", "Magnesium", "Zinc", "Potassium supplements", "Adult multivitamins", "Children’s multivitamins", "Prenatal vitamins", "Senior vitamins", "Probiotics", "Fish oil (Omega-3)", "Glutathione", "Antiseptic alcohol", "Hand sanitizer", "Thermometer", "Blood pressure monitor", "Glucometer", "Nebulizer solution", "Activated charcoal", "Epinephrine injection"];

        const populateSelect = (id, list, addAll = true) => {
            const el = document.getElementById(id);
            let html = addAll ? '<option value="All">All Areas</option>' : '';
            html += list.map(i => `<option value="${i}">${i}</option>`).join('');
            el.innerHTML = html;
        };

        populateSelect('d-brgy', barangays);
        populateSelect('m-brgy', barangays);
        populateSelect('d-cat', diseaseList, false);
        populateSelect('m-cat', medicineList, false);

        const getLabels = (view) => view === 'weekly' ? ['W1', 'W2', 'W3', 'W4'] : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        const createChart = (id, color) => new Chart(document.getElementById(id), {
            type: 'line',
            data: { labels: getLabels('monthly'), datasets: [{ data: [], borderColor: color, backgroundColor: color + '1A', fill: true, tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
        });

        const dChart = createChart('diseaseChart', '#ef4444');
        const mChart = createChart('stockChart', '#10b981');

        function syncData() {
            // -- DISEASE SYNC --
            const dy = parseInt(document.getElementById('d-year').value);
            const dv = document.getElementById('d-view').value;
            const dbry = document.getElementById('d-brgy').value;
            const dcat = document.getElementById('d-cat').value;
            
            document.getElementById('disease-title-dynamic').innerText = `${dcat} Trends (${dy})`;

            onSnapshot(collection(db, "disease_cases"), (snap) => {
                const results = new Array(getLabels(dv).length).fill(0);
                let total = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if (date && date.getFullYear() === dy) {
                        const nameMatch = r.name.trim().toLowerCase() === dcat.trim().toLowerCase();
                        if ((dbry === "All" || r.barangay === dbry) && nameMatch) {
                            const i = dv === 'monthly' ? date.getMonth() : Math.floor((date.getDate()-1)/7);
                            const val = Number(r.count || 0);
                            if (i >= 0 && i < results.length) { results[i] += val; total += val; }
                        }
                    }
                });
                document.getElementById('total-d-count').innerText = total;
                dChart.data.labels = getLabels(dv);
                dChart.data.datasets[0].data = results;
                dChart.update();
            });

            // -- MEDICINE SYNC --
            const my = parseInt(document.getElementById('m-year').value);
            const mv = document.getElementById('m-view').value;
            const mbry = document.getElementById('m-brgy').value;
            const mcat = document.getElementById('m-cat').value;

            document.getElementById('medicine-title-dynamic').innerText = `${mcat} Inventory (${my})`;

            onSnapshot(collection(db, "medicine_inventory"), (snap) => {
                const results = new Array(getLabels(mv).length).fill(0);
                let latest = 0;
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate ? r.createdAt.toDate() : null;
                    if (date && date.getFullYear() === my) {
                        const nameMatch = r.name.trim().toLowerCase() === mcat.trim().toLowerCase();
                        if ((mbry === "All" || r.barangay === mbry) && nameMatch) {
                            const i = mv === 'monthly' ? date.getMonth() : Math.floor((date.getDate()-1)/7);
                            const val = Number(r.count || 0);
                            if (i >= 0 && i < results.length) { results[i] = val; latest = val; }
                        }
                    }
                });
                document.getElementById('total-m-count').innerText = latest;
                mChart.data.labels = getLabels(mv);
                mChart.data.datasets[0].data = results;
                mChart.update();
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            const uDoc = await getDoc(doc(db, "users", user.uid));
            if (uDoc.exists()) {
                const d = uDoc.data();
                document.getElementById('user-name-display').innerText = d.name;
                if (d.role === "rhu" || d.role === "bhw") {
                    document.getElementById('internal-consoles-section').classList.remove('hidden');
                    if (d.role === "rhu") document.getElementById('rhu-link').classList.remove('hidden');
                    if (d.role === "bhw") document.getElementById('bhw-link').classList.remove('hidden');
                }
            }
            syncData();
            setTimeout(() => { document.getElementById('loader-container').classList.add('loaded'); document.body.classList.add('content-visible'); lucide.createIcons(); }, 800);
        });

        document.querySelectorAll('select').forEach(s => s.addEventListener('change', syncData));
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
