<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
        input[type="radio"]:checked + .role-card { border-color: #2563eb; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full animate-fade-up">
        <div class="bg-white rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border border-slate-100">
            
            <div class="bg-brand-blue w-full md:w-[35%] p-10 text-white flex flex-col justify-center relative">
                <h1 class="text-3xl font-bold mb-2">GUB-UP</h1>
                <p class="text-blue-100 text-sm mb-8 opacity-90">Join the secure health monitoring network for Gubat, Sorsogon.</p>
                <div class="space-y-4">
                    <div class="flex items-center gap-3 text-xs bg-white/10 p-3 rounded-xl border border-white/10">
                        <i data-lucide="mail-check" class="w-4 h-4"></i> OTP Verification Required
                    </div>
                </div>
            </div>

            <div class="w-full md:w-[65%] p-8 md:p-12">
                <header class="mb-8">
                    <h3 class="text-3xl font-extrabold text-navy mb-1">Create Account</h3>
                    <p class="text-slate-400 text-sm">Fill in your details to receive your 4-digit code.</p>
                </header>

                <form id="registrationForm" class="space-y-5">
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="citizen" class="hidden" checked>
                            <div class="role-card border-2 border-slate-100 p-4 rounded-2xl text-center flex flex-col items-center gap-2">
                                <i data-lucide="user" class="w-6 h-6 text-slate-400"></i>
                                <span class="text-[10px] font-bold uppercase">Citizen</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="bhw" class="hidden">
                            <div class="role-card border-2 border-slate-100 p-4 rounded-2xl text-center flex flex-col items-center gap-2">
                                <i data-lucide="stethoscope" class="w-6 h-6 text-slate-400"></i>
                                <span class="text-[10px] font-bold uppercase">BHW</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="rhu" class="hidden">
                            <div class="role-card border-2 border-slate-100 p-4 rounded-2xl text-center flex flex-col items-center gap-2">
                                <i data-lucide="building-2" class="w-6 h-6 text-slate-400"></i>
                                <span class="text-[10px] font-bold uppercase">RHU</span>
                            </div>
                        </label>
                    </div>

                    <div class="space-y-4">
                        <input type="text" id="fullName" placeholder="Full Name" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-blue outline-none">
                        <input type="email" id="email" placeholder="Email Address" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-blue outline-none">
                        <input type="password" id="password" placeholder="Password (Min. 6 characters)" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 focus:border-brand-blue outline-none">
                        
                        <select id="barangay" required class="w-full px-4 py-3.5 rounded-xl border border-slate-200 bg-white">
                            <option value="" disabled selected>Select Barangay</option>
                            <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option>
                            <option>Balud Del Sur</option><option>Benguet</option><option>Bentuco</option>
                            <option>Manook</option><option>Panganiban</option><option>Paradijon</option>
                            </select>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center justify-center gap-3">
                        Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // EmailJS Credentials
    const PUBLIC_KEY = "qwA5GyR0JwylFMYXm";
    const SERVICE_ID = "service_bmhrqyo";
    const TEMPLATE_ID = "template_vhz6fts";

    emailjs.init(PUBLIC_KEY);

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    lucide.createIcons();

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const barangay = document.getElementById('barangay').value;
        const selectedRole = document.querySelector('input[name="role"]:checked').value;

        // Visual feedback
        submitBtn.disabled = true;
        submitBtn.innerHTML = `Processing...`;

        try {
            // 1. Check for Duplicate Name
            const q = query(collection(db, "users"), where("name", "==", fullName));
            const nameSnap = await getDocs(q);
            if (!nameSnap.empty) throw new Error("This name is already registered.");

            // 2. Create Firebase User
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCred.user;

            // 3. Generate OTP & Time
            const otpCode = Math.floor(1000 + Math.random() * 9000).toString();
            const now = new Date();
            const expiryTime = new Date(now.getTime() + 15 * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // 4. Save to Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: fullName,
                email: email,
                barangay: barangay,
                role: (selectedRole === "citizen") ? "citizen" : `processing-${selectedRole}`,
                isApproved: (selectedRole === "citizen"),
                otpCode: otpCode,
                createdAt: now
            });

            // 5. Send Email via EmailJS
            await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                to_name: fullName,
                to_email: email,
                passcode: otpCode, // Variable in your template
                time: expiryTime   // Variable in your template
            });

            // 6. Success - Redirect
            window.location.href = `verification.html?uid=${user.uid}`;

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Account";
        }
    });
</script>
</body>
</html>
