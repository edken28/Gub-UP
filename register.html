<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .role-btn:has(input:checked) { border-color: #2563eb; background-color: #eff6ff; color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800">GUB-UP</h1>
            <p class="text-slate-500 font-medium">Create your health monitoring account</p>
        </div>

        <form id="regForm" class="space-y-5">
            <div class="grid grid-cols-3 gap-3">
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all">
                    <input type="radio" name="role" value="citizen" class="hidden" checked>
                    <i data-lucide="user" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">Citizen</span>
                </label>
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all">
                    <input type="radio" name="role" value="bhw" class="hidden">
                    <i data-lucide="stethoscope" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">BHW</span>
                </label>
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all">
                    <input type="radio" name="role" value="rhu" class="hidden">
                    <i data-lucide="building-2" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">RHU Staff</span>
                </label>
            </div>

            <div class="space-y-4">
                <input type="text" id="fullName" placeholder="Full Legal Name" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="email" id="email" placeholder="Email Address" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">
                
                <input type="password" id="password" placeholder="Password (min. 6 characters)" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500">

                <select id="barangay" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Select your Barangay</option>
                    <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option>
                    <option>Balud Del Sur</option><option>Benguet</option><option>Bentuco</option>
                    <option>Cogon</option><option>Manook</option><option>Paco</option><option>Paradijon</option>
                    <option>Rizal</option><option>San Ignacio</option><option>Villareal</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-3 shadow-lg">
                Create Account
            </button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // API Keys
    const EMAILJS_KEY = "qwA5GyR0JwylFMYXm";
    const SERVICE_ID = "service_bmhrqyo";
    const TEMPLATE_ID = "template_grdnefe";

    emailjs.init(EMAILJS_KEY);

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    lucide.createIcons();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        // Form Data
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        const brgy = document.getElementById('barangay').value;
        const role = document.querySelector('input[name="role"]:checked').value;

        btn.disabled = true;
        btn.innerHTML = `Sending Code...`;

        try {
            // 1. Check for Duplicate Name
            const q = query(collection(db, "users"), where("name", "==", name));
            const snap = await getDocs(q);
            if (!snap.empty) throw new Error("This name is already registered.");

            // 2. Create Auth Account
            const userCred = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCred.user;

            // 3. Generate Verification Details
            const otpCode = Math.floor(1000 + Math.random() * 9000).toString();
            const timeStr = new Date(Date.now() + 15 * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // 4. Save to Database
            await setDoc(doc(db, "users", user.uid), {
                name: name,
                email: email,
                barangay: brgy,
                role: role === "citizen" ? "citizen" : `pending-${role}`,
                isApproved: role === "citizen",
                otp: otpCode,
                createdAt: new Date()
            });

            // 5. Send Email via EmailJS
            await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                to_name: name,
                to_email: email,
                passcode: otpCode, // Variable for your {{passcode}}
                time: timeStr      // Variable for your {{time}}
            });

            // SUCCESS: Redirect to Verification
            window.location.href = `verification.html?uid=${user.uid}`;

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            btn.disabled = false;
            btn.innerHTML = "Create Account";
        }
    });
</script>
</body>
</html>
