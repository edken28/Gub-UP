<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        
        /* Modal Animation */
        #otpModal { display: none; backdrop-filter: blur(4px); }
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); } to { transform: translateY(0); } }
        .modal-content { animation: slideUp 0.4s ease; }

        input[type="radio"]:checked + .selection-card {
            border-color: #2563eb !important;
            background-color: #eff6ff !important;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="max-w-4xl w-full">
        <div class="bg-white rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[700px]">
            <div class="bg-brand-blue w-full md:w-[35%] p-10 text-white flex flex-col justify-center">
                <h1 class="text-2xl font-bold mb-2">GUB-UP</h1>
                <p class="text-blue-100 text-sm mb-10">Secure health monitoring for Gubat, Sorsogon.</p>
                <div class="space-y-5">
                    <div class="flex items-center gap-4">
                        <div class="bg-white/20 p-2 rounded-lg"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
                        <h4 class="font-bold text-sm">Verified Network</h4>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-[65%] p-10 md:p-14">
                <h3 class="text-3xl font-bold text-navy mb-1">Create Account</h3>
                <p class="text-gray-400 mb-6 font-medium">Enter details to receive your code</p>

                <form id="registrationForm" class="space-y-4">
                    <div class="grid grid-cols-3 gap-3 mb-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="citizen" class="hidden" checked>
                            <div class="selection-card border-2 border-gray-100 p-3 rounded-2xl flex flex-col items-center text-center">
                                <i data-lucide="user" class="w-5 h-5 mb-1 text-gray-400"></i>
                                <span class="font-bold text-[10px]">Citizen</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="bhw" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-3 rounded-2xl flex flex-col items-center text-center">
                                <i data-lucide="pill" class="w-5 h-5 mb-1 text-gray-400"></i>
                                <span class="font-bold text-[10px]">BHW</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="rhu" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-3 rounded-2xl flex flex-col items-center text-center">
                                <i data-lucide="hospital" class="w-5 h-5 mb-1 text-gray-400"></i>
                                <span class="font-bold text-[10px]">RHU</span>
                            </div>
                        </label>
                    </div>

                    <input type="text" id="fullName" placeholder="Full Name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-50 outline-none">
                    <input type="email" id="email" placeholder="Email Address" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-50 outline-none">
                    
                    <div class="relative">
                        <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-4 focus:ring-blue-50 outline-none">
                        <button type="button" id="togglePass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"><i data-lucide="eye" class="w-5 h-5"></i></button>
                    </div>

                    <select id="barangay" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white">
                        <option value="" disabled selected>Select Barangay</option>
                        <option>Manook</option><option>Paradijon</option><option>Paco</option>
                    </select>

                    <button type="submit" id="submitBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">Send Verification Code</button>
                </form>
            </div>
        </div>
    </div>

    <div id="otpModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="modal-content bg-white w-full max-w-md rounded-[2.5rem] p-8 relative shadow-2xl">
            <button id="closeModal" class="absolute right-6 top-6 text-gray-400 hover:text-gray-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <div class="text-center mb-8">
                <div class="bg-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="mail-check" class="w-8 h-8 text-blue-600"></i>
                </div>
                <h3 class="text-2xl font-bold text-navy">Verify Email</h3>
                <p class="text-gray-400 text-sm mt-1">Enter the 4-digit code sent to your email.</p>
            </div>

            <form id="otpForm" class="space-y-6">
                <div class="flex justify-center gap-3">
                    <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                    <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                    <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                    <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                </div>

                <button type="submit" id="verifyBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">Verify & Create Account</button>
                
                <div class="text-center">
                    <button type="button" id="resendBtn" class="text-sm font-bold text-brand-blue hover:underline disabled:text-gray-300 disabled:no-underline">
                        Resend Code
                    </button>
                    <p id="timer" class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-bold"></p>
                </div>
            </form>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    emailjs.init("qwA5GyR0JwylFMYXm");
    lucide.createIcons();

    let generatedOtp = "";
    let resendTimer = 0;
    let tempUserData = {};

    // PASSWORD TOGGLE
    document.getElementById('togglePass').addEventListener('click', () => {
        const p = document.getElementById('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    });

    // OPEN OTP MODAL
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Sending Code...";

        tempUserData = {
            name: document.getElementById('fullName').value,
            email: document.getElementById('email').value.toLowerCase(),
            pass: document.getElementById('password').value,
            brgy: document.getElementById('barangay').value,
            role: document.querySelector('input[name="role"]:checked').value
        };

        generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        
        try {
            await emailjs.send("service_bmhrqyo", "template_vhz6fts", {
                to_name: tempUserData.name,
                email: tempUserData.email,
                passcode: generatedOtp,
                time: new Date().toLocaleTimeString()
            });

            document.getElementById('otpModal').classList.add('modal-active');
            startResendTimer();
        } catch (err) {
            alert("Email failed: " + err.message);
        }
        btn.disabled = false;
        btn.innerText = "Send Verification Code";
    });

    // VERIFY & CREATE ACCOUNT
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = Array.from(document.querySelectorAll('.otp-in')).map(i => i.value).join('');
        const btn = document.getElementById('verifyBtn');

        if (code !== generatedOtp) return alert("Invalid Code");

        btn.disabled = true;
        btn.innerText = "Finalizing...";

        try {
            const userCred = await createUserWithEmailAndPassword(auth, tempUserData.email, tempUserData.pass);
            await setDoc(doc(db, "users", userCred.user.uid), {
                name: tempUserData.name,
                email: tempUserData.email,
                barangay: tempUserData.brgy,
                role: tempUserData.role === 'citizen' ? 'citizen' : `processing-${tempUserData.role}`,
                isApproved: tempUserData.role === 'citizen',
                createdAt: new Date()
            });
            window.location.href = "dashboard.html";
        } catch (err) {
            alert(err.message);
            btn.disabled = false;
        }
    });

    // RESEND TIMER
    function startResendTimer() {
        resendTimer = 60;
        const btn = document.getElementById('resendBtn');
        const timerText = document.getElementById('timer');
        btn.disabled = true;

        const countdown = setInterval(() => {
            resendTimer--;
            timerText.innerText = `Resend available in ${resendTimer}s`;
            if (resendTimer <= 0) {
                clearInterval(countdown);
                btn.disabled = false;
                timerText.innerText = "";
            }
        }, 1000);
    }

    document.getElementById('resendBtn').addEventListener('click', async () => {
        generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        await emailjs.send("service_bmhrqyo", "template_vhz6fts", {
            to_name: tempUserData.name, email: tempUserData.email, passcode: generatedOtp
        });
        startResendTimer();
    });

    // CLOSE MODAL
    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('otpModal').classList.remove('modal-active');
    });

    // OTP Auto-focus
    const inputs = document.querySelectorAll('.otp-in');
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value && index < 3) inputs[index + 1].focus();
        });
    });
</script>
</body>
</html>
