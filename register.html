<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }

        /* ACTIVE SELECTION STATE */
        input[type="radio"]:checked + .selection-card {
            border-color: #2563eb !important;
            background-color: #eff6ff !important;
            transform: translateY(-2px);
        }

        /* MODAL ANIMATIONS */
        #otpModal { display: none; backdrop-filter: blur(6px); }
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-content { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="max-w-4xl w-full">
        <div class="mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-brand-blue font-bold hover:gap-3 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Home
            </a>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[700px]">
            
            <div class="bg-brand-blue w-full md:w-[35%] p-10 text-white flex flex-col justify-center relative">
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                <div class="flex items-center gap-3 mb-8 relative z-10">
                    <div class="bg-white p-2 rounded-xl"><div class="w-8 h-8 text-brand-blue flex items-center justify-center font-bold text-2xl">+</div></div>
                    <div><h1 class="text-2xl font-bold leading-none">GUB-UP</h1><p class="text-[10px] opacity-80 uppercase tracking-widest font-semibold">Disease Monitoring</p></div>
                </div>
                <h2 class="text-3xl font-bold mb-4 relative z-10">Join the Network</h2>
                <p class="text-blue-100 text-sm mb-10 opacity-90 relative z-10">Help us monitor and improve the health status of Gubat, Sorsogon.</p>
                <div class="space-y-5 hidden md:block relative z-10">
                    <div class="flex items-center gap-4"><div class="bg-white/20 p-2 rounded-lg"><i data-lucide="shield-check" class="w-5 h-5"></i></div><h4 class="font-bold text-sm">Validated Roles</h4></div>
                    <div class="flex items-center gap-4"><div class="bg-white/20 p-2 rounded-lg"><i data-lucide="mail" class="w-5 h-5"></i></div><h4 class="font-bold text-sm">OTP Security</h4></div>
                </div>
            </div>

            <div class="w-full md:w-[65%] p-10 md:p-14 flex flex-col justify-center">
                <h3 class="text-3xl font-bold text-navy mb-1">Create Account</h3>
                <p class="text-gray-400 mb-6 font-medium">Select your role and enter details</p>

                <form id="registrationForm" class="space-y-5">
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="citizen" class="hidden" checked>
                            <div class="selection-card border-2 border-gray-100 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="user" class="w-6 h-6 text-gray-400"></i>
                                <span class="role-title font-bold text-gray-800 text-xs">Citizen</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="bhw" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="pill" class="w-6 h-6 text-gray-400"></i>
                                <span class="role-title font-bold text-gray-800 text-xs">BHW</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="rhu" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="hospital" class="w-6 h-6 text-gray-400"></i>
                                <span class="role-title font-bold text-gray-800 text-xs">RHU Staff</span>
                            </div>
                        </label>
                    </div>

                    <div class="space-y-4">
                        <input type="text" id="fullName" placeholder="Full Name" required class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        <input type="email" id="email" placeholder="Email Address" required class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        <div class="relative">
                            <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                            <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-blue"><i data-lucide="eye" class="w-5 h-5"></i></button>
                        </div>
                        <select id="barangay" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white outline-none focus:ring-4 focus:ring-blue-50">
                            <option value="" disabled selected>Select Barangay</option>
                            <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option><option>Balud Del Sur</option>
                            <option>Benguet</option><option>Bentuco</option><option>Cogon</option><option>Manook</option>
                            <option>Paco</option><option>Paradijon</option><option>Rizal</option><option>San Ignacio</option><option>Villareal</option>
                        </select>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-blue-700 transition-all active:scale-95">Send Verification Code</button>
                </form>
            </div>
        </div>
    </div>

    <div id="otpModal" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="modal-content bg-white w-full max-w-md rounded-[2.5rem] p-8 md:p-10 relative shadow-2xl">
            <button id="closeModal" class="absolute right-6 top-6 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button>

            <div id="modalStep1">
                <div class="text-center mb-8">
                    <div class="bg-blue-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4"><i data-lucide="mail-check" class="w-8 h-8 text-blue-600"></i></div>
                    <h3 class="text-2xl font-bold text-navy">Verify Email</h3>
                    <p class="text-gray-400 text-sm mt-1">Enter the 4-digit code sent to your email.</p>
                </div>

                <form id="otpForm" class="space-y-6">
                    <div class="flex justify-center gap-3">
                        <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                        <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                        <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                        <input type="text" maxlength="1" class="otp-in w-14 h-16 text-center text-2xl font-bold border-2 border-gray-100 rounded-xl focus:border-blue-600 outline-none">
                    </div>
                    <button type="submit" id="verifyBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">Verify & Create Account</button>
                    <div class="text-center">
                        <button type="button" id="resendBtn" class="text-sm font-bold text-brand-blue disabled:text-gray-300">Resend Code</button>
                        <p id="timer" class="text-[10px] text-gray-400 mt-1 uppercase font-bold"></p>
                    </div>
                </form>
            </div>
            <div id="modalStep2" class="hidden"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    emailjs.init("qwA5GyR0JwylFMYXm");
    lucide.createIcons();

    let generatedOtp = "";
    let tempUserData = {};
    let countdown;

    // Password Toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passInput = document.getElementById('password');
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        this.innerHTML = `<i data-lucide="${isPass ? 'eye-off' : 'eye'}" class="w-5 h-5"></i>`;
        lucide.createIcons();
    });

    // Registration Form Submission
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Sending Code...";

        tempUserData = {
            name: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim().toLowerCase(),
            pass: document.getElementById('password').value,
            brgy: document.getElementById('barangay').value,
            role: document.querySelector('input[name="role"]:checked').value
        };

        generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();

        try {
            await emailjs.send("service_bmhrqyo", "template_grdnefe", {
                to_name: tempUserData.name,
                email: tempUserData.email,
                passcode: generatedOtp,
                time: new Date().toLocaleTimeString()
            });
            document.getElementById('otpModal').classList.add('modal-active');
            startTimer();
        } catch (err) {
            alert("Error sending email: " + err.message);
        }
        btn.disabled = false;
        btn.innerText = "Send Verification Code";
    });

    // Verification Logic
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const entered = Array.from(document.querySelectorAll('.otp-in')).map(i => i.value).join('');
        const btn = document.getElementById('verifyBtn');

        if (entered !== generatedOtp) return alert("Invalid Code");

        btn.disabled = true;
        btn.innerText = "Finalizing Account...";

        try {
            const userCred = await createUserWithEmailAndPassword(auth, tempUserData.email, tempUserData.pass);
            const finalRole = tempUserData.role === 'citizen' ? 'citizen' : `processing-${tempUserData.role}`;

            await setDoc(doc(db, "users", userCred.user.uid), {
                name: tempUserData.name,
                email: tempUserData.email,
                barangay: tempUserData.brgy,
                role: finalRole,
                isApproved: tempUserData.role === 'citizen',
                createdAt: new Date()
            });

            // ADMIN NOTIFICATION
            if (tempUserData.role !== 'citizen') {
                await emailjs.send("service_bmhrqyo", "template_i6y2iba", {
                    new_user: tempUserData.name,
                    role: tempUserData.role.toUpperCase(),
                    user_email: tempUserData.email,
                    barangay: tempUserData.brgy
                });
                showThankYou();
            } else {
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            alert(err.message);
            btn.disabled = false;
            btn.innerText = "Verify & Create Account";
        }
    });

    function showThankYou() {
        document.getElementById('modalStep1').classList.add('hidden');
        const step2 = document.getElementById('modalStep2');
        step2.classList.remove('hidden');
        step2.innerHTML = `
            <div class="text-center py-6 animate-fade-in">
                <div class="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><i data-lucide="check-circle-2" class="w-10 h-10 text-green-600"></i></div>
                <h3 class="text-2xl font-bold text-navy mb-2">Thank You, ${tempUserData.name.split(' ')[0]}!</h3>
                <p class="text-gray-500 text-sm mb-8 leading-relaxed">Your account is being reviewed.<br>It will be processed in <b>under 24 hours</b>.</p>
                <button onclick="window.location.href='dashboard.html'" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all active:scale-95">Continue to Dashboard</button>
            </div>
        `;
        lucide.createIcons();
    }

    function startTimer() {
        let timeLeft = 60;
        const btn = document.getElementById('resendBtn');
        const text = document.getElementById('timer');
        btn.disabled = true;
        clearInterval(countdown);
        countdown = setInterval(() => {
            timeLeft--;
            text.innerText = `Resend in ${timeLeft}s`;
            if (timeLeft <= 0) { clearInterval(countdown); btn.disabled = false; text.innerText = ""; }
        }, 1000);
    }

    document.getElementById('resendBtn').addEventListener('click', async () => {
        generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        await emailjs.send("service_bmhrqyo", "template_vhz6fts", { to_name: tempUserData.name, email: tempUserData.email, passcode: generatedOtp });
        startTimer();
    });

    document.getElementById('closeModal').addEventListener('click', () => document.getElementById('otpModal').classList.remove('modal-active'));

    // OTP Inputs Auto-focus
    document.querySelectorAll('.otp-in').forEach((input, index, inputs) => {
        input.addEventListener('input', (e) => { if (e.target.value && index < 3) inputs[index + 1].focus(); });
        input.addEventListener('keydown', (e) => { if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus(); });
    });
</script>
</body>
</html>
