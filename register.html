<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .role-btn:has(input:checked) { border-color: #2563eb; background-color: #eff6ff; color: #2563eb; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">GUB-UP</h1>
            <p class="text-slate-500 font-medium">Create your health monitoring account</p>
        </div>

        <form id="regForm" class="space-y-5">
            <div class="grid grid-cols-3 gap-3">
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all hover:border-blue-200">
                    <input type="radio" name="role" value="citizen" class="hidden" checked>
                    <i data-lucide="user" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">Citizen</span>
                </label>
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all hover:border-blue-200">
                    <input type="radio" name="role" value="bhw" class="hidden">
                    <i data-lucide="stethoscope" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">BHW</span>
                </label>
                <label class="role-btn cursor-pointer border-2 border-slate-100 rounded-2xl p-4 text-center transition-all hover:border-blue-200">
                    <input type="radio" name="role" value="rhu" class="hidden">
                    <i data-lucide="building-2" class="mx-auto mb-1"></i>
                    <span class="text-[10px] font-bold uppercase block">RHU Staff</span>
                </label>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Full Name</label>
                    <input type="text" id="fullName" placeholder="Juan Dela Cruz" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Email Address</label>
                    <input type="email" id="email" placeholder="name@email.com" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Password</label>
                    <input type="password" id="password" placeholder="Min. 6 characters" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Barangay</label>
                    <select id="barangay" required 
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                        <option value="" disabled selected>Select your Barangay</option>
                        <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option>
                        <option>Balud Del Sur</option><option>Benguet</option><option>Bentuco</option>
                        <option>Cogon</option><option>Manook</option><option>Paco</option>
                        <option>Paradijon</option><option>Rizal</option><option>San Ignacio</option>
                        <option>Villareal</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-3 shadow-lg active:scale-95">
                Create Account
            </button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // API Keys
    const EMAILJS_PUBLIC_KEY = "qwA5GyR0JwylFMYXm";
    const SERVICE_ID = "service_bmhrqyo";
    const TEMPLATE_ID = "template_grdnefe";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    lucide.createIcons();

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        
        // Clean Data
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        const brgy = document.getElementById('barangay').value;
        const role = document.querySelector('input[name="role"]:checked').value;

        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Creating Account...`;
        lucide.createIcons();

        try {
            // 1. Firebase Auth Registration
            const userCred = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCred.user;

            // 2. Prepare OTP
            const otpCode = Math.floor(1000 + Math.random() * 9000).toString();
            const timeStr = new Date(Date.now() + 15 * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // 3. Save to Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: name,
                email: email,
                barangay: brgy,
                role: role === "citizen" ? "citizen" : `pending-${role}`,
                isApproved: role === "citizen",
                otp: otpCode,
                createdAt: new Date()
            });

            btn.innerHTML = `<i data-lucide="mail" class="w-5 h-5"></i> Sending Code...`;
            lucide.createIcons();

            // 4. Send Email
            // We use 'email' as the key because your screenshot showed {{email}}
            const templateParams = {
                to_name: name,
                email: email,      
                passcode: otpCode, 
                time: timeStr      
            };

            await emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams);

            // 5. Success Redirect
            window.location.href = `verification.html?uid=${user.uid}`;

        } catch (error) {
            console.error("Registration Error:", error);
            
            // Handle specific Firebase error
            if (error.code === 'auth/email-already-in-use') {
                alert("This email is already registered. Please login or delete the test account from Firebase Console.");
            } else {
                alert("Error: " + (error.text || error.message));
            }
            
            btn.disabled = false;
            btn.innerHTML = "Create Account";
            lucide.createIcons();
        }
    });
</script>
</body>
</html>
