<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }

        /* ACTIVE SELECTION STATE */
        input[type="radio"]:checked + .selection-card {
            border-color: #2563eb !important;
            background-color: #eff6ff !important;
            transform: translateY(-2px);
        }

        /* ANIMATIONS */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.6s ease-out forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        .selection-card:hover { transform: translateY(-2px); transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="max-w-4xl w-full animate-fade-in">
        <div class="mb-4 md:mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-brand-blue font-bold hover:gap-3 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Home
            </a>
        </div>

        <div class="bg-white rounded-[2rem] md:rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[600px] md:min-h-[700px]">
            
            <div class="bg-brand-blue w-full md:w-[35%] p-8 md:p-10 text-white flex flex-col justify-center relative overflow-hidden">
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                
                <div class="flex items-center gap-3 mb-6 md:mb-8 relative z-10">
                    <div class="bg-white p-2 rounded-xl">
                        <div class="w-6 h-6 md:w-8 md:h-8 text-brand-blue flex items-center justify-center font-bold text-xl md:text-2xl">+</div>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold leading-none">GUB-UP</h1>
                        <p class="text-[9px] opacity-80 uppercase tracking-widest font-semibold">Disease Monitoring</p>
                    </div>
                </div>
                
                <div class="relative z-10">
                    <h2 class="text-2xl md:text-3xl font-bold mb-4">Join the Network</h2>
                    <p class="text-blue-100 text-sm mb-8 md:mb-10 opacity-90">Help us monitor and improve the health status of Gubat, Sorsogon.</p>
                    
                    <div class="space-y-4 md:space-y-5 hidden md:block">
                        <div class="flex items-center gap-4">
                            <div class="bg-white/20 p-2 rounded-lg"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
                            <div><h4 class="font-bold text-sm">Validated Roles</h4><p class="text-[11px] text-blue-100">Verified access.</p></div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="bg-white/20 p-2 rounded-lg"><i data-lucide="database" class="w-5 h-5"></i></div>
                            <div><h4 class="font-bold text-sm">Real-time Data</h4><p class="text-[11px] text-blue-100">Instant updates.</p></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-[65%] p-8 md:p-14 flex flex-col justify-center">
                <div class="animate-fade-in delay-1">
                    <h3 class="text-2xl md:text-3xl font-bold text-navy mb-1">Create Account</h3>
                    <p class="text-gray-400 mb-6 font-medium">Select your role and enter details</p>
                </div>

                <form id="registrationForm" class="animate-fade-in delay-2">
                    <label class="block text-xs font-bold text-navy mb-3 uppercase tracking-wider">Account Type</label>
                    <div class="grid grid-cols-3 gap-2 md:gap-3 mb-6">
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="citizen" class="hidden" checked>
                            <div class="selection-card border-2 border-gray-100 p-3 md:p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="user" class="w-5 h-5 md:w-6 md:h-6 text-gray-400 group-hover:text-brand-blue"></i>
                                <span class="role-title font-bold text-gray-800 text-[10px] md:text-xs">Citizen</span>
                                <span class="access-text text-[8px] md:text-[9px] text-gray-400 leading-tight">View only</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="bhw" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-3 md:p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="pill" class="w-5 h-5 md:w-6 md:h-6 text-gray-400 group-hover:text-brand-blue"></i>
                                <span class="role-title font-bold text-gray-800 text-[10px] md:text-xs">BHW</span>
                                <span class="access-text text-[8px] md:text-[9px] text-gray-400 leading-tight">Medicine</span>
                            </div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="role" value="rhu" class="hidden">
                            <div class="selection-card border-2 border-gray-100 p-3 md:p-4 rounded-2xl flex flex-col items-center gap-2 transition-all text-center h-full">
                                <i data-lucide="hospital" class="w-5 h-5 md:w-6 md:h-6 text-gray-400 group-hover:text-brand-blue"></i>
                                <span class="role-title font-bold text-gray-800 text-[10px] md:text-xs">RHU Staff</span>
                                <span class="access-text text-[8px] md:text-[9px] text-gray-400 leading-tight">Disease</span>
                            </div>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-navy mb-1 uppercase tracking-wider">Full Name</label>
                            <input type="text" id="fullName" placeholder="Juan Dela Cruz" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-xs font-bold text-navy mb-1 uppercase tracking-wider">Email Address</label>
                            <input type="email" id="email" placeholder="name@email.com" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-xs font-bold text-navy mb-1 uppercase tracking-wider">Password</label>
                            <div class="relative">
                                <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                                <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-blue">
                                    <i data-lucide="eye" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-navy mb-1 uppercase tracking-wider">Barangay</label>
                            <select id="barangay" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue bg-white cursor-pointer appearance-none">
                                <option value="" disabled selected>Select location</option>
                                <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option>
                                <option>Balud Del Sur</option><option>Benguet</option><option>Bentuco</option>
                                <option>Manook</option><option>Paco</option><option>Paradijon</option>
                                <option>Rizal</option><option>San Ignacio</option><option>Villareal</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-blue-700 hover:shadow-blue-200 transition-all active:scale-95 mb-4">
                        Create Account
                    </button>
                    
                    <p class="text-center text-sm text-gray-500 font-medium">
                        Already have an account? <a href="login.html" class="text-brand-blue font-bold hover:underline">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

<script type="module">
    // ... (Your existing Firebase and EmailJS imports remain the same) ...
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    emailjs.init("qwA5GyR0JwylFMYXm");
    lucide.createIcons();

    // PASSWORD TOGGLE LOGIC
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    
    toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Change icon
        const iconName = type === 'password' ? 'eye' : 'eye-off';
        toggleBtn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
        lucide.createIcons();
    });

    // REGISTRATION LOGIC
    const form = document.getElementById('registrationForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = passwordInput.value;
        const fullName = document.getElementById('fullName').value.trim();
        const barangay = document.getElementById('barangay').value;
        const selectedRole = document.querySelector('input[name="role"]:checked').value;

        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCred.user;

            const otpCode = Math.floor(1000 + Math.random() * 9000).toString();
            const timeStr = new Date(Date.now() + 15 * 60000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            await setDoc(doc(db, "users", user.uid), {
                name: fullName,
                email: email,
                barangay: barangay,
                role: (selectedRole === "citizen") ? "citizen" : `processing-${selectedRole}`,
                isApproved: (selectedRole === "citizen"),
                otp: otpCode,
                createdAt: new Date()
            });

            await emailjs.send("service_bmhrqyo", "template_vhz6fts", {
                to_name: fullName,
                email: email,
                passcode: otpCode,
                time: timeStr
            });

            window.location.href = `verification.html?uid=${user.uid}`;

        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Account";
        }
    });
</script>
</body>
</html>
