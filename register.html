<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        input, select { font-size: 16px !important; } 

        /* Custom Radio Styling */
        input[type="radio"]:checked + .role-card {
            border-color: #2563eb;
            background-color: #eff6ff;
            ring: 2px;
            ring-color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full">
        <div class="bg-white rounded-[2rem] shadow-2xl flex flex-col md:flex-row overflow-hidden border border-slate-100">
            
            <div class="bg-brand-blue w-full md:w-[35%] p-8 text-white flex flex-col justify-center relative">
                <div class="relative z-10">
                    <h1 class="text-2xl font-bold mb-2">GUB-UP</h1>
                    <p class="text-blue-100 text-sm mb-6 opacity-90">Secure Health Monitoring for Gubat, Sorsogon.</p>
                    <div class="space-y-4 text-xs">
                        <div class="flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Duplicate name protection</div>
                        <div class="flex items-center gap-2"><i data-lucide="mail" class="w-4 h-4"></i> Email verification required</div>
                        <div class="flex items-center gap-2"><i data-lucide="shield" class="w-4 h-4"></i> Admin approval for Staff</div>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-[65%] p-6 md:p-12">
                <h3 class="text-2xl font-extrabold text-navy mb-6">Create Account</h3>

                <form id="registrationForm" class="space-y-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Account Type</label>
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="citizen" class="hidden" checked>
                            <div class="role-card border-2 border-slate-100 p-3 rounded-xl text-center transition-all">
                                <span class="block text-xs font-bold text-slate-700">Citizen</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="bhw" class="hidden">
                            <div class="role-card border-2 border-slate-100 p-3 rounded-xl text-center transition-all">
                                <span class="block text-xs font-bold text-slate-700">BHW</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="rhu" class="hidden">
                            <div class="role-card border-2 border-slate-100 p-3 rounded-xl text-center transition-all">
                                <span class="block text-xs font-bold text-slate-700">RHU Staff</span>
                            </div>
                        </label>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Full Name</label>
                        <input type="text" id="fullName" placeholder="Juan Dela Cruz" required 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-50 focus:border-brand-blue outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Email Address</label>
                        <input type="email" id="email" placeholder="name@email.com" required 
                            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-50 focus:border-brand-blue outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Password</label>
                        <div class="relative">
                            <input type="password" id="password" placeholder="••••••••" required 
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-50 focus:border-brand-blue outline-none transition-all">
                            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand-blue">
                                <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest">Barangay</label>
                        <select id="barangay" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white outline-none focus:ring-4 focus:ring-blue-50">
                            <option value="" disabled selected>Select Barangay</option>
                            <option>Ariman</option><option>Bagacay</option><option>Balud Del Norte</option>
                            <option>Balud Del Sur</option><option>Benguet</option><option>Bentuco</option>
                            <option>Beriran</option><option>Buenavista</option><option>Bulacao</option>
                            <option>Cabigaan</option><option>Cabiguhan</option><option>Carriedo</option>
                            <option>Casili</option><option>Cogon</option><option>Cota Na Daco</option>
                            <option>Dita</option><option>Jupi</option><option>Lapinig</option>
                            <option>Luna-Candol</option><option>Manapao</option><option>Manook</option>
                            <option>Naagtan</option><option>Nato</option><option>Nazareno</option>
                            <option>Ogao</option><option>Paco</option><option>Panganiban</option>
                            <option>Paradijon</option><option>Patag</option><option>Payawin</option>
                            <option>Pinontingan</option><option>Rizal</option><option>San Ignacio</option>
                            <option>Sangat</option><option>Santa Ana</option><option>Tabi</option>
                            <option>Tagaytay</option><option>Tigkiw</option><option>Tiris</option>
                            <option>Togawe</option><option>Union</option><option>Villareal</option>
                        </select>
                    </div>

                    <button type="submit" id="submitBtn" 
                        class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold text-lg shadow-xl hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                        Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    lucide.createIcons();

    // Password Toggle Logic
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        eyeIcon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
        lucide.createIcons();
    });

    // Registration Logic
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const barangay = document.getElementById('barangay').value;
        const selectedRole = document.querySelector('input[name="role"]:checked').value;

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";

        try {
            // 1. Check for Duplicate Names
            const q = query(collection(db, "users"), where("name", "==", fullName));
            const nameSnap = await getDocs(q);
            if (!nameSnap.empty) throw new Error("This name is already registered.");

            // 2. Auth Signup
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCred.user;

            // 3. Set Role Logic
            // If they picked bhw or rhu, set them to 'processing'
            let finalRole = selectedRole === "citizen" ? "citizen" : "processing";
            let requestedRole = selectedRole; // Store what they actually wanted for admin to see

            // 4. Save to Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: fullName,
                email: email,
                barangay: barangay,
                role: finalRole,
                requestedRole: requestedRole, // Helps admin know what role to grant
                isApproved: (finalRole === "citizen"), // Citizens approved by default, Staff NOT
                createdAt: new Date()
            });

            // 5. Send Verification & Logout
            await sendEmailVerification(user);
            await signOut(auth);

            window.location.href = "verification.html";

        } catch (error) {
            alert(error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Create Account";
        }
    });
</script>
</body>
</html>
