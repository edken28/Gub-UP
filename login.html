<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }

        /* FLOATING BACKGROUND ORBS */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: drift 15s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: #e2e8f0; top: -10%; left: -5%; }
        .orb-2 { width: 400px; height: 400px; background: #cbd5e1; bottom: -10%; right: -5%; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #f1f5f9; top: 40%; right: 10%; animation-delay: -2s; }

        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(40px, 60px) rotate(10deg); }
        }

        /* ANIMATIONS */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-slide-up {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-float { animation: floatLogo 4s ease-in-out infinite; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="max-w-4xl w-full relative z-10">
        <div class="mb-4 md:mb-6 animate-slide-up">
            <a href="index.html" class="inline-flex items-center gap-2 text-brand-blue font-bold hover:gap-4 transition-all group">
                <i data-lucide="arrow-left" class="w-5 h-5 transition-transform group-hover:-translate-x-1"></i> 
                Back to Home
            </a>
        </div>

        <div class="bg-white/90 backdrop-blur-sm rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden animate-slide-up delay-1">
            
            <div class="bg-brand-blue w-full md:w-[38%] p-8 md:p-10 text-white flex flex-col justify-center relative overflow-hidden">
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white/10 rounded-full blur-3xl animate-float"></div>
                
                <div class="flex items-center gap-3 mb-6 md:mb-8 relative z-10 animate-float">
                    <div class="bg-white p-2 rounded-xl shadow-lg">
                        <div class="w-8 h-8 text-brand-blue flex items-center justify-center">
                            <i data-lucide="activity" class="w-7 h-7 stroke-[3px]"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold leading-none tracking-tight">GUB-UP</h1>
                        <p class="text-[10px] opacity-80 uppercase tracking-widest font-semibold mt-1">Gubat Health Portal</p>
                    </div>
                </div>

                <h2 class="text-2xl md:text-3xl font-bold mb-4 relative z-10 leading-tight">Welcome Back</h2>
                <p class="text-blue-100 text-sm mb-2 md:mb-10 opacity-90 relative z-10">Access your local health monitoring tools and records.</p>
                
                <div class="space-y-6 hidden md:block relative z-10">
                    <div class="flex items-start gap-4">
                        <div class="bg-white/20 p-2 rounded-lg mt-1"><i data-lucide="lock" class="w-5 h-5"></i></div>
                        <div><h4 class="font-bold text-sm">Secure Login</h4><p class="text-xs text-blue-100 opacity-70">Protected by Firebase Authentication.</p></div>
                    </div>
                </div>
            </div>

            <div class="w-full md:w-[62%] p-8 md:p-14 flex flex-col justify-center">
                <div class="animate-slide-up delay-2 text-center md:text-left">
                    <h3 class="text-2xl md:text-3xl font-bold text-navy mb-1">Login</h3>
                    <p class="text-gray-400 mb-8 font-medium text-sm md:text-base">Please enter your credentials</p>
                </div>

                <form id="loginForm" class="space-y-4 md:space-y-5 animate-slide-up delay-2">
                    <div class="space-y-3 md:space-y-4">
                        <div class="relative group">
                            <i data-lucide="mail" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-blue transition-colors"></i>
                            <input type="email" id="email" placeholder="Email Address" required 
                                class="w-full pl-12 pr-4 py-3 md:py-3.5 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        </div>

                        <div class="relative group">
                            <i data-lucide="lock" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-blue transition-colors"></i>
                            <input type="password" id="password" placeholder="Password" required 
                                class="w-full pl-12 pr-12 py-3 md:py-3.5 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-blue transition-colors">
                                <i data-lucide="eye" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="loginBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold text-lg shadow-xl hover:bg-blue-700 transition-all active:scale-95 flex items-center justify-center gap-2 mb-4">
                            <span>Sign In</span>
                            <i data-lucide="log-in" class="w-5 h-5"></i>
                        </button>
                        
                        <div class="text-center">
                            <p class="text-gray-500 text-sm font-medium">
                                Don't have an account? 
                                <a href="register.html" class="text-brand-blue font-bold hover:underline underline-offset-4 ml-1">Create Account</a>
                            </p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        lucide.createIcons();

        document.getElementById('togglePassword').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            this.innerHTML = `<i data-lucide="${isPass ? 'eye-off' : 'eye'}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-pulse">Authenticating...</span>`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (err) {
                alert("Login Error: " + err.message);
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In</span> <i data-lucide="log-in" class="w-5 h-5"></i>`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
