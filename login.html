<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }

        /* FLOATING BACKGROUND ORBS */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: drift 15s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: #e2e8f0; top: -10%; left: -5%; }
        .orb-2 { width: 400px; height: 400px; background: #cbd5e1; bottom: -10%; right: -5%; animation-delay: -5s; }

        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(40px, 60px) rotate(10deg); }
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: floatLogo 4s ease-in-out infinite; }

        .login-card { transition: transform 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="max-w-4xl w-full relative z-10">
        <div class="mb-4 md:mb-6" data-aos="fade-right">
            <a href="index.html" class="inline-flex items-center gap-2 text-brand-blue font-bold hover:gap-4 transition-all group">
                <i data-lucide="arrow-left" class="w-5 h-5 transition-transform group-hover:-translate-x-1"></i> 
                Back to Home
            </a>
        </div>

        <div class="login-card bg-white/90 backdrop-blur-sm rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[500px] md:min-h-[550px]" 
             data-aos="zoom-in">
            
            <div class="bg-brand-blue w-full md:w-[42%] p-8 md:p-10 text-white flex flex-col justify-center relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 animate-float"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-6 md:mb-8 animate-float">
                        <div class="bg-white p-2 rounded-xl shadow-lg">
                            <div class="w-8 h-8 text-brand-blue flex items-center justify-center font-bold text-2xl">+</div>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold leading-none tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] opacity-80 uppercase tracking-widest font-semibold mt-1">Health Monitoring</p>
                        </div>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-bold mb-3 md:mb-4">Welcome Back</h2>
                    <p class="text-blue-100 text-sm opacity-90 leading-relaxed">Access your municipality health account for Gubat, Sorsogon.</p>
                </div>
            </div>

            <div class="w-full md:w-[58%] p-8 md:p-14 flex flex-col justify-center">
                <div class="text-center md:text-left">
                    <h3 class="text-2xl md:text-3xl font-bold text-navy mb-1">Login</h3>
                    <p class="text-gray-400 mb-8 font-medium text-sm md:text-base">Please enter your credentials</p>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div class="group">
                        <label class="block text-xs font-bold text-navy mb-2 uppercase tracking-wider">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-blue transition-colors"></i>
                            <input type="email" id="email" placeholder="name@email.com" required 
                                class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        </div>
                    </div>
                    
                    <div class="group">
                        <label class="block text-xs font-bold text-navy mb-2 uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-brand-blue transition-colors"></i>
                            <input type="password" id="password" placeholder="••••••••" required 
                                class="w-full pl-12 pr-4 py-3.5 rounded-xl border border-gray-200 outline-none focus:ring-4 focus:ring-blue-50 focus:border-brand-blue transition-all">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="loginBtn" class="w-full bg-brand-blue text-white py-4 rounded-xl font-bold text-lg shadow-xl hover:bg-blue-700 transition-all active:scale-95 flex justify-center items-center gap-2 mb-6">
                            <span>Sign In</span>
                            <i data-lucide="log-in" class="w-5 h-5"></i>
                        </button>
                        
                        <p class="text-center text-sm text-gray-500 font-medium">
                            Don't have an account? <a href="register.html" class="text-brand-blue font-bold hover:underline underline-offset-4 ml-1">Register here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        AOS.init({ duration: 800, once: true });

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span class="animate-pulse">Authenticating...</span>`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                console.error("Login error:", error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<span>Sign In</span> <i data-lucide="log-in" class="w-5 h-5"></i>`;
                lucide.createIcons();
                alert(error.code === 'auth/invalid-credential' ? "Invalid email or password." : "Error: " + error.message);
            }
        });
        
        lucide.createIcons();
    </script>
</body>
</html>
