<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHW Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .bg-bhw-emerald { background-color: #10b981; }
        .text-bhw-emerald { color: #10b981; }
        .text-navy { color: #1e3a8a; }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        .status-critical { background-color: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; }
        .status-low { background-color: #fffbeb; color: #f59e0b; border: 1px solid #fef3c7; }
        .status-stable { background-color: #f0fdf4; color: #22c55e; border: 1px solid #dcfce7; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-brand-blue uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 group">
                        <div class="w-8 h-8 bg-emerald-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="package" class="w-4 h-4 text-emerald-600 group-hover:text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>
                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                        <a href="bhw-console.html" class="flex items-center gap-3 bg-bhw-emerald text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-emerald-200 transition-all">
                            <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="shield-check" class="w-4 h-4 text-white"></i>
                            </div>
                            <span>BHW Console</span>
                        </a>
                    </div>
                </nav>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <h2 class="text-[10px] md:text-sm font-bold text-slate-400 uppercase tracking-widest">BHW Stock Management</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-3 py-2 rounded-2xl">
                    <span id="user-name-display" class="font-bold text-navy text-xs md:text-sm">BHW Worker</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div data-aos="fade-up" class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="med-search" placeholder="Search Inventory..." class="w-full pl-14 pr-4 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 ring-emerald-100 shadow-sm font-semibold">
                    </div>
                    <button onclick="openAddModal()" class="bg-bhw-emerald text-white px-10 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-emerald-600 shadow-xl shadow-emerald-100 transition-all">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add New Medicine
                    </button>
                </div>

                <div data-aos="fade-up" data-aos-delay="100" class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden min-h-[400px]">
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50/50 border-b">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-10 py-6">Medicine Identity</th>
                                    <th class="px-8 py-6">Barangay</th>
                                    <th class="px-8 py-6 text-center">Quantity</th>
                                    <th class="px-8 py-6">Stock Status</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                    <div id="inventory-mobile-list" class="md:hidden divide-y divide-slate-50"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userBrgy = "";
        let allItems = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === "bhw") {
                    userBrgy = userDoc.data().barangay;
                    document.getElementById('user-name-display').innerText = userDoc.data().name;
                    document.getElementById('form-brgy').value = userBrgy;
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 600, once: true });
                    initData();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function initData() {
            const q = query(collection(db, "medicine_inventory"), where("barangay", "==", userBrgy));
            onSnapshot(q, (snapshot) => {
                allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUI(allItems);
            });
        }

        function renderUI(data) {
            const searchTerm = document.getElementById('med-search').value.toLowerCase();
            const filtered = data.filter(item => item.name.toLowerCase().includes(searchTerm));
            
            const tbody = document.getElementById('inventory-table-body');
            const mobileList = document.getElementById('inventory-mobile-list');
            tbody.innerHTML = "";
            mobileList.innerHTML = "";

            filtered.forEach(item => {
                const qty = parseInt(item.quantity || 0);
                let status = "Stable";
                let statusClass = "status-stable";
                if(qty < 100) { status = "Critical"; statusClass = "status-critical"; }
                else if(qty < 300) { status = "Low Stock"; statusClass = "status-low"; }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-all">
                        <td class="px-10 py-7">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 bg-emerald-50 text-bhw-emerald rounded-lg flex items-center justify-center"><i data-lucide="pill" class="w-4 h-4"></i></div>
                                <span class="font-bold text-navy text-lg">${item.name}</span>
                            </div>
                        </td>
                        <td class="px-8 py-7 text-slate-500 font-bold uppercase text-xs">${item.barangay}</td>
                        <td class="px-8 py-7 text-center font-black text-navy text-xl">${qty.toLocaleString()}</td>
                        <td class="px-8 py-7"><span class="px-4 py-1.5 rounded-xl text-[10px] font-black uppercase ${statusClass}">${status}</span></td>
                        <td class="px-10 py-7 text-right">
                            <div class="flex justify-end gap-3">
                                <button onclick="editItem('${item.id}', '${item.name}', ${qty})" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-bhw-emerald hover:text-white transition-all shadow-sm">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteItem('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;

                mobileList.innerHTML += `
                    <div class="p-5 flex flex-col gap-4">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-emerald-50 text-bhw-emerald rounded-xl flex items-center justify-center"><i data-lucide="pill" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-bold text-navy leading-tight">${item.name}</h4>
                                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">${item.barangay}</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase ${statusClass}">${status}</span>
                        </div>
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-400 font-black uppercase">Quantity</span>
                                <span class="text-xl font-black text-navy">${qty.toLocaleString()}</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editItem('${item.id}', '${item.name}', ${qty})" class="p-3 bg-white text-navy rounded-xl shadow-sm border border-slate-100"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="p-3 bg-white text-red-500 rounded-xl shadow-sm border border-slate-100"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        window.openAddModal = () => {
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = "";
            document.getElementById('form-brgy').value = userBrgy;
            document.getElementById('modal-title').innerText = "Register New Stock";
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.editItem = (id, name, qty) => {
            document.getElementById('item-id').value = id;
            document.getElementById('form-name').value = name;
            document.getElementById('form-qty').value = qty;
            document.getElementById('modal-title').innerText = "Update Inventory";
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('item-modal').classList.add('hidden');

        document.getElementById('item-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                name: document.getElementById('form-name').value,
                quantity: parseInt(document.getElementById('form-qty').value),
                barangay: userBrgy,
                updatedAt: serverTimestamp()
            };
            id ? await updateDoc(doc(db, "medicine_inventory", id), payload) : await addDoc(collection(db, "medicine_inventory"), payload);
            closeModal();
        };

        window.deleteItem = async (id) => { 
            if(confirm("Permanently remove this medicine?")) await deleteDoc(doc(db, "medicine_inventory", id)); 
        };

        document.getElementById('med-search').oninput = () => renderUI(allItems);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('sidebar-closed');
            sidebar.classList.toggle('sidebar-open');
        }
    </script>
</body>
</html>
