<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHW Console | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        
        #sidebar { 
            position: fixed; top: 0; left: 0; height: 100vh; width: 280px; 
            z-index: 1000; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white; border-right: 1px solid #f1f5f9;
        }
        @media (min-width: 1024px) { #sidebar { position: sticky; transform: translateX(0); width: 300px; } }
        .sidebar-open { transform: translateX(0) !important; }
        
        #overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 900; }
        #overlay.active { display: block; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-row { animation: slideIn 0.4s ease forwards; }
        
        /* Status Badge Styling */
        .badge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; letter-spacing: 0.025em; border: 1px solid transparent; }
        .status-critical { background: #fef2f2; color: #ef4444; border-color: #fee2e2; }
        .status-low { background: #fff7ed; color: #f97316; border-color: #ffedd5; }
        .status-moderate { background: #fffbeb; color: #d97706; border-color: #fef3c7; }
        .status-high { background: #f0f9ff; color: #0ea5e9; border-color: #e0f2fe; }
        .status-good { background: #ecfdf5; color: #10b981; border-color: #d1fae5; }
        .pulse-critical { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .dropdown-list {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; 
            max-height: 250px; overflow-y: auto; z-index: 200; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 700; color: #64748b; }
        .dropdown-item:hover { background-color: #ecfdf5; color: #10b981; }
    </style>
</head>
<body class="min-h-screen">
    <div id="overlay"></div>
    <div id="main-layout" class="w-full flex flex-col lg:flex-row">
        
        <aside id="sidebar" class="flex flex-col">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="activity"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-blue-900 text-xl">GUB-UP</h1>
                            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">GUBAT HEALTH PORTAL</p>
                        </div>
                    </div>
                    <button id="close-sidebar" class="lg:hidden p-2 text-slate-400"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 hover:text-blue-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-blue-50 transition-all">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 hover:text-emerald-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-emerald-50 transition-all">
                        <i data-lucide="pill" class="text-emerald-500"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart-2" class="text-amber-500"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 hover:text-sky-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-sky-50 transition-all">
                        <i data-lucide="phone-call" class="text-sky-500"></i> Hotlines
                    </a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-5">Internal Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 bg-emerald-600 text-white px-5 py-3.5 font-semibold rounded-2xl shadow-xl shadow-emerald-100 transition-all">
                            <i data-lucide="users" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-3.5 font-semibold hover:bg-red-50 rounded-2xl transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 min-w-0">
            <header class="bg-white/80 backdrop-blur-md border-b px-6 py-4 sticky top-0 z-30 flex items-center justify-between lg:justify-end">
                <button id="open-sidebar" class="lg:hidden p-2.5 bg-white border border-slate-200 rounded-xl text-blue-900 shadow-sm">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="flex items-center gap-4">
                    <div class="hidden md:block text-right">
                        <p id="brgy-badge" class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">Loading...</p>
                        <h2 class="text-slate-900 font-bold text-sm">Welcome, <span id="user-name-display" class="text-emerald-600">User</span></h2>
                    </div>
                    <div class="w-10 h-10 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 border-2 border-white shadow-sm">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                </div>
            </header>

            <div class="p-6 lg:p-10 space-y-8 max-w-[1400px] mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Search Barangay inventory..." class="w-full pl-14 pr-4 py-4 bg-white border border-slate-100 rounded-[1.5rem] outline-none focus:ring-2 ring-emerald-100 shadow-sm font-semibold text-slate-700">
                    </div>
                    <button onclick="openAddModal()" class="w-full md:w-auto bg-emerald-600 text-white px-10 py-4 rounded-[1.5rem] font-bold text-sm flex items-center justify-center gap-3 hover:bg-emerald-700 shadow-xl shadow-emerald-100 transition-all active:scale-95">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add New Stock
                    </button>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50 border-b">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-10 py-6">Medicine Identity</th>
                                    <th class="px-8 py-6">Date Added</th>
                                    <th class="px-8 py-6">Expiration</th>
                                    <th class="px-8 py-6">Stock Status</th>
                                    <th class="px-8 py-6 text-center">In-Stock</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="item-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl p-10 overflow-hidden">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600"><i data-lucide="pill"></i></div>
                <div>
                    <h3 class="text-xl font-bold text-slate-900">Medicine Entry</h3>
                    <p class="text-xs font-semibold text-slate-400">Update your barangay supply</p>
                </div>
            </div>
            <form id="item-form" class="space-y-4">
                <input type="hidden" id="entry-id">
                <div class="relative">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Medicine Name</label>
                    <input type="text" id="medicine-input" placeholder="Search or type..." class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-slate-700 outline-none focus:ring-2 ring-emerald-100">
                    <div id="medicine-dropdown" class="dropdown-list custom-scrollbar"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Quantity</label>
                        <input type="number" id="med-count" required class="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Status Ranking</label>
                        <select id="med-rank" required class="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none ring-2 ring-emerald-50">
                            <option value="critical">Critical</option>
                            <option value="low">Low</option>
                            <option value="moderate" selected>Moderate</option>
                            <option value="high">High</option>
                            <option value="good">Good</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Added Date</label>
                        <input type="date" id="med-added-date" required class="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-2">Expiration</label>
                        <input type="date" id="med-expiry" required class="w-full p-4 bg-slate-50 border rounded-2xl font-bold outline-none">
                    </div>
                </div>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 font-bold text-slate-400">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 bg-emerald-600 text-white font-bold rounded-2xl shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, Timestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userBrgy = "";
        let allItems = [];

        // SIDEBAR TOGGLE LOGIC
        document.getElementById('open-sidebar').onclick = () => { document.getElementById('sidebar').classList.add('sidebar-open'); document.getElementById('overlay').classList.add('active'); };
        document.getElementById('close-sidebar').onclick = () => { document.getElementById('sidebar').classList.remove('sidebar-open'); document.getElementById('overlay').classList.remove('active'); };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "bhw") {
                    userBrgy = docSnap.data().barangay;
                    document.getElementById('user-name-display').innerText = docSnap.data().name;
                    document.getElementById('brgy-badge').innerText = `Brgy. ${userBrgy}`;
                    
                    // Show internal management link
                    document.getElementById('internal-section').classList.remove('hidden');
                    document.getElementById('bhw-link').classList.remove('hidden');
                    
                    document.body.classList.add('auth-ready');
                    lucide.createIcons();
                    AOS.init({ duration: 800, once: true });
                    init();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            const q = query(collection(db, "medicine_inventory"), where("barangay", "==", userBrgy));
            onSnapshot(q, (snap) => {
                allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allItems);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('inventory-table-body');
            body.innerHTML = data.map((item, index) => {
                const rank = item.rank || 'moderate';
                return `
                <tr class="hover:bg-slate-50 transition-all animate-row">
                    <td class="px-10 py-7">
                        <span class="font-bold text-slate-800 text-sm block">${item.name}</span>
                    </td>
                    <td class="px-8 py-7 text-slate-500 font-bold text-[12px]">${item.addedDate || 'N/A'}</td>
                    <td class="px-8 py-7"><span class="px-3 py-1 bg-slate-100 rounded-full text-slate-500 font-bold text-[11px]">${item.expiryDate || 'N/A'}</span></td>
                    <td class="px-8 py-7">
                        <span class="badge status-${rank} ${rank === 'critical' ? 'pulse-critical' : ''}">${rank}</span>
                    </td>
                    <td class="px-8 py-7 text-center font-bold text-lg text-slate-700">${(item.count || 0).toLocaleString()}</td>
                    <td class="px-10 py-7 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="editEntry('${item.id}')" class="p-2 border rounded-xl hover:bg-blue-500 hover:text-white transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-2 border rounded-xl hover:bg-red-500 hover:text-white transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`}).join('');
            lucide.createIcons();
        }

        window.openAddModal = () => { 
            document.getElementById('item-form').reset();
            document.getElementById('entry-id').value = "";
            document.getElementById('med-added-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('item-modal').classList.remove('hidden'); 
        };
        
        window.closeModal = () => document.getElementById('item-modal').classList.add('hidden');

        window.editEntry = (id) => {
            const item = allItems.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            document.getElementById('medicine-input').value = item.name;
            document.getElementById('med-added-date').value = item.addedDate;
            document.getElementById('med-count').value = item.count;
            document.getElementById('med-rank').value = item.rank || 'moderate';
            document.getElementById('med-expiry').value = item.expiryDate;
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.deleteEntry = async (id) => { if(confirm("Delete this record?")) await deleteDoc(doc(db, "medicine_inventory", id)); };

        document.getElementById('item-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = { 
                name: document.getElementById('medicine-input').value, 
                addedDate: document.getElementById('med-added-date').value,
                count: parseInt(document.getElementById('med-count').value), 
                rank: document.getElementById('med-rank').value,
                expiryDate: document.getElementById('med-expiry').value, 
                barangay: userBrgy, 
                createdAt: Timestamp.now() 
            };
            id ? await updateDoc(doc(db, "medicine_inventory", id), data) : await addDoc(collection(db, "medicine_inventory"), data);
            closeModal();
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
