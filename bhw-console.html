<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHW Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #1e3a8a; }
        .bg-bhw-emerald { background-color: #10b981; }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            max-height: 250px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 600; }
        .dropdown-item:hover { background-color: #f0fdf4; color: #10b981; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 transition-all group">
                        <div class="w-8 h-8 bg-emerald-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="package" class="w-4 h-4 text-emerald-600 group-hover:text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>

                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 transition-all group">
                        <div class="w-8 h-8 bg-amber-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="file-bar-chart" class="w-4 h-4 text-amber-600 group-hover:text-white"></i>
                        </div>
                        <span>Disease Reports</span>
                    </a>

                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-blue-50 hover:text-blue-600 transition-all group">
                        <div class="w-8 h-8 bg-blue-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="phone" class="w-4 h-4 text-blue-600 group-hover:text-white transition-colors"></i>
                        </div>
                        <span>Hotlines</span>
                    </a>

                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                        <a href="bhw-console.html" class="flex items-center gap-3 bg-bhw-emerald text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-emerald-200 transition-all">
                            <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="shield-check" class="w-4 h-4 text-white"></i>
                            </div>
                            <span>BHW Console</span>
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                    <h2 class="text-[10px] md:text-sm font-bold text-slate-400 uppercase tracking-widest">BHW Inventory</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-3 md:px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-xs md:text-sm">BHW User</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Quick search..." class="w-full pl-14 pr-4 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 ring-emerald-100 shadow-sm font-semibold text-navy">
                    </div>
                    <button onclick="openAddModal()" class="w-full md:w-auto bg-bhw-emerald text-white px-10 py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-3 hover:bg-emerald-600 shadow-xl shadow-emerald-100 transition-all">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add Stock
                    </button>
                </div>

                <div class="bg-white rounded-[2rem] md:rounded-[3rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-10 py-6">Item Identity</th>
                                    <th class="px-8 py-6">Expiry</th>
                                    <th class="px-8 py-6 text-center">Stock</th>
                                    <th class="px-8 py-6">Recorded</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="item-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-navy/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden scale-95 transition-all duration-300" id="modal-container">
            <div class="absolute top-0 left-0 w-full h-2 bg-bhw-emerald"></div>
            <div class="p-8 pb-0">
                <h3 class="text-2xl font-bold text-navy">Medicine Entry</h3>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">BHW Inventory Log</p>
            </div>
            <form id="item-form" class="p-8 space-y-5">
                <input type="hidden" id="entry-id">
                <div class="relative">
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Select Medicine</label>
                    <input type="text" id="medicine-input" autocomplete="off" placeholder="Search..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-2 ring-emerald-100">
                    <div id="medicine-dropdown" class="dropdown-list custom-scrollbar"></div>
                    <input type="hidden" id="med-name" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Qty</label>
                        <input type="number" id="med-count" required min="1" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Unit</label>
                        <select id="med-unit" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none">
                            <option value="Bottles">Bottles</option>
                            <option value="Boxes">Boxes</option>
                            <option value="Tablets/Pcs">Tablets/Pcs</option>
                            <option value="Capsules">Capsules</option>
                            <option value="Sachets">Sachets</option>
                            <option value="Tubes">Tubes</option>
                            <option value="Vials">Vials</option>
                            <option value="Units">Units</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Expiry</label>
                    <input type="date" id="med-expiry" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none">
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 font-bold text-slate-400">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 bg-bhw-emerald text-white font-bold rounded-2xl shadow-xl shadow-emerald-100">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy, Timestamp, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // MEDICINE LIST RETAINED EXACTLY
        const medicineList = ["Paracetamol (Acetaminophen)", "Ibuprofen", "Mefenamic acid", "Aspirin", "Naproxen", "Diclofenac", "Celecoxib", "Ketoprofen", "Phenylephrine", "Pseudoephedrine", "Chlorphenamine", "Diphenhydramine", "Cetirizine", "Loratadine", "Carbocisteine", "Ambroxol", "Guaifenesin", "Dextromethorphan", "Salbutamol inhaler", "Oxymetazoline nasal spray", "Steam inhalation solutions", "Fexofenadine", "Levocetirizine", "Hydrocortisone cream", "Antacids (Aluminum hydroxide, Magnesium hydroxide)", "Sodium bicarbonate", "Omeprazole", "Lansoprazole", "Pantoprazole", "Esomeprazole", "Loperamide", "Oral Rehydration Salts (ORS)", "Simethicone", "Domperidone", "Metoclopramide", "Hyoscine butylbromide", "Povidone iodine", "Hydrogen peroxide", "Mupirocin ointment", "Clotrimazole cream", "Ketoconazole cream", "Calamine lotion", "Zinc oxide", "Permethrin", "Acyclovir cream", "Amoxicillin", "Amoxicillin + Clavulanic acid", "Azithromycin", "Clarithromycin", "Cefuroxime", "Ceftriaxone", "Ciprofloxacin", "Levofloxacin", "Doxycycline", "Metronidazole", "Co-trimoxazole", "Isoniazid", "Rifampicin", "Pyrazinamide", "Ethambutol", "Fixed-dose TB combinations", "Amlodipine", "Losartan", "Telmisartan", "Captopril", "Enalapril", "Metoprolol", "Atenolol", "Hydrochlorothiazide", "Metformin", "Glimepiride", "Gliclazide", "Insulin (Regular, NPH, Glargine)", "Sitagliptin", "Empagliflozin", "Atorvastatin", "Simvastatin", "Rosuvastatin", "Budesonide inhaler", "Fluticasone", "Ipratropium bromide", "Fluoxetine", "Sertraline", "Escitalopram", "Amitriptyline", "Risperidone", "Quetiapine", "Alprazolam", "Diazepam", "Vitamin A", "Vitamin B1 (Thiamine)", "Vitamin B6", "Vitamin B12", "Vitamin C", "Vitamin D3", "Vitamin E", "Vitamin K", "B-complex capsules", "B1 + B6 + B12 combinations", "Iron (Ferrous sulfate)", "Calcium carbonate", "Calcium + Vitamin D", "Magnesium", "Zinc", "Potassium supplements", "Adult multivitamins", "Children’s multivitamins", "Prenatal vitamins", "Senior vitamins", "Probiotics", "Fish oil (Omega-3)", "Glutathione", "Antiseptic alcohol", "Hand sanitizer", "Thermometer", "Blood pressure monitor", "Glucometer", "Nebulizer solution", "Activated charcoal", "Epinephrine injection"];

        const mInput = document.getElementById('medicine-input');
        const mDrop = document.getElementById('medicine-dropdown');
        const hInput = document.getElementById('med-name');

        mInput.addEventListener('input', () => {
            const q = mInput.value.toLowerCase();
            const filtered = medicineList.filter(m => m.toLowerCase().includes(q));
            mDrop.innerHTML = filtered.map(m => `<div class="dropdown-item" onclick="selectMedicine('${m}')">${m}</div>`).join('');
            mDrop.classList.toggle('active', filtered.length > 0 && q.length > 0);
        });

        window.selectMedicine = (n) => {
            mInput.value = n;
            hInput.value = n;
            mDrop.classList.remove('active');
        };

        let userBrgy = "";
        let allItems = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "bhw") {
                    userBrgy = docSnap.data().barangay;
                    document.getElementById('user-name-display').innerText = docSnap.data().name;
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 800, once: true });
                    init();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            const q = query(collection(db, "medicine_inventory"), where("barangay", "==", userBrgy), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allItems);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('inventory-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-emerald-50 text-bhw-emerald rounded-lg flex items-center justify-center"><i data-lucide="pill" class="w-4 h-4"></i></div>
                            <div>
                                <span class="font-bold text-navy text-lg leading-tight block">${item.name}</span>
                                <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${item.unit}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-7 text-slate-500 font-bold text-sm">${item.expiryDate || 'N/A'}</td>
                    <td class="px-8 py-7 text-center font-black text-navy text-xl">${(item.count || 0).toLocaleString()}</td>
                    <td class="px-8 py-7 text-slate-400 text-xs">${item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString() : 'N/A'}</td>
                    <td class="px-10 py-7 text-right">
                        <div class="flex justify-end gap-3">
                            <button onclick="editEntry('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-blue-500 hover:text-white transition-all shadow-sm"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.openAddModal = () => {
            document.getElementById('item-form').reset();
            document.getElementById('entry-id').value = "";
            mInput.value = "";
            hInput.value = "";
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.closeModal = () => { document.getElementById('item-modal').classList.add('hidden'); };

        window.editEntry = (id) => {
            const item = allItems.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            mInput.value = item.name;
            hInput.value = item.name;
            document.getElementById('med-count').value = item.count;
            document.getElementById('med-unit').value = item.unit;
            document.getElementById('med-expiry').value = item.expiryDate;
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.deleteEntry = async (id) => { if(confirm("Delete this record?")) await deleteDoc(doc(db, "medicine_inventory", id)); };

        document.getElementById('item-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                name: hInput.value || mInput.value,
                count: parseInt(document.getElementById('med-count').value),
                unit: document.getElementById('med-unit').value,
                expiryDate: document.getElementById('med-expiry').value,
                barangay: userBrgy,
                createdAt: Timestamp.now()
            };
            id ? await updateDoc(doc(db, "medicine_inventory", id), data) : await addDoc(collection(db, "medicine_inventory"), data);
            closeModal();
        };

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); s.classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allItems.filter(c => c.name.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
