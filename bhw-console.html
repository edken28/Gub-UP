<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHW Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .sidebar-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-item:hover { transform: translateX(5px); }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        .status-critical { background: #fee2e2; color: #ef4444; }
        .status-low { background: #fef3c7; color: #f59e0b; }
        .status-stable { background: #dcfce7; color: #22c55e; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg rotate-3">
                            <i data-lucide="shield-plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-slate-900 text-lg tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">BHW Console</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="sidebar-item flex items-center gap-3 text-slate-500 px-4 py-3 rounded-xl font-bold hover:bg-slate-50">
                        <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard
                    </a>
                    <a href="stock.html" class="sidebar-item flex items-center gap-3 text-slate-500 px-4 py-3 rounded-xl font-bold hover:bg-slate-50">
                        <i data-lucide="package" class="w-5 h-5"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="sidebar-item flex items-center gap-3 text-slate-500 px-4 py-3 rounded-xl font-bold hover:bg-slate-50">
                        <i data-lucide="file-text" class="w-5 h-5"></i> Reports
                    </a>
                    
                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-4 mb-3">Staff Tools</p>
                        <a href="bhw-console.html" class="sidebar-item flex items-center gap-3 bg-emerald-500 text-white px-5 py-4 rounded-2xl font-bold shadow-lg shadow-emerald-200">
                            <i data-lucide="clipboard-check" class="w-5 h-5"></i> Manage Inventory
                        </a>
                    </div>
                </nav>
            </div>
            
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full h-screen overflow-y-auto bg-slate-50/50">
            <header class="glass sticky top-0 z-40 px-4 md:px-8 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-white rounded-xl shadow-sm border border-slate-100">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <div>
                        <h2 class="text-sm font-extrabold text-slate-800 uppercase tracking-tight">Barangay Stock Control</h2>
                        <p id="user-brgy-display" class="text-[11px] text-emerald-600 font-bold uppercase tracking-widest"></p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-white p-1.5 pr-4 rounded-2xl shadow-sm border border-slate-100">
                    <div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center font-bold">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </div>
                    <span id="user-name-display" class="font-bold text-slate-700 text-xs hidden md:block">BHW Worker</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div data-aos="fade-down" class="flex flex-col md:flex-row items-center gap-4 mb-8">
                    <div class="relative w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="med-search" placeholder="Quick search inventory..." class="w-full pl-14 pr-6 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-4 ring-emerald-500/10 shadow-sm font-medium transition-all">
                    </div>
                    <button onclick="openAddModal()" class="w-full md:w-auto bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-slate-800 shadow-xl transition-all active:scale-95">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add Stock
                    </button>
                </div>

                <div data-aos="fade-up" class="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/50 overflow-hidden">
                    <div class="hidden md:block overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] border-b border-slate-50">
                                    <th class="px-10 py-6">Medicine Detail</th>
                                    <th class="px-6 py-6 text-center">In-Stock</th>
                                    <th class="px-6 py-6">Expiration</th>
                                    <th class="px-6 py-6">Last Updated</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>

                    <div id="inventory-mobile-list" class="md:hidden divide-y divide-slate-50 p-2"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="item-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300">
            <div class="p-8 pb-4">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 id="modal-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Stock Entry</h3>
                        <p class="text-[11px] font-bold text-emerald-600 uppercase tracking-widest mt-1">Inventory Management</p>
                    </div>
                    <button onclick="closeModal()" class="p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-red-500 transition-colors">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
            
            <form id="item-form" class="p-8 pt-0 space-y-4">
                <input type="hidden" id="item-id">
                
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Medicine Identity</label>
                    <input list="medicine-list" id="form-name" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-slate-800 outline-none focus:ring-4 ring-emerald-500/10 transition-all" placeholder="Search or type medicine...">
                    <datalist id="medicine-list">
                        <option value="Paracetamol (Acetaminophen)"><option value="Ibuprofen"><option value="Mefenamic acid">
                        <option value="Aspirin"><option value="Naproxen"><option value="Diclofenac"><option value="Celecoxib">
                        <option value="Ketoprofen"><option value="Phenylephrine"><option value="Pseudoephedrine"><option value="Chlorphenamine">
                        <option value="Diphenhydramine"><option value="Cetirizine"><option value="Loratadine"><option value="Carbocisteine">
                        <option value="Ambroxol"><option value="Guaifenesin"><option value="Dextromethorphan"><option value="Salbutamol (inhaler)">
                        <option value="Oxymetazoline nasal spray"><option value="Steam inhalation solutions"><option value="Fexofenadine">
                        <option value="Levocetirizine"><option value="Hydrocortisone cream"><option value="Antacids (Alum/Magnesium)">
                        <option value="Sodium bicarbonate"><option value="Omeprazole"><option value="Lansoprazole"><option value="Pantoprazole">
                        <option value="Esomeprazole"><option value="Ranitidine"><option value="Loperamide"><option value="Oral Rehydration Salts (ORS)">
                        <option value="Simethicone"><option value="Domperidone"><option value="Metoclopramide"><option value="Hyoscine butylbromide">
                        <option value="Betadine (Povidone iodine)"><option value="Hydrogen peroxide"><option value="Mupirocin ointment">
                        <option value="Clotrimazole cream"><option value="Ketoconazole cream"><option value="Calamine lotion">
                        <option value="Zinc oxide"><option value="Permethrin"><option value="Acyclovir cream"><option value="Amoxicillin">
                        <option value="Amoxicillin + Clavulanic acid"><option value="Azithromycin"><option value="Clarithromycin">
                        <option value="Cefuroxime"><option value="Ceftriaxone"><option value="Ciprofloxacin"><option value="Levofloxacin">
                        <option value="Doxycycline"><option value="Metronidazole"><option value="Co-trimoxazole"><option value="Isoniazid">
                        <option value="Rifampicin"><option value="Pyrazinamide"><option value="Ethambulol"><option value="Fixed-dose TB combinations">
                        <option value="Amlodipine"><option value="Losartan"><option value="Telmisartan"><option value="Captopril">
                        <option value="Enalapril"><option value="Metoprolol"><option value="Atenolol"><option value="Hydrochlorothiazide">
                        <option value="Metformin"><option value="Glimepiride"><option value="Gliclazide"><option value="Insulin (Regular, NPH, Glargine)">
                        <option value="Sitagliptin"><option value="Empagliflozin"><option value="Atorvastatin"><option value="Simvastatin">
                        <option value="Rosuvastatin"><option value="Budesonide inhaler"><option value="Fluticasone"><option value="Ipratropium bromide">
                        <option value="Fluoxetine"><option value="Sertraline"><option value="Escitalopram"><option value="Amitriptyline">
                        <option value="Risperidone"><option value="Quetiapine"><option value="Alprazolam"><option value="Diazepam">
                        <option value="Vitamin A"><option value="Vitamin B1"><option value="Vitamin B6"><option value="Vitamin B12">
                        <option value="Vitamin C"><option value="Vitamin D3"><option value="Vitamin E"><option value="Vitamin K">
                        <option value="Iron (Ferrous sulfate)"><option value="Calcium carbonate"><option value="Magnesium"><option value="Zinc">
                        <option value="Adult multivitamins"><option value="Children’s multivitamins"><option value="Prenatal vitamins">
                        <option value="Oral contraceptive pills"><option value="Injectable contraceptives"><option value="Folic acid">
                        <option value="Pediatric paracetamol"><option value="Pediatric ibuprofen"><option value="ORS sachets">
                        <option value="Antiseptic alcohol"><option value="Hand sanitizer"><option value="Glucometer"><option value="Epinephrine">
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Quantity</label>
                        <input type="number" id="form-qty" required min="0" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-slate-800 outline-none focus:ring-4 ring-emerald-500/10 transition-all">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Expiry Date</label>
                        <input type="date" id="form-expiry" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-slate-800 outline-none focus:ring-4 ring-emerald-500/10 transition-all">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Barangay Assignment</label>
                    <input type="text" id="form-brgy" readonly class="w-full p-4 bg-slate-100 border border-slate-200 rounded-2xl font-bold text-slate-500 cursor-not-allowed">
                </div>

                <button type="submit" class="w-full py-5 bg-emerald-500 text-white font-extrabold rounded-2xl shadow-xl shadow-emerald-200 hover:bg-emerald-600 transition-all transform active:scale-[0.98] mt-4">
                    Confirm Stock Entry
                </button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userBrgy = "";
        let allItems = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === "bhw") {
                    userBrgy = userDoc.data().barangay;
                    document.getElementById('user-name-display').innerText = userDoc.data().name;
                    document.getElementById('user-brgy-display').innerText = `Barangay ${userBrgy}`;
                    document.getElementById('form-brgy').value = userBrgy;
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 800, once: true });
                    initData();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function initData() {
            const q = query(collection(db, "medicine_inventory"), where("barangay", "==", userBrgy));
            onSnapshot(q, (snapshot) => {
                allItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderUI(allItems);
            });
        }

        function renderUI(data) {
            const searchTerm = document.getElementById('med-search').value.toLowerCase();
            const filtered = data.filter(item => item.name.toLowerCase().includes(searchTerm));
            
            const tbody = document.getElementById('inventory-table-body');
            const mobileList = document.getElementById('inventory-mobile-list');
            tbody.innerHTML = "";
            mobileList.innerHTML = "";

            filtered.forEach(item => {
                const qty = parseInt(item.quantity || 0);
                const expiry = item.expiryDate || "---";
                const lastUpdated = item.updatedAt?.toDate() ? item.updatedAt.toDate().toLocaleDateString() : 'Just now';
                
                let statusClass = "status-stable";
                let statusText = "Good";
                if(qty < 100) { statusClass = "status-critical"; statusText = "Refill"; }
                else if(qty < 300) { statusClass = "status-low"; statusText = "Low"; }

                // Table View
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/50 transition-colors group">
                        <td class="px-10 py-6">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition-all">
                                    <i data-lucide="pill" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 text-base leading-tight">${item.name}</h4>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Gubat Network</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-6 text-center">
                            <div class="inline-flex flex-col items-center">
                                <span class="text-xl font-black text-slate-900 leading-none">${qty}</span>
                                <span class="px-2 py-0.5 rounded-full text-[9px] font-black uppercase mt-1 ${statusClass}">${statusText}</span>
                            </div>
                        </td>
                        <td class="px-6 py-6 font-bold text-slate-500 text-sm">${expiry}</td>
                        <td class="px-6 py-6 text-slate-400 text-xs font-medium">${lastUpdated}</td>
                        <td class="px-10 py-6 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="editItem('${item.id}', '${item.name}', ${qty}, '${expiry}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:text-emerald-500 hover:shadow-md transition-all">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteItem('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:text-red-500 hover:shadow-md transition-all">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;

                // Mobile View
                mobileList.innerHTML += `
                    <div class="p-4 bg-white m-2 rounded-3xl border border-slate-100 shadow-sm animate-in fade-in slide-in-from-bottom-2">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center"><i data-lucide="pill" class="w-5 h-5"></i></div>
                                <div>
                                    <h4 class="font-bold text-slate-900 leading-tight">${item.name}</h4>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Exp: ${expiry}</p>
                                </div>
                            </div>
                            <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${statusClass}">${statusText}</span>
                        </div>
                        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest leading-none mb-1">Stock level</span>
                                <span class="text-xl font-black text-slate-900">${qty}</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="editItem('${item.id}', '${item.name}', ${qty}, '${expiry}')" class="p-3 bg-white text-slate-400 rounded-xl border border-slate-100 shadow-sm"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                                <button onclick="deleteItem('${item.id}')" class="p-3 bg-white text-red-500 rounded-xl border border-slate-100 shadow-sm"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('sidebar-closed');
            document.getElementById('sidebar').classList.toggle('sidebar-open');
        };

        window.openAddModal = () => {
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = "";
            document.getElementById('modal-title').innerText = "Register Stock";
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.editItem = (id, name, qty, expiry) => {
            document.getElementById('item-id').value = id;
            document.getElementById('form-name').value = name;
            document.getElementById('form-qty').value = qty;
            document.getElementById('form-expiry').value = expiry;
            document.getElementById('modal-title').innerText = "Update Entry";
            document.getElementById('item-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('item-modal').classList.add('hidden');

        document.getElementById('item-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                name: document.getElementById('form-name').value,
                quantity: parseInt(document.getElementById('form-qty').value),
                expiryDate: document.getElementById('form-expiry').value,
                barangay: userBrgy,
                updatedAt: serverTimestamp()
            };
            id ? await updateDoc(doc(db, "medicine_inventory", id), payload) : await addDoc(collection(db, "medicine_inventory"), payload);
            closeModal();
        };

        window.deleteItem = async (id) => { 
            if(confirm("Permanently delete this item from inventory?")) await deleteDoc(doc(db, "medicine_inventory", id)); 
        };

        document.getElementById('med-search').oninput = () => renderUI(allItems);
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
