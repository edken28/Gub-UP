<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map of Gubat, Sorsogon</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Arial', sans-serif;
        }
        .map-container {
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }
        .barangay {
            fill: #e2e8f0;
            stroke: #475569;
            stroke-width: 1.5;
            transition: fill 0.3s;
        }
        .barangay:hover {
            fill: #3b82f6;
        }
        .label {
            font-size: 8px;
            font-weight: bold;
            fill: #1e293b;
            pointer-events: none;
            text-transform: uppercase;
        }
        .title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #0f172a;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="map-container">
    <div class="title">MAP OF GUBAT, SORSOGON</div>
    
    <svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
        <path class="barangay" d="M180,20 L220,40 L240,100 L180,80 Z" /> <text x="195" y="60" class="label">Bagacay</text>

        <path class="barangay" d="M140,40 L180,20 L180,80 L140,90 Z" /> <text x="150" y="60" class="label">Patag</text>

        <path class="barangay" d="M190,80 L240,100 L230,150 L180,140 Z" /> <text x="200" y="120" class="label">Paco</text>

        <path class="barangay" d="M180,280 L230,280 L240,350 L190,360 Z" style="fill: #1e3a8a;" /> <text x="195" y="325" class="label" style="fill: white;">POBLACION</text>

        <path class="barangay" d="M120,250 L180,280 L170,330 L110,320 Z" /> <text x="125" y="295" class="label">Carriedo</text>

        <path class="barangay" d="M230,280 L280,270 L285,340 L240,350 Z" /> <text x="245" y="315" class="label">Cogon</text>

        <path class="barangay" d="M100,500 L160,530 L140,580 L80,560 Z" /> <text x="105" y="545" class="label">Bentuco</text>

        <path class="barangay" d="M160,530 L220,510 L230,570 L170,590 Z" /> <text x="180" y="560" class="label">Togawe</text>

        <path class="barangay" d="M230,400 L290,420 L280,520 L220,500 Z" /> <text x="245" y="470" class="label">Rizal</text>

        <text x="20" y="580" class="label" style="font-style: italic; font-size: 10px;">*42 Barangay Boundaries Defined by Vector</text>
    </svg>
</div>

</body>
</html>
