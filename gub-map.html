<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUB-UP | Digital Health Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
        }

        /* The New Custom Map Canvas */
        .map-canvas {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 2rem;
            position: relative;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.3) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Barangay Nodes */
        .brgy-node {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #38bdf8;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .brgy-node:hover {
            transform: scale(2);
            background: #fff;
            box-shadow: 0 0 25px #fff;
            z-index: 50;
        }

        .brgy-label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .brgy-node:hover .brgy-label {
            opacity: 1;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-7xl mx-auto">
        <nav class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl">
                    <i data-lucide="map-pin" class="text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tighter">GUB-UP <span class="text-blue-500">MAP</span></h1>
            </div>
            <div class="flex gap-4">
                <button class="px-4 py-2 bg-slate-800 rounded-lg text-sm font-semibold hover:bg-slate-700 transition">Refresh Data</button>
                <button class="px-4 py-2 bg-blue-600 rounded-lg text-sm font-semibold hover:bg-blue-500 transition">Admin Login</button>
            </div>
        </nav>

        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-12 lg:col-span-4 space-y-6">
                <div class="bg-slate-900/50 border border-slate-800 p-6 rounded-3xl">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i data-lucide="layout-grid" class="w-5 h-5 text-blue-400"></i>
                        Barangay Index
                    </h2>
                    <div class="h-[500px] overflow-y-auto custom-scroll space-y-2 pr-2" id="brgy-list">
                        </div>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-8">
                <div class="map-canvas h-[650px] w-full flex items-center justify-center relative">
                    <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none">
                        <h1 class="text-[15rem] font-black italic">GUBAT</h1>
                    </div>

                    <div class="brgy-node" style="top: 15%; left: 60%;"><span class="brgy-label">BAGACAY</span></div>
                    <div class="brgy-node" style="top: 12%; left: 50%;"><span class="brgy-label">PATAG</span></div>
                    <div class="brgy-node" style="top: 20%; left: 54%;"><span class="brgy-label">PACO</span></div>
                    
                    <div class="brgy-node" style="top: 52%; left: 55%; background: #fbbf24; width: 20px; height: 20px;"><span class="brgy-label" style="color:#fbbf24; font-size:12px;">POBLACION</span></div>
                    <div class="brgy-node" style="top: 50%; left: 63%;"><span class="brgy-label">COGON</span></div>
                    <div class="brgy-node" style="top: 48%; left: 45%;"><span class="brgy-label">CARRIEDO</span></div>
                    <div class="brgy-node" style="top: 42%; left: 61%;"><span class="brgy-label">TIRIS</span></div>

                    <div class="brgy-node" style="top: 85%; left: 35%;"><span class="brgy-label">BENTUCO</span></div>
                    <div class="brgy-node" style="top: 90%; left: 45%;"><span class="brgy-label">TOGAWE</span></div>
                    <div class="brgy-node" style="top: 75%; left: 65%;"><span class="brgy-label">RIZAL</span></div>
                </div>
                
                <div class="mt-6 flex justify-between items-center text-slate-500 text-sm italic">
                    <p>Digital reference map for Gubat, Sorsogon</p>
                    <div class="flex items-center gap-4">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-blue-400 rounded-full"></span> Normal</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-yellow-400 rounded-full"></span> Poblacion</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const brgys = [
            "Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", 
            "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", 
            "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", 
            "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", 
            "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", 
            "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"
        ];

        const list = document.getElementById('brgy-list');
        brgys.sort().forEach(b => {
            const div = document.createElement('div');
            div.className = "flex items-center justify-between p-3 bg-slate-800/40 rounded-xl hover:bg-blue-600/20 cursor-pointer transition border border-transparent hover:border-blue-500/50 group";
            div.innerHTML = `
                <span class="text-sm font-semibold text-slate-400 group-hover:text-blue-400">${b}</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
            `;
            list.appendChild(div);
        });

        lucide.createIcons();
    </script>
</body>
</html>
