<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Stocks | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #0f172a; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .table-card { border-radius: 2.5rem; }
        .status-pill { padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .status-low { background: #fff1f2; color: #be123c; }
        .status-good { background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-navy text-xl leading-none tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 bg-blue-600 text-white px-5 py-3.5 rounded-2xl font-semibold shadow-xl shadow-blue-100">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 hover:text-emerald-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-emerald-50 transition-all">
                        <i data-lucide="pill" class="text-emerald-500"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart-2" class="text-amber-500"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 hover:text-sky-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-sky-50 transition-all">
                        <i data-lucide="phone-call" class="text-sky-500"></i> Hotlines
                    </a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-5">Internal Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-3.5 font-semibold hover:bg-emerald-50 rounded-2xl transition-all">
                            <i data-lucide="users" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 text-red-600 px-5 py-3.5 font-semibold hover:bg-red-50 rounded-2xl transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="glass-header border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden p-3 bg-white border border-slate-100 rounded-xl">
                        <i data-lucide="menu"></i>
                    </button>
                    <div>
                        <h2 class="text-sm font-extrabold text-navy uppercase tracking-tight">Public Inventory</h2>
                        <p class="text-[10px] font-bold text-slate-400">View-Only Stocks</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center shadow-inner"><i data-lucide="user" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-sm hidden sm:inline">Guest</span>
                </div>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto">
                <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm mb-10 flex flex-col lg:flex-row items-center gap-4" data-aos="fade-down">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="stock-search" placeholder="Search medicines..." class="w-full pl-14 pr-4 py-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-4 ring-emerald-50 font-semibold text-navy transition-all">
                    </div>
                    
                    <div class="flex flex-wrap gap-2 w-full lg:w-auto">
                        <select id="filter-barangay" class="px-4 py-4 bg-slate-50 border-none rounded-2xl font-bold text-xs text-slate-500 outline-none">
                            <option value="all">All Barangays</option>
                            <option value="Poblacion">Poblacion</option>
                            <option value="Pinontalan">Pinontalan</option>
                            <option value="Benguet">Benguet</option>
                        </select>
                        <select id="sort-quantity" class="px-4 py-4 bg-slate-50 border-none rounded-2xl font-bold text-xs text-slate-500 outline-none">
                            <option value="default">Sort Quantity</option>
                            <option value="low-high">Lowest to Highest</option>
                            <option value="high-low">Highest to Lowest</option>
                        </select>
                        <select id="sort-expiry" class="px-4 py-4 bg-slate-50 border-none rounded-2xl font-bold text-xs text-slate-500 outline-none">
                            <option value="default">Sort Expiry</option>
                            <option value="near">Near to Far</option>
                            <option value="far">Far to Near</option>
                        </select>
                    </div>
                </div>

                <div class="bg-white table-card border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-[0.15em]">
                                    <th class="px-10 py-7">Medicine Details</th>
                                    <th class="px-8 py-7">Barangay</th>
                                    <th class="px-8 py-7">Quantity</th>
                                    <th class="px-8 py-7">Expiry Date</th>
                                    <th class="px-10 py-7 text-right">Status</th>
                                </tr>
                            </thead>
                            <tbody id="stock-table-body" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allStocks = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    document.getElementById('user-name-display').innerText = userData.name;
                    if (['admin', 'bhw', 'rhu'].includes(userData.role)) {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if (userData.role === 'admin') {
                            document.getElementById('bhw-link').classList.remove('hidden');
                            document.getElementById('rhu-link').classList.remove('hidden');
                        } else {
                            document.getElementById(`${userData.role}-link`).classList.remove('hidden');
                        }
                    }
                }
                document.body.classList.add('auth-ready');
                AOS.init({ duration: 800, once: true });
                startListening();
            } else { window.location.href = "login.html"; }
        });

        function startListening() {
            // Listen to the 'medicine_stocks' collection
            onSnapshot(collection(db, "medicine_stocks"), (snap) => {
                allStocks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                applyFilters();
            });
        }

        function applyFilters() {
            let filtered = [...allStocks];
            const search = document.getElementById('stock-search').value.toLowerCase();
            const barangay = document.getElementById('filter-barangay').value;
            const qtySort = document.getElementById('sort-quantity').value;
            const expirySort = document.getElementById('sort-expiry').value;

            if(search) filtered = filtered.filter(s => s.name.toLowerCase().includes(search));
            if(barangay !== 'all') filtered = filtered.filter(s => s.barangay === barangay);

            if(qtySort === 'low-high') filtered.sort((a,b) => a.quantity - b.quantity);
            if(qtySort === 'high-low') filtered.sort((a,b) => b.quantity - a.quantity);

            if(expirySort !== 'default') {
                filtered.sort((a,b) => {
                    const dateA = a.expiryDate ? new Date(a.expiryDate) : new Date('2099-01-01');
                    const dateB = b.expiryDate ? new Date(b.expiryDate) : new Date('2099-01-01');
                    return expirySort === 'near' ? dateA - dateB : dateB - dateA;
                });
            }

            renderTable(filtered);
        }

        function renderTable(data) {
            const body = document.getElementById('stock-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50/50 transition-all">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center"><i data-lucide="pill" class="w-5 h-5"></i></div>
                            <div>
                                <span class="font-extrabold text-navy text-lg block">${item.name}</span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.category || 'Medicine'}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-7 font-bold text-slate-500">${item.barangay || 'Not Assigned'}</td>
                    <td class="px-8 py-7"><span class="font-black text-navy">${item.quantity} units</span></td>
                    <td class="px-8 py-7 font-bold text-slate-500">${item.expiryDate || 'No Expiry'}</td>
                    <td class="px-10 py-7 text-right">
                        <span class="status-pill ${item.quantity < 50 ? 'status-low' : 'status-good'}">
                            ${item.quantity < 50 ? 'Low Stock' : 'Good Stock'}
                        </span>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        // Attach listeners
        ['stock-search', 'filter-barangay', 'sort-quantity', 'sort-expiry'].forEach(id => {
            document.getElementById(id).addEventListener('input', applyFilters);
        });

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); s.classList.toggle('sidebar-open');
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
