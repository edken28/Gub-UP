<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Stocks | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #0f172a; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .table-card { border-radius: 2.5rem; }
        .status-pill { padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .status-low { background: #fff1f2; color: #be123c; }
        .status-good { background: #f0fdf4; color: #15803d; }
        .status-expired { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-navy text-xl leading-none tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400 hover:text-red-500" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 hover:text-blue-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-blue-50 transition-all">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 bg-emerald-600 text-white px-5 py-3.5 rounded-2xl font-semibold shadow-xl shadow-emerald-100 transition-all">
                        <i data-lucide="pill"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart-2"></i> Disease Reports
                    </a>
                </nav>
            </div>
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="glass-header border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="flex md:hidden p-3 bg-white border border-slate-100 rounded-xl text-navy shadow-sm">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <div>
                        <h2 class="text-sm font-extrabold text-navy uppercase tracking-tight">Public Stock View</h2>
                        <p class="text-[10px] font-bold text-slate-400">Available Medicine per Barangay</p>
                    </div>
                </div>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10" data-aos="fade-down">
                    <div class="relative flex-1 w-full group">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="stock-search" placeholder="Search medicines or barangay..." class="w-full pl-14 pr-4 py-5 bg-white border border-slate-100 rounded-3xl outline-none focus:ring-4 ring-emerald-50 shadow-sm font-semibold text-navy transition-all">
                    </div>
                </div>

                <div class="bg-white table-card border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-[0.15em]">
                                    <th class="px-10 py-7">Medicine</th>
                                    <th class="px-8 py-7">Barangay</th>
                                    <th class="px-8 py-7">Quantity</th>
                                    <th class="px-8 py-7">Expiry Date</th>
                                    <th class="px-8 py-7">Status</th>
                                </tr>
                            </thead>
                            <tbody id="stock-table-body" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allStocks = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.body.classList.add('auth-ready');
                AOS.init({ duration: 800, once: true });
                init();
            } else { window.location.href = "login.html"; }
        });

        function init() {
            // Updated Query: Sorting is handled in Javascript to allow multi-level logic (Qty + Expiry)
            onSnapshot(collection(db, "medicine_stocks"), (snap) => {
                allStocks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // CUSTOM SORTING LOGIC:
                // 1. Sort by Quantity (Lowest to Highest)
                // 2. Then sort by Expiry Date (Soonest to Furthest)
                allStocks.sort((a, b) => {
                    if (a.quantity !== b.quantity) return a.quantity - b.quantity;
                    return new Date(a.expiryDate) - new Date(b.expiryDate);
                });

                renderStockTable(allStocks);
            });
        }

        function renderStockTable(data) {
            const body = document.getElementById('stock-table-body');
            body.innerHTML = data.map(item => {
                const expiry = item.expiryDate || 'N/A';
                const isLow = item.quantity < 50;
                
                return `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center"><i data-lucide="pill" class="w-5 h-5"></i></div>
                            <div>
                                <span class="font-extrabold text-navy text-lg block">${item.name}</span>
                                <span class="text-[10px] text-slate-400 font-bold uppercase">${item.category}</span>
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-7 font-bold text-slate-600">${item.barangay || 'General'}</td>
                    <td class="px-8 py-7"><span class="font-black text-navy">${item.quantity} units</span></td>
                    <td class="px-8 py-7 font-semibold text-slate-500">${expiry}</td>
                    <td class="px-8 py-7">
                        <span class="status-pill ${isLow ? 'status-low' : 'status-good'}">
                            ${isLow ? 'Low Stock' : 'Available'}
                        </span>
                    </td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        document.getElementById('stock-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            const filtered = allStocks.filter(s => 
                s.name.toLowerCase().includes(t) || 
                (s.barangay && s.barangay.toLowerCase().includes(t))
            );
            renderStockTable(filtered);
        };

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); 
            s.classList.toggle('sidebar-open');
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
