<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Stocks | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #0f172a; }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        /* Sidebar Mobile Logic */
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .table-card { border-radius: 2.5rem; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Status colors */
        .status-pill { padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .status-low { background: #fff1f2; color: #be123c; }
        .status-good { background: #f0fdf4; color: #15803d; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-navy text-xl leading-none tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400 hover:text-red-500 transition-colors" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="stock.html" class="flex items-center gap-3 bg-emerald-500 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-emerald-100 transition-all">
                        <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                            <i data-lucide="pill" class="w-4 h-4 text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>

                    <a href="reports.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 transition-all group">
                        <div class="w-8 h-8 bg-amber-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="file-bar-chart" class="w-4 h-4 text-amber-600 group-hover:text-white"></i>
                        </div>
                        <span>Disease Reports</span>
                    </a>

                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-blue-50 transition-all group">
                        <div class="w-8 h-8 bg-blue-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="phone" class="w-4 h-4 text-blue-600 group-hover:text-white"></i>
                        </div>
                        <span>Hotlines</span>
                    </a>

                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-3">Internal Consoles</p>
                        <a href="rhu-console.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-red-50 transition-all group">
                            <div class="w-8 h-8 bg-red-100 group-hover:bg-red-500 rounded-lg flex items-center justify-center transition-colors">
                                <i data-lucide="shield-alert" class="w-4 h-4 text-red-600 group-hover:text-white"></i>
                            </div>
                            <span>RHU Console</span>
                        </a>
                    </div>
                </nav>
            </div>
            
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="glass-header border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="flex md:hidden p-3 bg-white border border-slate-100 rounded-xl text-navy shadow-sm hover:bg-slate-50 transition-all">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <div>
                        <h2 class="text-sm font-extrabold text-navy uppercase tracking-tight">Inventory Management</h2>
                        <p class="text-[10px] font-bold text-slate-400">Medicine & Supplies Control</p>
                    </div>
                </div>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10" data-aos="fade-down">
                    <div class="relative flex-1 w-full group">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="stock-search" placeholder="Search medicines by name or category..." class="w-full pl-14 pr-4 py-5 bg-white border border-slate-100 rounded-3xl outline-none focus:ring-4 ring-emerald-50 shadow-sm font-semibold text-navy transition-all">
                    </div>
                    <button onclick="openStockModal()" class="w-full lg:w-auto bg-emerald-500 text-white px-10 py-5 rounded-3xl font-bold text-sm flex items-center justify-center gap-3 hover:bg-emerald-600 shadow-xl shadow-emerald-100 transition-all">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add New Stock
                    </button>
                </div>

                <div class="bg-white table-card border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-[0.15em]">
                                    <th class="px-10 py-7">Medicine Details</th>
                                    <th class="px-8 py-7">Quantity</th>
                                    <th class="px-8 py-7">Category</th>
                                    <th class="px-8 py-7">Status</th>
                                    <th class="px-10 py-7 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="stock-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="stock-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeStockModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col scale-95 transition-all duration-300" id="stock-modal-container">
            <div class="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
            <div class="p-8 pb-0 flex justify-between items-start">
                <div>
                    <h3 id="stock-modal-title" class="text-2xl font-extrabold text-navy tracking-tight">Add Stock</h3>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Official Inventory Entry</p>
                </div>
                <button onclick="closeStockModal()" class="p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-navy transition-colors"><i data-lucide="x"></i></button>
            </div>
            
            <form id="stock-form" class="p-8 space-y-6 overflow-y-auto custom-scrollbar">
                <input type="hidden" id="stock-id">
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Medicine Name</label>
                    <input type="text" id="med-name" required placeholder="e.g. Paracetamol 500mg" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-4 ring-emerald-50 transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Current Qty</label>
                        <input type="number" id="med-qty" required min="0" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Category</label>
                        <select id="med-category" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none">
                            <option value="Analgesic">Analgesic</option>
                            <option value="Antibiotic">Antibiotic</option>
                            <option value="Antiviral">Antiviral</option>
                            <option value="Vaccine">Vaccine</option>
                            <option value="Vitamins">Vitamins</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeStockModal()" class="flex-1 font-bold text-slate-400">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 bg-emerald-500 text-white font-bold rounded-2xl shadow-xl shadow-emerald-100">Update Stock</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allStocks = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.body.classList.add('auth-ready');
                AOS.init({ duration: 800, once: true });
                init();
            } else { window.location.href = "login.html"; }
        });

        function init() {
            onSnapshot(query(collection(db, "medicine_stocks"), orderBy("name", "asc")), (snap) => {
                allStocks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderStockTable(allStocks);
            });
        }

        function renderStockTable(data) {
            const body = document.getElementById('stock-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-500 rounded-xl flex items-center justify-center"><i data-lucide="pill" class="w-5 h-5"></i></div>
                            <span class="font-extrabold text-navy text-lg">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-8 py-7"><span class="font-black text-navy">${item.quantity} units</span></td>
                    <td class="px-8 py-7 text-slate-500 font-bold uppercase text-xs">${item.category}</td>
                    <td class="px-8 py-7">
                        <span class="status-pill ${item.quantity < 50 ? 'status-low' : 'status-good'}">
                            ${item.quantity < 50 ? 'Low Stock' : 'Good Stock'}
                        </span>
                    </td>
                    <td class="px-10 py-7 text-right">
                        <button onclick="editStock('${item.id}')" class="p-2 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteStock('${item.id}')" class="p-2 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.openStockModal = () => {
            document.getElementById('stock-form').reset();
            document.getElementById('stock-id').value = "";
            document.getElementById('stock-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('stock-modal-container').classList.remove('scale-95'), 10);
        };

        window.closeStockModal = () => {
            document.getElementById('stock-modal-container').classList.add('scale-95');
            setTimeout(() => document.getElementById('stock-modal').classList.add('hidden'), 200);
        };

        window.editStock = (id) => {
            const item = allStocks.find(s => s.id === id);
            document.getElementById('stock-id').value = id;
            document.getElementById('med-name').value = item.name;
            document.getElementById('med-qty').value = item.quantity;
            document.getElementById('med-category').value = item.category;
            document.getElementById('stock-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('stock-modal-container').classList.remove('scale-95'), 10);
        };

        window.deleteStock = async (id) => { if(confirm("Delete this stock entry?")) await deleteDoc(doc(db, "medicine_stocks", id)); };

        document.getElementById('stock-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('stock-id').value;
            const data = {
                name: document.getElementById('med-name').value,
                quantity: parseInt(document.getElementById('med-qty').value),
                category: document.getElementById('med-category').value
            };
            id ? await updateDoc(doc(db, "medicine_stocks", id), data) : await addDoc(collection(db, "medicine_stocks"), data);
            closeStockModal();
        };

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); 
            s.classList.toggle('sidebar-open');
        };

        document.getElementById('stock-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderStockTable(allStocks.filter(s => s.name.toLowerCase().includes(t) || s.category.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
