<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Stocks | GUB-UP</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #1e3a8a; }
        
        /* Mobile Sidebar Logic */
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        /* Entrance Animation */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-row { animation: slideIn 0.4s ease forwards; }

        /* Low Stock Warning Pulse */
        .pulse-red { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span>Dashboard</span>
                    </a>
                    
                    <a href="stock.html" class="flex items-center gap-3 bg-emerald-500 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-emerald-100 transition-all">
                        <i data-lucide="package" class="w-5 h-5 text-white"></i>
                        <span>Medicine Stocks</span>
                    </a>

                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 transition-all group">
                        <i data-lucide="file-bar-chart" class="w-5 h-5 text-amber-500"></i>
                        <span>Disease Reports</span>
                    </a>

                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-sky-50 transition-all group">
                        <i data-lucide="phone" class="w-5 h-5 text-sky-500"></i>
                        <span>Hotlines</span>
                    </a>

                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                        <a href="bhw-console.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 transition-all group">
                            <i data-lucide="user-cog" class="w-5 h-5 text-emerald-500"></i>
                            <span>BHW Console</span>
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                    <div>
                        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">Inventory Overview</h2>
                        <p class="text-navy font-bold text-sm">Public Health Stocks</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-3 md:px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-xs md:text-sm">User</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8" data-aos="fade-down">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Search across all barangays..." class="w-full pl-14 pr-4 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 ring-emerald-100 shadow-sm font-semibold text-navy">
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50 border-b border-slate-50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-10 py-6">Barangay</th>
                                    <th class="px-8 py-6">Medicine Name</th>
                                    <th class="px-8 py-6 text-center">In-Stock</th>
                                    <th class="px-8 py-6">Status</th>
                                </tr>
                            </thead>
                            <tbody id="stock-table-body" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE", authDomain: "gub-up.firebaseapp.com", projectId: "gub-up", storageBucket: "gub-up.firebasestorage.app", messagingSenderId: "75119179497", appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allStock = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    document.getElementById('user-name-display').innerText = docSnap.data().name;
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 800, once: true });
                    init();
                }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            // General stock view (Public) - listens to entire collection
            const q = query(collection(db, "medicine_inventory"));
            onSnapshot(q, (snap) => {
                allStock = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                                    .sort((a, b) => a.barangay.localeCompare(b.barangay));
                renderTable(allStock);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('stock-table-body');
            body.innerHTML = data.map((item, index) => {
                const isLow = item.count < 10;
                return `
                <tr class="hover:bg-slate-50 transition-all animate-row" style="animation-delay: ${index * 0.03}s">
                    <td class="px-10 py-7">
                        <span class="font-bold text-navy bg-slate-100 px-3 py-1 rounded-lg text-xs">Brgy. ${item.barangay}</span>
                    </td>
                    <td class="px-8 py-7">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center">
                                <i data-lucide="pill" class="w-4 h-4"></i>
                            </div>
                            <span class="font-bold text-navy">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-8 py-7 text-center">
                        <span class="font-black text-xl ${isLow ? 'text-red-500 pulse-red' : 'text-navy'}">
                            ${(item.count || 0).toLocaleString()}
                        </span>
                    </td>
                    <td class="px-8 py-7">
                        <span class="text-[10px] font-black uppercase tracking-widest ${isLow ? 'text-red-400' : 'text-emerald-500'}">
                            ${isLow ? 'Low Stock' : 'Stable'}
                        </span>
                    </td>
                </tr>`;
            }).join('');
            lucide.createIcons();
        }

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); s.classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allStock.filter(c => 
                c.name.toLowerCase().includes(t) || 
                c.barangay.toLowerCase().includes(t)
            ));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
