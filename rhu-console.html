<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHU Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .bg-brand-blue { background-color: #2563eb; }
        .text-brand-blue { color: #2563eb; }
        .text-navy { color: #1e3a8a; }
        .bg-rhu-red { background-color: #ef4444; }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        /* Mobile Sidebar Transitions */
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        /* Searchable Dropdown */
        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            max-height: 250px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 600; }
        .dropdown-item:hover { background-color: #fef2f2; color: #ef4444; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand-blue rounded-full flex items-center justify-center text-white shadow-lg">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-navy text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-brand-blue uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-3">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <div class="w-8 h-8 bg-slate-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 group-hover:text-white"></i>
                        </div>
                        <span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-emerald-50 transition-all group">
                        <div class="w-8 h-8 bg-emerald-100 group-hover:bg-emerald-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="package" class="w-4 h-4 text-emerald-600 group-hover:text-white"></i>
                        </div>
                        <span>Medicine Stocks</span>
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-amber-50 transition-all group">
                        <div class="w-8 h-8 bg-amber-100 group-hover:bg-amber-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="file-bar-chart" class="w-4 h-4 text-amber-600 group-hover:text-white"></i>
                        </div>
                        <span>Disease Reports</span>
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-4 rounded-2xl font-bold hover:bg-blue-50 transition-all group">
                        <div class="w-8 h-8 bg-blue-100 group-hover:bg-blue-500 rounded-lg flex items-center justify-center transition-colors">
                            <i data-lucide="phone" class="w-4 h-4 text-blue-600 group-hover:text-white"></i>
                        </div>
                        <span>Hotlines</span>
                    </a>

                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-2">Internal Consoles</p>
                        <a href="rhu-console.html" class="flex items-center gap-3 bg-rhu-red text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-red-100 transition-all">
                            <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="shield-alert" class="w-4 h-4 text-white"></i>
                            </div>
                            <span>RHU Console</span>
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                    <h2 class="text-[10px] md:text-sm font-bold text-slate-400 uppercase tracking-widest truncate">RHU Case Management</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-3 md:px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-red-50 text-rhu-red rounded-full flex items-center justify-center"><i data-lucide="shield-alert" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-xs md:text-sm">RHU Officer</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8" data-aos="fade-up">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Search disease or barangay..." class="w-full pl-14 pr-4 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 ring-red-100 shadow-sm font-semibold text-navy">
                    </div>
                    <button onclick="openAddModal()" class="bg-navy text-white w-full md:w-auto px-10 py-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-slate-800 shadow-xl transition-all">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add Case
                    </button>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-10 py-6">Disease Name</th>
                                    <th class="px-8 py-6">Barangay</th>
                                    <th class="px-8 py-6 text-center">Cases</th>
                                    <th class="px-8 py-6">Record Date</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="disease-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="case-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-navy/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden">
            <div class="p-8 pb-0">
                <h3 id="modal-title" class="text-2xl font-bold text-navy">Log Disease Case</h3>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">RHU Official Entry</p>
            </div>
            <form id="case-form" class="p-8 space-y-5">
                <input type="hidden" id="entry-id">
                <div class="relative">
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-2">Search Disease</label>
                    <input type="text" id="disease-input" autocomplete="off" placeholder="Start typing..." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-2 ring-red-100">
                    <div id="disease-dropdown" class="dropdown-list custom-scrollbar"></div>
                    <input type="hidden" id="case-name" required>
                </div>
                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-2">Barangay</label>
                    <select id="case-barangay" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none"></select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2">Count</label>
                        <input type="number" id="case-count" required min="1" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2">Date</label>
                        <input type="date" id="case-date" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy">
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 font-bold text-slate-400">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 bg-navy text-white font-bold rounded-2xl shadow-xl">Save Case</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DISEASE LIST (LOCKED)
        const diseaseList = [
            "Dengue fever", "Severe dengue (Dengue hemorrhagic fever)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox (Varicella)", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", "Human papillomavirus (HPV) infection", "Cytomegalovirus infection", "Epstein-Barr virus infection", "Viral gastroenteritis", "Viral meningitis", "Viral pneumonia",
            "Tuberculosis (Pulmonary TB)", "Extrapulmonary tuberculosis", "Multidrug-resistant TB", "Pneumonia (bacterial)", "Typhoid fever", "Paratyphoid fever", "Leptospirosis", "Cholera", "Shigellosis", "Diphtheria", "Pertussis (Whooping cough)", "Tetanus", "Neonatal tetanus", "Meningococcal meningitis", "Bacterial meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Chlamydia", "Bacterial skin infections", "Cellulitis", "Impetigo", "Rheumatic fever", "Rheumatic heart disease", "Scarlet fever", "Sepsis", "Anthrax", "Helicobacter pylori infection",
            "Malaria", "Schistosomiasis", "Ascariasis", "Trichuriasis", "Hookworm infection", "Filariasis", "Amebiasis", "Giardiasis", "Toxoplasmosis", "Strongyloidiasis", "Taeniasis (Tapeworm)", "Cysticercosis", "Cryptosporidiosis",
            "Candidiasis", "Tinea (Ringworm)", "Athlete’s foot", "Onychomycosis", "Aspergillosis", "Histoplasmosis", "Cryptococcosis",
            "Hypertension", "Coronary artery disease", "Myocardial infarction (Heart attack)", "Stroke", "Heart failure", "Arrhythmia", "Cardiomyopathy", "Peripheral artery disease",
            "Type 1 diabetes", "Type 2 diabetes", "Prediabetes", "Dyslipidemia", "Obesity", "Metabolic syndrome", "Hyperthyroidism", "Hypothyroidism", "Goiter", "Polycystic ovary syndrome (PCOS)",
            "Asthma", "Chronic obstructive pulmonary disease (COPD)", "Chronic bronchitis", "Emphysema", "Allergic rhinitis", "Sinusitis", "Pulmonary fibrosis",
            "Breast cancer", "Lung cancer", "Liver cancer", "Colorectal cancer", "Cervical cancer", "Prostate cancer", "Stomach cancer", "Nasopharyngeal cancer", "Ovarian cancer", "Pancreatic cancer", "Leukemia", "Lymphoma", "Thyroid cancer", "Skin cancer",
            "Depression", "Anxiety disorders", "Bipolar disorder", "Schizophrenia", "Epilepsy", "Migraine", "Alzheimer’s disease", "Parkinson’s disease", "Dementia", "Stroke-related neurological deficits",
            "Malnutrition", "Stunting", "Wasting", "Vitamin A deficiency", "Iron deficiency anemia", "Iodine deficiency disorder", "Rickets", "Kwashiorkor", "Marasmus",
            "Acute gastroenteritis", "Flood-related leptospirosis", "Skin fungal infections (post-flood)", "Conjunctivitis", "Diarrheal diseases",
            "Kidney stones", "Chronic kidney disease", "Urinary tract stones", "Gallstones", "Peptic ulcer disease", "Gastroesophageal reflux disease (GERD)", "Arthritis", "Osteoarthritis", "Rheumatoid arthritis", "Gout", "Osteoporosis", "Back pain", "Scoliosis", "Hernia", "Hemorrhoids", "Appendicitis", "Gallbladder disease", "Dental caries", "Periodontal disease",
            "Acne", "Eczema", "Psoriasis", "Scabies", "Contact dermatitis", "Heat rash (Prickly heat)", "Urticaria (Hives)", "Keloids",
            "Alcohol use disorder", "Liver cirrhosis", "Fatty liver disease", "Drug dependence", "Nicotine dependence", "Substance-induced psychosis",
            "Endometriosis", "Uterine fibroids", "Pelvic inflammatory disease", "Ectopic pregnancy", "Pre-eclampsia", "Gestational diabetes", "Infertility", "Sexually transmitted infections (STIs)"
        ];

        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];

        // Init UI
        document.getElementById('case-barangay').innerHTML = barangays.map(b => `<option value="${b}">${b}</option>`).join('');
        const dInput = document.getElementById('disease-input');
        const dDrop = document.getElementById('disease-dropdown');
        const hInput = document.getElementById('case-name');

        dInput.addEventListener('input', () => {
            const q = dInput.value.toLowerCase();
            const filtered = diseaseList.filter(d => d.toLowerCase().includes(q));
            dDrop.innerHTML = filtered.map(d => `<div class="dropdown-item" onclick="selectDisease('${d}')">${d}</div>`).join('');
            dDrop.classList.toggle('active', filtered.length > 0 && q !== "");
        });

        window.selectDisease = (n) => {
            dInput.value = n;
            hInput.value = n;
            dDrop.classList.remove('active');
        };

        let allCases = [];
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "rhu") {
                    document.getElementById('user-name-display').innerText = docSnap.data().name;
                    document.body.classList.add('auth-ready');
                    AOS.init();
                    init();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            onSnapshot(query(collection(db, "disease_cases"), orderBy("createdAt", "desc")), (snap) => {
                allCases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allCases);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('disease-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-10 py-6 font-bold text-navy">${item.name}</td>
                    <td class="px-8 py-6 text-slate-500 font-bold uppercase text-[10px]">${item.barangay}</td>
                    <td class="px-8 py-6 text-center font-black text-navy text-lg">${item.count}</td>
                    <td class="px-8 py-6 text-slate-400 text-xs">${item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString() : 'N/A'}</td>
                    <td class="px-10 py-6 text-right">
                        <div class="flex justify-end gap-3">
                            <button onclick="editEntry('${item.id}')" class="p-2 text-slate-300 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.openAddModal = () => {
            document.getElementById('case-form').reset();
            document.getElementById('entry-id').value = "";
            document.getElementById('case-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('case-modal').classList.add('hidden');

        window.editEntry = (id) => {
            const item = allCases.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            dInput.value = item.name;
            hInput.value = item.name;
            document.getElementById('case-barangay').value = item.barangay;
            document.getElementById('case-count').value = item.count;
            if(item.createdAt) document.getElementById('case-date').value = item.createdAt.toDate().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
        };

        window.deleteEntry = async (id) => { if(confirm("Delete record?")) await deleteDoc(doc(db, "disease_cases", id)); };

        document.getElementById('case-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                name: hInput.value || dInput.value,
                barangay: document.getElementById('case-barangay').value,
                count: parseInt(document.getElementById('case-count').value),
                createdAt: Timestamp.fromDate(new Date(document.getElementById('case-date').value))
            };
            id ? await updateDoc(doc(db, "disease_cases", id), data) : await addDoc(collection(db, "disease_cases"), data);
            closeModal();
        };

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed');
            s.classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allCases.filter(c => c.name.toLowerCase().includes(t) || c.barangay.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
        lucide.createIcons();
    </script>
</body>
</html>
