<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHU Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .bg-navy { background-color: #1e3a8a; }
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }
        
        /* Mobile Sidebar Logic */
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        /* Searchable Dropdown Styling */
        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            max-height: 250px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .dropdown-item:hover { background-color: #eff6ff; color: #2563eb; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen">

    <div id="main-layout" class="flex flex-col md:flex-row min-h-screen">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg"><i data-lucide="plus"></i></div>
                        <div>
                            <h1 class="font-bold text-slate-900 text-lg leading-none">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">Health Network</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 px-5 py-3.5 rounded-2xl font-bold hover:bg-slate-50 transition-all">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 px-5 py-3.5 rounded-2xl font-bold hover:bg-slate-50">
                        <i data-lucide="package" class="w-4 h-4"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 px-5 py-3.5 rounded-2xl font-bold hover:bg-slate-50">
                        <i data-lucide="file-bar-chart" class="w-4 h-4"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 px-5 py-3.5 rounded-2xl font-bold hover:bg-slate-50">
                        <i data-lucide="phone" class="w-4 h-4"></i> Hotlines
                    </a>
                    <div class="pt-6">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest px-5 mb-2">Internal</p>
                        <a href="rhu-console.html" class="flex items-center gap-3 bg-red-500 text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-red-100 transition-all">
                            <i data-lucide="shield-alert" class="w-4 h-4"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            <div class="mt-auto p-8 border-t border-slate-50">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-slate-900"><i data-lucide="menu"></i></button>
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">RHU Management</h2>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100">
                    <span id="user-name-display" class="font-bold text-slate-700 text-xs">RHU Officer</span>
                </div>
            </header>

            <div class="p-4 md:p-8 max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8" data-aos="fade-down">
                    <div class="relative w-full md:max-w-md">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Quick search cases..." class="w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 ring-red-100 font-semibold text-slate-700 transition-all">
                    </div>
                    <button onclick="openAddModal()" class="w-full md:w-auto bg-red-500 text-white px-8 py-3.5 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-red-600 shadow-lg shadow-red-200 transition-all">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add Case
                    </button>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/80">
                                <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <th class="px-8 py-5">Disease Name</th>
                                    <th class="px-6 py-5">Affected Barangay</th>
                                    <th class="px-6 py-5 text-center">Count</th>
                                    <th class="px-6 py-5">Record Date</th>
                                    <th class="px-8 py-5 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="disease-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="case-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col scale-95 transition-transform duration-300" id="modal-container">
            <div class="bg-red-500 p-6 md:p-8 text-white">
                <h3 id="modal-title" class="text-xl font-bold">Log Disease Case</h3>
                <p class="text-red-100 text-[10px] font-bold uppercase tracking-widest mt-1 opacity-80">Gubat RHU Official Data</p>
            </div>
            
            <form id="case-form" class="p-6 md:p-8 space-y-5 overflow-y-auto custom-scrollbar">
                <input type="hidden" id="entry-id">
                
                <div class="relative">
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-1">Search Disease</label>
                    <input type="text" id="disease-input" autocomplete="off" placeholder="Type disease name..." class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-4 ring-red-50 font-bold text-slate-700">
                    <div id="disease-dropdown" class="dropdown-list custom-scrollbar"></div>
                    <input type="hidden" id="case-name" required>
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-1">Select Barangay</label>
                    <select id="case-barangay" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none font-bold text-slate-700"></select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-1">No. of Cases</label>
                        <input type="number" id="case-count" required min="1" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-1">Effective Date</label>
                        <input type="date" id="case-date" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold">
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 hover:bg-slate-50 rounded-2xl transition-all">Cancel</button>
                    <button type="submit" class="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-bold hover:shadow-lg transition-all">Save Data</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // THE COMPLETE MEDICAL LIST
        const diseaseList = [
            "Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox (Varicella)", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", "Human papillomavirus (HPV) infection", "Cytomegalovirus infection", "Epstein-Barr virus infection", "Viral gastroenteritis", "Viral meningitis", "Viral pneumonia",
            "Tuberculosis (Pulmonary TB)", "Extrapulmonary tuberculosis", "Multidrug-resistant TB", "Pneumonia (bacterial)", "Typhoid fever", "Paratyphoid fever", "Leptospirosis", "Cholera", "Shigellosis", "Diphtheria", "Pertussis (Whooping cough)", "Tetanus", "Neonatal tetanus", "Meningococcal meningitis", "Bacterial meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Chlamydia", "Bacterial skin infections", "Cellulitis", "Impetigo", "Rheumatic fever", "Rheumatic heart disease", "Scarlet fever", "Sepsis", "Anthrax", "Helicobacter pylori infection",
            "Malaria", "Schistosomiasis", "Ascariasis", "Trichuriasis", "Hookworm infection", "Filariasis", "Amebiasis", "Giardiasis", "Toxoplasmosis", "Strongyloidiasis", "Taeniasis (Tapeworm)", "Cysticercosis", "Cryptosporidiosis",
            "Candidiasis", "Tinea (Ringworm)", "Athlete’s foot", "Onychomycosis", "Aspergillosis", "Histoplasmosis", "Cryptococcosis",
            "Hypertension", "Coronary artery disease", "Myocardial infarction (Heart attack)", "Stroke", "Heart failure", "Arrhythmia", "Cardiomyopathy", "Peripheral artery disease",
            "Type 1 diabetes", "Type 2 diabetes", "Prediabetes", "Dyslipidemia", "Obesity", "Metabolic syndrome", "Hyperthyroidism", "Hypothyroidism", "Goiter", "Polycystic ovary syndrome (PCOS)",
            "Asthma", "COPD", "Chronic bronchitis", "Emphysema", "Allergic rhinitis", "Sinusitis", "Pulmonary fibrosis",
            "Breast cancer", "Lung cancer", "Liver cancer", "Colorectal cancer", "Cervical cancer", "Prostate cancer", "Stomach cancer", "Nasopharyngeal cancer", "Ovarian cancer", "Pancreatic cancer", "Leukemia", "Lymphoma", "Thyroid cancer", "Skin cancer",
            "Depression", "Anxiety disorders", "Bipolar disorder", "Schizophrenia", "Epilepsy", "Migraine", "Alzheimer’s disease", "Parkinson’s disease", "Dementia", "Stroke-related neurological deficits",
            "Malnutrition", "Stunting", "Wasting", "Vitamin A deficiency", "Iron deficiency anemia", "Iodine deficiency disorder", "Rickets", "Kwashiorkor", "Marasmus",
            "Acute gastroenteritis", "Flood-related leptospirosis", "Skin fungal infections (post-flood)", "Conjunctivitis", "Diarrheal diseases",
            "Kidney stones", "Chronic kidney disease", "Urinary tract stones", "Gallstones", "Peptic ulcer disease", "Gastroesophageal reflux disease (GERD)", "Arthritis", "Osteoarthritis", "Rheumatoid arthritis", "Gout", "Osteoporosis", "Back pain", "Scoliosis", "Hernia", "Hemorrhoids", "Appendicitis", "Gallbladder disease", "Dental caries", "Periodontal disease",
            "Acne", "Eczema", "Psoriasis", "Scabies", "Contact dermatitis", "Heat rash (Prickly heat)", "Urticaria (Hives)", "Keloids",
            "Alcohol use disorder", "Liver cirrhosis", "Fatty liver disease", "Drug dependence", "Nicotine dependence", "Substance-induced psychosis",
            "Endometriosis", "Uterine fibroids", "Pelvic inflammatory disease", "Ectopic pregnancy", "Pre-eclampsia", "Gestational diabetes", "Infertility", "STIs"
        ];

        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];

        // UI Setup
        document.getElementById('case-barangay').innerHTML = barangays.map(b => `<option value="${b}">${b}</option>`).join('');

        // Modal Search logic
        const diseaseInput = document.getElementById('disease-input');
        const dropdown = document.getElementById('disease-dropdown');
        const hiddenInput = document.getElementById('case-name');

        diseaseInput.addEventListener('input', () => {
            const query = diseaseInput.value.toLowerCase();
            const filtered = diseaseList.filter(d => d.toLowerCase().includes(query));
            
            dropdown.innerHTML = filtered.map(d => `<div class="dropdown-item" onclick="selectDisease('${d}')">${d}</div>`).join('');
            dropdown.classList.add('active');
        });

        window.selectDisease = (name) => {
            diseaseInput.value = name;
            hiddenInput.value = name;
            dropdown.classList.remove('active');
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) dropdown.classList.remove('active');
        });

        // App logic
        let allCases = [];
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "rhu") {
                    document.getElementById('user-name-display').innerText = docSnap.data().name;
                    document.body.classList.add('auth-ready');
                    AOS.init();
                    init();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            onSnapshot(query(collection(db, "disease_cases"), orderBy("createdAt", "desc")), (snap) => {
                allCases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allCases);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('disease-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-all">
                    <td class="px-8 py-5 font-bold text-slate-800">${item.name}</td>
                    <td class="px-6 py-5 text-slate-500 font-bold uppercase text-[10px]">${item.barangay}</td>
                    <td class="px-6 py-5 text-center font-black text-slate-900">${item.count}</td>
                    <td class="px-6 py-5 text-slate-400 text-xs">${item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString() : 'N/A'}</td>
                    <td class="px-8 py-5 text-right">
                        <div class="flex justify-end gap-3">
                            <button onclick="editEntry('${item.id}')" class="p-2 text-slate-400 hover:text-blue-600"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-2 text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.openAddModal = () => {
            document.getElementById('case-form').reset();
            document.getElementById('entry-id').value = "";
            document.getElementById('case-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-container').classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            document.getElementById('modal-container').classList.add('scale-95');
            setTimeout(() => document.getElementById('case-modal').classList.add('hidden'), 200);
        };

        window.editEntry = (id) => {
            const item = allCases.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            diseaseInput.value = item.name;
            hiddenInput.value = item.name;
            document.getElementById('case-barangay').value = item.barangay;
            document.getElementById('case-count').value = item.count;
            if(item.createdAt) document.getElementById('case-date').value = item.createdAt.toDate().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
        };

        window.deleteEntry = async (id) => { if(confirm("Permanently delete this record?")) await deleteDoc(doc(db, "disease_cases", id)); };

        document.getElementById('case-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                name: hiddenInput.value || diseaseInput.value,
                barangay: document.getElementById('case-barangay').value,
                count: parseInt(document.getElementById('case-count').value),
                createdAt: Timestamp.fromDate(new Date(document.getElementById('case-date').value))
            };
            if(id) await updateDoc(doc(db, "disease_cases", id), data);
            else await addDoc(collection(db, "disease_cases"), data);
            closeModal();
        };

        // UI Interactions
        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('sidebar-closed');
            document.getElementById('sidebar').classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allCases.filter(c => c.name.toLowerCase().includes(t) || c.barangay.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
