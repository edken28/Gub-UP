<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHU Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-navy { color: #0f172a; }
        .bg-rhu-red { background-color: #ef4444; }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        /* Sidebar Mobile Logic */
        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        .dropdown-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.25rem;
            max-height: 250px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 600; }
        .dropdown-item:hover { background-color: #fef2f2; color: #ef4444; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .table-card { border-radius: 2.5rem; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-navy text-xl leading-none tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-blue-600 uppercase font-black tracking-widest mt-1">GUBAT HEALTH NETWORK</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400 hover:text-red-500 transition-colors" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-600 hover:text-blue-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-blue-50 transition-all">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-600 hover:text-emerald-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-emerald-50 transition-all">
                        <i data-lucide="pill" class="text-emerald-500"></i> Medicine Stocks
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-600 hover:text-amber-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-amber-50 transition-all">
                        <i data-lucide="file-bar-chart-2" class="text-amber-500"></i> Disease Reports
                    </a>
                    <a href="hotlines.html" class="flex items-center gap-3 text-slate-600 hover:text-sky-600 px-5 py-3.5 rounded-2xl font-semibold hover:bg-sky-50 transition-all">
                        <i data-lucide="phone-call" class="text-sky-500"></i> Hotlines
                    </a>
                    
                    <div id="internal-section" class="pt-6 border-t mt-4 hidden">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-5">Internal Management</p>
                        <a href="bhw-console.html" id="bhw-link" class="hidden flex items-center gap-3 text-emerald-600 px-5 py-3.5 font-semibold hover:bg-emerald-50 rounded-2xl transition-all">
                            <i data-lucide="users" class="w-5 h-5"></i> BHW Console
                        </a>
                        <a href="rhu-console.html" id="rhu-link" class="hidden flex items-center gap-3 bg-red-600 text-white px-5 py-3.5 font-semibold rounded-2xl shadow-xl shadow-red-100 transition-all">
                            <i data-lucide="shield-check" class="w-5 h-5"></i> RHU Console
                        </a>
                    </div>
                </nav>
            </div>
            
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold w-full transition-colors">
                    <i data-lucide="log-out"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="glass-header border-b border-slate-100 px-4 md:px-8 py-5 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="flex md:hidden p-3 bg-white border border-slate-100 rounded-xl text-navy shadow-sm active:scale-95 transition-transform">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                    <div>
                        <h2 class="text-sm font-extrabold text-navy uppercase tracking-tight">RHU Case Management</h2>
                        <p class="text-[10px] font-bold text-slate-400">Official Health Records</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 border border-slate-100 px-4 py-2 rounded-2xl">
                    <div class="w-8 h-8 bg-red-50 text-red-500 rounded-full flex items-center justify-center shadow-inner"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                    <span id="user-name-display" class="font-bold text-navy text-sm hidden sm:inline">RHU Officer</span>
                </div>
            </header>

            <div class="p-4 md:p-10 max-w-7xl mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-center gap-6 mb-10" data-aos="fade-down">
                    <div class="relative flex-1 w-full group">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5 group-focus-within:text-red-400 transition-colors"></i>
                        <input type="text" id="main-search" placeholder="Quick search cases or barangays..." class="w-full pl-14 pr-4 py-5 bg-white border border-slate-100 rounded-3xl outline-none focus:ring-4 ring-red-50 shadow-sm font-semibold text-navy transition-all">
                    </div>
                    <button onclick="openAddModal()" class="w-full lg:w-auto bg-rhu-red text-white px-10 py-5 rounded-3xl font-bold text-sm flex items-center justify-center gap-3 hover:bg-red-600 shadow-xl shadow-red-100 transition-all hover:-translate-y-1">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> Add Case Record
                    </button>
                </div>

                <div class="bg-white table-card border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up" data-aos-delay="100">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead class="bg-slate-50/50">
                                <tr class="text-[11px] font-black text-slate-400 uppercase tracking-[0.15em]">
                                    <th class="px-10 py-7">Disease Identity</th>
                                    <th class="px-8 py-7">Barangay</th>
                                    <th class="px-8 py-7 text-center">Cases</th>
                                    <th class="px-8 py-7">Date Recorded</th>
                                    <th class="px-10 py-7 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="disease-table-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="case-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col scale-95 transition-all duration-300" id="modal-container">
            <div class="absolute top-0 left-0 w-full h-2 bg-rhu-red"></div>
            <div class="p-8 pb-0">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 id="modal-title" class="text-2xl font-extrabold text-navy tracking-tight">Case Entry</h3>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">RHU Official Log</p>
                    </div>
                    <button onclick="closeModal()" class="p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-navy transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <form id="case-form" class="p-8 space-y-6 overflow-y-auto custom-scrollbar">
                <input type="hidden" id="entry-id">
                <div class="relative">
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Search Disease</label>
                    <div class="relative">
                        <i data-lucide="activity" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-4 h-4"></i>
                        <input type="text" id="disease-input" autocomplete="off" placeholder="Start typing disease name..." class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-4 ring-red-50 transition-all">
                    </div>
                    <div id="disease-dropdown" class="dropdown-list custom-scrollbar"></div>
                    <input type="hidden" id="case-name" required>
                </div>

                <div>
                    <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Affected Barangay</label>
                    <div class="relative">
                        <i data-lucide="map-pin" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-4 h-4"></i>
                        <select id="case-barangay" required class="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none appearance-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Case Count</label>
                        <input type="number" id="case-count" required min="1" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-4 ring-red-50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-3 px-1">Effective Date</label>
                        <input type="date" id="case-date" required class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold text-navy outline-none focus:ring-4 ring-red-50">
                    </div>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 font-bold text-slate-400 hover:text-navy transition-all">Cancel</button>
                    <button type="submit" class="flex-[2] py-4 bg-rhu-red text-white font-bold rounded-2xl shadow-xl shadow-red-100">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DATA HELPERS
        const diseaseList = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox (Varicella)", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", "Human papillomavirus (HPV) infection", "Cytomegalovirus infection", "Epstein-Barr virus infection", "Viral gastroenteritis", "Viral meningitis", "Viral pneumonia", "Tuberculosis (Pulmonary TB)", "Extrapulmonary tuberculosis", "Multidrug-resistant TB", "Pneumonia (bacterial)", "Typhoid fever", "Paratyphoid fever", "Leptospirosis", "Cholera", "Shigellosis", "Diphtheria", "Pertussis (Whooping cough)", "Tetanus", "Neonatal tetanus", "Meningococcal meningitis", "Bacterial meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Chlamydia", "Bacterial skin infections", "Cellulitis", "Impetigo", "Rheumatic fever", "Rheumatic heart disease", "Scarlet fever", "Sepsis", "Anthrax", "Helicobacter pylori infection", "Malaria", "Schistosomiasis", "Ascariasis", "Trichuriasis", "Hookworm infection", "Filariasis", "Amebiasis", "Giardiasis", "Toxoplasmosis", "Strongyloidiasis", "Taeniasis (Tapeworm)", "Cysticercosis", "Cryptosporidiosis", "Candidiasis", "Tinea (Ringworm)", "Athlete’s foot", "Onychomycosis", "Aspergillosis", "Histoplasmosis", "Cryptococcosis", "Hypertension", "Coronary artery disease", "Myocardial infarction (Heart attack)", "Stroke", "Heart failure", "Arrhythmia", "Cardiomyopathy", "Peripheral artery disease", "Type 1 diabetes", "Type 2 diabetes", "Prediabetes", "Dyslipidemia", "Obesity", "Metabolic syndrome", "Hyperthyroidism", "Hypothyroidism", "Goiter", "Polycystic ovary syndrome (PCOS)", "Asthma", "COPD", "Chronic bronchitis", "Emphysema", "Allergic rhinitis", "Sinusitis", "Pulmonary fibrosis", "Breast cancer", "Lung cancer", "Liver cancer", "Colorectal cancer", "Cervical cancer", "Prostate cancer", "Stomach cancer", "Nasopharyngeal cancer", "Ovarian cancer", "Pancreatic cancer", "Leukemia", "Lymphoma", "Thyroid cancer", "Skin cancer", "Depression", "Anxiety disorders", "Bipolar disorder", "Schizophrenia", "Epilepsy", "Migraine", "Alzheimer’s disease", "Parkinson’s disease", "Dementia", "Stroke-related neurological deficits", "Malnutrition", "Stunting", "Wasting", "Vitamin A deficiency", "Iron deficiency anemia", "Iodine deficiency disorder", "Rickets", "Kwashiorkor", "Marasmus", "Acute gastroenteritis", "Flood-related leptospirosis", "Skin fungal infections (post-flood)", "Conjunctivitis", "Diarrheal diseases", "Kidney stones", "Chronic kidney disease", "Urinary tract stones", "Gallstones", "Peptic ulcer disease", "Gastroesophageal reflux disease (GERD)", "Arthritis", "Osteoarthritis", "Rheumatoid arthritis", "Gout", "Osteoporosis", "Back pain", "Scoliosis", "Hernia", "Hemorrhoids", "Appendicitis", "Gallbladder disease", "Dental caries", "Periodontal disease", "Acne", "Eczema", "Psoriasis", "Scabies", "Contact dermatitis", "Heat rash (Prickly heat)", "Urticaria (Hives)", "Keloids", "Alcohol use disorder", "Liver cirrhosis", "Fatty liver disease", "Drug dependence", "Nicotine dependence", "Substance-induced psychosis", "Endometriosis", "Uterine fibroids", "Pelvic inflammatory disease", "Ectopic pregnancy", "Pre-eclampsia", "Gestational diabetes", "Infertility", "STIs"];
        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];

        document.getElementById('case-barangay').innerHTML = barangays.map(b => `<option value="${b}">${b}</option>`).join('');
        const dInput = document.getElementById('disease-input');
        const dDrop = document.getElementById('disease-dropdown');
        const hInput = document.getElementById('case-name');

        // SEARCH DROPDOWN LOGIC
        dInput.addEventListener('input', () => {
            const q = dInput.value.toLowerCase();
            const filtered = diseaseList.filter(d => d.toLowerCase().includes(q));
            dDrop.innerHTML = filtered.map(d => `<div class="dropdown-item" onclick="selectDisease('${d}')">${d}</div>`).join('');
            dDrop.classList.toggle('active', filtered.length > 0 && q.length > 0);
        });

        window.selectDisease = (n) => {
            dInput.value = n; hInput.value = n;
            dDrop.classList.remove('active');
        };

        // AUTH & ACCESS CONTROL
        let allCases = [];
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    const role = userData.role;

                    // Show sections based on role
                    if (role === "bhw" || role === "rhu") {
                        document.getElementById('internal-section').classList.remove('hidden');
                        if (role === "bhw") document.getElementById('bhw-link').classList.remove('hidden');
                        if (role === "rhu") document.getElementById('rhu-link').classList.remove('hidden');
                    }

                    // Strict protection: Only RHU can stay on this page
                    if (role === "rhu") {
                        document.getElementById('user-name-display').innerText = userData.name;
                        document.body.classList.add('auth-ready');
                        AOS.init({ duration: 800, once: true });
                        init();
                    } else { 
                        window.location.href = "dashboard.html"; 
                    }
                }
            } else { 
                window.location.href = "login.html"; 
            }
        });

        // FIRESTORE OPERATIONS
        function init() {
            onSnapshot(query(collection(db, "disease_cases"), orderBy("createdAt", "desc")), (snap) => {
                allCases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allCases);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('disease-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50/50 transition-all">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-red-50 text-rhu-red rounded-xl flex items-center justify-center shadow-sm"><i data-lucide="activity" class="w-5 h-5"></i></div>
                            <span class="font-extrabold text-navy text-lg">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-8 py-7">
                        <span class="text-slate-500 font-bold uppercase text-[11px] tracking-wider">${item.barangay}</span>
                    </td>
                    <td class="px-8 py-7 text-center">
                        <span class="bg-navy text-white px-4 py-1.5 rounded-full font-black text-sm">${item.count.toLocaleString()}</span>
                    </td>
                    <td class="px-8 py-7">
                        <div class="text-slate-500 font-bold text-xs">${item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString() : 'N/A'}</div>
                    </td>
                    <td class="px-10 py-7 text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="editEntry('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-blue-600 hover:text-white transition-all shadow-sm"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-3 bg-white border border-slate-100 text-slate-400 rounded-xl hover:bg-red-600 hover:text-white transition-all shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        // MODAL FUNCTIONS
        window.openAddModal = () => {
            document.getElementById('case-form').reset();
            document.getElementById('entry-id').value = "";
            document.getElementById('case-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-container').classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            document.getElementById('modal-container').classList.add('scale-95');
            setTimeout(() => document.getElementById('case-modal').classList.add('hidden'), 200);
        };

        window.editEntry = (id) => {
            const item = allCases.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            dInput.value = item.name; hInput.value = item.name;
            document.getElementById('case-barangay').value = item.barangay;
            document.getElementById('case-count').value = item.count;
            if(item.createdAt) document.getElementById('case-date').value = item.createdAt.toDate().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-container').classList.remove('scale-95'), 10);
        };

        window.deleteEntry = async (id) => { if(confirm("Delete record?")) await deleteDoc(doc(db, "disease_cases", id)); };

        document.getElementById('case-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                name: hInput.value || dInput.value,
                barangay: document.getElementById('case-barangay').value,
                count: parseInt(document.getElementById('case-count').value),
                createdAt: Timestamp.fromDate(new Date(document.getElementById('case-date').value))
            };
            id ? await updateDoc(doc(db, "disease_cases", id), data) : await addDoc(collection(db, "disease_cases"), data);
            closeModal();
        };

        // UI HELPERS
        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); 
            s.classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allCases.filter(c => c.name.toLowerCase().includes(t) || c.barangay.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
