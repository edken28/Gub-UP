<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHU Console | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .text-navy { color: #0f172a; }
        .bg-rhu-red { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        
        #main-layout { display: none; }
        .auth-ready #main-layout { display: flex; }

        @media (max-width: 768px) {
            .sidebar-closed { transform: translateX(-100%); }
            .sidebar-open { transform: translateX(0); }
        }

        .dropdown-list {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            max-height: 280px;
            overflow-y: auto;
            z-index: 200;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .dropdown-list.active { display: block; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .dropdown-item { padding: 14px 20px; cursor: pointer; border-bottom: 1px solid #f8fafc; font-size: 14px; font-weight: 600; color: #64748b; transition: all 0.2s; }
        .dropdown-item:hover { background-color: #fef2f2; color: #ef4444; padding-left: 25px; }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div id="main-layout" class="w-full min-h-screen flex flex-col md:flex-row">
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-slate-100 flex flex-col transition-transform duration-300 sidebar-closed md:relative md:translate-x-0 md:flex">
            <div class="p-8">
                <div class="flex items-center justify-between mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-red-200 rotate-3">
                            <i data-lucide="shield-check" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-navy text-xl tracking-tight">GUB-UP</h1>
                            <p class="text-[10px] text-red-500 uppercase font-black tracking-[0.2em] leading-none mt-1">RHU Console</p>
                        </div>
                    </div>
                    <button class="md:hidden p-2 text-slate-400" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
                </div>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <i data-lucide="layout-grid" class="w-5 h-5 group-hover:text-blue-600"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="stock.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <i data-lucide="package" class="w-5 h-5 group-hover:text-emerald-500"></i>
                        <span>Medicine Stocks</span>
                    </a>
                    <a href="reports.html" class="flex items-center gap-3 text-slate-500 px-5 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-all group">
                        <i data-lucide="file-text" class="w-5 h-5 group-hover:text-amber-500"></i>
                        <span>Disease Reports</span>
                    </a>

                    <div class="pt-6 pb-2">
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] px-5 mb-3">Management</p>
                        <a href="rhu-console.html" class="flex items-center gap-3 bg-rhu-red text-white px-5 py-4 rounded-2xl font-bold shadow-xl shadow-red-200 transition-all">
                            <i data-lucide="database" class="w-5 h-5"></i>
                            <span>Case Registry</span>
                        </a>
                    </div>
                </nav>
            </div>
            
            <div class="mt-auto p-8">
                <button id="logout-btn" class="flex items-center gap-3 text-slate-400 hover:text-red-500 font-bold transition-colors w-full px-5">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 w-full overflow-y-auto">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 md:px-10 py-6 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-slate-100 rounded-xl text-navy"><i data-lucide="menu"></i></button>
                    <div>
                        <h2 class="text-xl font-extrabold text-navy tracking-tight">Epidemiology Center</h2>
                        <p class="text-xs text-slate-400 font-medium">Monitoring health trends across Gubat</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-white border border-slate-100 px-4 py-2.5 rounded-2xl shadow-sm">
                    <div class="w-8 h-8 bg-red-100 text-red-600 rounded-full flex items-center justify-center font-bold text-xs" id="user-initials">RH</div>
                    <span id="user-name-display" class="font-bold text-navy text-sm">RHU Officer</span>
                </div>
            </header>

            <div class="p-6 md:p-10 max-w-7xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-10" data-aos="fade-down">
                    <div class="relative flex-1 w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="main-search" placeholder="Search diseases, symptoms or barangays..." class="w-full pl-14 pr-6 py-4 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-4 ring-red-50 focus:border-red-200 shadow-sm font-semibold text-navy transition-all">
                    </div>
                    <button onclick="openAddModal()" class="w-full md:w-auto bg-rhu-red text-white px-8 py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-[0.98] shadow-xl shadow-red-200 transition-all">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add Record
                    </button>
                </div>

                <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden" data-aos="fade-up">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-50/50 text-[11px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                    <th class="px-10 py-6">Disease Entity</th>
                                    <th class="px-8 py-6">Barangay</th>
                                    <th class="px-8 py-6 text-center">Case Count</th>
                                    <th class="px-8 py-6">Date Logged</th>
                                    <th class="px-10 py-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="disease-table-body" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="case-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col scale-95 transition-all duration-300" id="modal-container">
            <div class="p-10">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h3 id="modal-title" class="text-2xl font-extrabold text-navy tracking-tight">Case Entry</h3>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Official RHU Record</p>
                    </div>
                    <div class="w-12 h-12 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center"><i data-lucide="activity"></i></div>
                </div>
                
                <form id="case-form" class="space-y-6">
                    <input type="hidden" id="entry-id">
                    
                    <div class="relative">
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Medical Condition</label>
                        <input type="text" id="disease-input" autocomplete="off" placeholder="Type to search..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-navy outline-none focus:bg-white focus:ring-4 ring-red-50 transition-all">
                        <div id="disease-dropdown" class="dropdown-list custom-scrollbar"></div>
                        <input type="hidden" id="case-name" required>
                    </div>

                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Affected Locality</label>
                        <select id="case-barangay" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-navy outline-none appearance-none"></select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Case Count</label>
                            <input type="number" id="case-count" required min="1" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-navy outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-black text-slate-400 uppercase mb-2 ml-1">Recording Date</label>
                            <input type="date" id="case-date" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-navy outline-none">
                        </div>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button type="button" onclick="closeModal()" class="flex-1 font-bold text-slate-400 hover:text-navy transition-all py-4">Cancel</button>
                        <button type="submit" class="flex-[2] py-4 bg-rhu-red text-white font-bold rounded-2xl shadow-xl shadow-red-200 hover:scale-[1.02] active:scale-[0.98] transition-all">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, getDoc, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
            authDomain: "gub-up.firebaseapp.com",
            projectId: "gub-up",
            storageBucket: "gub-up.firebasestorage.app",
            messagingSenderId: "75119179497",
            appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const diseaseList = ["Dengue fever", "Severe dengue (DHF)", "COVID-19", "Influenza", "Avian influenza", "Measles", "Mumps", "Rubella", "Chickenpox (Varicella)", "Hand, foot and mouth disease", "Hepatitis A", "Hepatitis B", "Hepatitis C", "Hepatitis E", "Rabies", "HIV infection", "AIDS", "Chikungunya", "Japanese encephalitis", "Zika virus infection", "Rotavirus infection", "Norovirus infection", "Poliomyelitis", "Human papillomavirus (HPV) infection", "Cytomegalovirus infection", "Epstein-Barr virus infection", "Viral gastroenteritis", "Viral meningitis", "Viral pneumonia", "Tuberculosis (Pulmonary TB)", "Extrapulmonary tuberculosis", "Multidrug-resistant TB", "Pneumonia (bacterial)", "Typhoid fever", "Paratyphoid fever", "Leptospirosis", "Cholera", "Shigellosis", "Diphtheria", "Pertussis (Whooping cough)", "Tetanus", "Neonatal tetanus", "Meningococcal meningitis", "Bacterial meningitis", "Urinary tract infection", "Gonorrhea", "Syphilis", "Chlamydia", "Bacterial skin infections", "Cellulitis", "Impetigo", "Rheumatic fever", "Rheumatic heart disease", "Scarlet fever", "Sepsis", "Anthrax", "Helicobacter pylori infection", "Malaria", "Schistosomiasis", "Ascariasis", "Trichuriasis", "Hookworm infection", "Filariasis", "Amebiasis", "Giardiasis", "Toxoplasmosis", "Strongyloidiasis", "Taeniasis (Tapeworm)", "Cysticercosis", "Cryptosporidiosis", "Candidiasis", "Tinea (Ringworm)", "Athlete’s foot", "Onychomycosis", "Aspergillosis", "Histoplasmosis", "Cryptococcosis", "Hypertension", "Coronary artery disease", "Myocardial infarction (Heart attack)", "Stroke", "Heart failure", "Arrhythmia", "Cardiomyopathy", "Peripheral artery disease", "Type 1 diabetes", "Type 2 diabetes", "Prediabetes", "Dyslipidemia", "Obesity", "Metabolic syndrome", "Hyperthyroidism", "Hypothyroidism", "Goiter", "Polycystic ovary syndrome (PCOS)", "Asthma", "COPD", "Chronic bronchitis", "Emphysema", "Allergic rhinitis", "Sinusitis", "Pulmonary fibrosis", "Breast cancer", "Lung cancer", "Liver cancer", "Colorectal cancer", "Cervical cancer", "Prostate cancer", "Stomach cancer", "Nasopharyngeal cancer", "Ovarian cancer", "Pancreatic cancer", "Leukemia", "Lymphoma", "Thyroid cancer", "Skin cancer", "Depression", "Anxiety disorders", "Bipolar disorder", "Schizophrenia", "Epilepsy", "Migraine", "Alzheimer’s disease", "Parkinson’s disease", "Dementia", "Stroke-related neurological deficits", "Malnutrition", "Stunting", "Wasting", "Vitamin A deficiency", "Iron deficiency anemia", "Iodine deficiency disorder", "Rickets", "Kwashiorkor", "Marasmus", "Acute gastroenteritis", "Flood-related leptospirosis", "Skin fungal infections (post-flood)", "Conjunctivitis", "Diarrheal diseases", "Kidney stones", "Chronic kidney disease", "Urinary tract stones", "Gallstones", "Peptic ulcer disease", "Gastroesophageal reflux disease (GERD)", "Arthritis", "Osteoarthritis", "Rheumatoid arthritis", "Gout", "Osteoporosis", "Back pain", "Scoliosis", "Hernia", "Hemorrhoids", "Appendicitis", "Gallbladder disease", "Dental caries", "Periodontal disease", "Acne", "Eczema", "Psoriasis", "Scabies", "Contact dermatitis", "Heat rash (Prickly heat)", "Urticaria (Hives)", "Keloids", "Alcohol use disorder", "Liver cirrhosis", "Fatty liver disease", "Drug dependence", "Nicotine dependence", "Substance-induced psychosis", "Endometriosis", "Uterine fibroids", "Pelvic inflammatory disease", "Ectopic pregnancy", "Pre-eclampsia", "Gestational diabetes", "Infertility", "STIs"];
        const barangays = ["Ariman", "Bagacay", "Balud Del Norte", "Balud Del Sur", "Benguet", "Bentuco", "Beriran", "Buenavista", "Bulacao", "Cabigaan", "Cabiguhan", "Carriedo", "Casili", "Cogon", "Cota Na Daco", "Dita", "Jupi", "Lapinig", "Luna-Candol", "Manapao", "Manook", "Naagtan", "Nato", "Nazareno", "Ogao", "Paco", "Panganiban", "Paradijon", "Patag", "Payawin", "Pinontingan", "Rizal", "San Ignacio", "Sangat", "Santa Ana", "Tabi", "Tagaytay", "Tigkiw", "Tiris", "Togawe", "Union", "Villareal"];

        // UI Setup
        document.getElementById('case-barangay').innerHTML = `<option value="" disabled selected>Select Barangay</option>` + barangays.map(b => `<option value="${b}">${b}</option>`).join('');
        const dInput = document.getElementById('disease-input');
        const dDrop = document.getElementById('disease-dropdown');
        const hInput = document.getElementById('case-name');

        dInput.addEventListener('input', () => {
            const q = dInput.value.toLowerCase();
            const filtered = diseaseList.filter(d => d.toLowerCase().includes(q));
            dDrop.innerHTML = filtered.map(d => `<div class="dropdown-item" onclick="selectDisease('${d}')">${d}</div>`).join('');
            dDrop.classList.toggle('active', filtered.length > 0 && q.length > 0);
        });

        window.selectDisease = (n) => {
            dInput.value = n;
            hInput.value = n;
            dDrop.classList.remove('active');
        };

        let allCases = [];
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists() && docSnap.data().role === "rhu") {
                    const userData = docSnap.data();
                    document.getElementById('user-name-display').innerText = userData.name;
                    document.getElementById('user-initials').innerText = userData.name.substring(0,2).toUpperCase();
                    document.body.classList.add('auth-ready');
                    AOS.init({ duration: 800, once: true });
                    init();
                } else { window.location.href = "dashboard.html"; }
            } else { window.location.href = "login.html"; }
        });

        function init() {
            onSnapshot(query(collection(db, "disease_cases"), orderBy("createdAt", "desc")), (snap) => {
                allCases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTable(allCases);
            });
        }

        function renderTable(data) {
            const body = document.getElementById('disease-table-body');
            body.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50/50 transition-all group">
                    <td class="px-10 py-7">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-slate-100 text-slate-400 group-hover:bg-red-50 group-hover:text-red-500 rounded-xl flex items-center justify-center transition-all"><i data-lucide="activity" class="w-5 h-5"></i></div>
                            <span class="font-bold text-navy text-base">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-8 py-7">
                        <span class="px-3 py-1 bg-slate-100 text-slate-500 rounded-lg text-[10px] font-black uppercase tracking-wider">${item.barangay}</span>
                    </td>
                    <td class="px-8 py-7 text-center">
                        <span class="font-black text-navy text-lg">${item.count.toLocaleString()}</span>
                    </td>
                    <td class="px-8 py-7">
                        <span class="text-slate-400 text-xs font-semibold">${item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A'}</span>
                    </td>
                    <td class="px-10 py-7 text-right">
                        <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editEntry('${item.id}')" class="p-2.5 bg-white border border-slate-200 text-slate-400 rounded-xl hover:text-blue-600 hover:border-blue-100 transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-2.5 bg-white border border-slate-200 text-slate-400 rounded-xl hover:text-red-600 hover:border-red-100 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                </tr>`).join('');
            lucide.createIcons();
        }

        window.openAddModal = () => {
            document.getElementById('case-form').reset();
            document.getElementById('entry-id').value = "";
            document.getElementById('case-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-container').classList.remove('scale-95'), 10);
        };

        window.closeModal = () => {
            document.getElementById('modal-container').classList.add('scale-95');
            setTimeout(() => document.getElementById('case-modal').classList.add('hidden'), 200);
        };

        window.editEntry = (id) => {
            const item = allCases.find(c => c.id === id);
            document.getElementById('entry-id').value = id;
            dInput.value = item.name;
            hInput.value = item.name;
            document.getElementById('case-barangay').value = item.barangay;
            document.getElementById('case-count').value = item.count;
            if(item.createdAt) document.getElementById('case-date').value = item.createdAt.toDate().toISOString().split('T')[0];
            document.getElementById('case-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-container').classList.remove('scale-95'), 10);
        };

        window.deleteEntry = async (id) => { if(confirm("Are you sure you want to delete this case record?")) await deleteDoc(doc(db, "disease_cases", id)); };

        document.getElementById('case-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('entry-id').value;
            const data = {
                name: hInput.value || dInput.value,
                barangay: document.getElementById('case-barangay').value,
                count: parseInt(document.getElementById('case-count').value),
                createdAt: Timestamp.fromDate(new Date(document.getElementById('case-date').value))
            };
            id ? await updateDoc(doc(db, "disease_cases", id), data) : await addDoc(collection(db, "disease_cases"), data);
            closeModal();
        };

        window.toggleSidebar = () => {
            const s = document.getElementById('sidebar');
            s.classList.toggle('sidebar-closed'); s.classList.toggle('sidebar-open');
        };

        document.getElementById('main-search').oninput = (e) => {
            const t = e.target.value.toLowerCase();
            renderTable(allCases.filter(c => c.name.toLowerCase().includes(t) || c.barangay.toLowerCase().includes(t)));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
    </script>
</body>
</html>
