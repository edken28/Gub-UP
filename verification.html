<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | GUB-UP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .otp-input:focus { border-color: #2563eb; ring: 4px; ring-color: rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-8 text-center border border-slate-100">
        <div class="mb-8">
            <div class="bg-blue-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="mail-open" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Check your inbox</h2>
            <p class="text-slate-500 text-sm mt-2">We sent a 4-digit code to your email. Enter it below to verify your account.</p>
        </div>

        <form id="otpForm" class="space-y-6">
            <div class="flex justify-center gap-3" id="otpContainer">
                <input type="text" maxlength="1" class="otp-field w-14 h-16 text-center text-2xl font-bold border-2 border-slate-100 rounded-xl outline-none focus:border-blue-600 transition-all">
                <input type="text" maxlength="1" class="otp-field w-14 h-16 text-center text-2xl font-bold border-2 border-slate-100 rounded-xl outline-none focus:border-blue-600 transition-all">
                <input type="text" maxlength="1" class="otp-field w-14 h-16 text-center text-2xl font-bold border-2 border-slate-100 rounded-xl outline-none focus:border-blue-600 transition-all">
                <input type="text" maxlength="1" class="otp-field w-14 h-16 text-center text-2xl font-bold border-2 border-slate-100 rounded-xl outline-none focus:border-blue-600 transition-all">
            </div>

            <button type="submit" id="verifyBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg active:scale-95">
                Verify Account
            </button>
        </form>
        
        <p class="mt-6 text-sm text-slate-400">
            Didn't get the code? <a href="register.html" class="text-blue-600 font-semibold hover:underline">Try registering again</a>
        </p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB2OEoFPk-eNzqSwK-JFXBrmssU01NeVkE",
        authDomain: "gub-up.firebaseapp.com",
        projectId: "gub-up",
        storageBucket: "gub-up.firebasestorage.app",
        messagingSenderId: "75119179497",
        appId: "1:75119179497:web:2e0195a3dfd4fb03e5a278"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    lucide.createIcons();

    // 1. Grab the User ID (UID) from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid');

    // 2. Auto-focus logic for the 4 boxes
    const inputs = document.querySelectorAll('.otp-field');
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value && index < 3) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
        });
    });

    // 3. Form Submission Logic
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const enteredCode = Array.from(inputs).map(i => i.value).join('');
        const btn = document.getElementById('verifyBtn');

        if (enteredCode.length < 4) {
            alert("Please enter the full 4-digit code.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Checking...";

        try {
            const userRef = doc(db, "users", uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) throw new Error("User record not found.");
            
            const userData = userSnap.data();

            // Check if code matches
            if (enteredCode === userData.otpCode) {
                // Success! Clear the OTP code from DB (it's no longer needed)
                await updateDoc(userRef, { 
                    otpCode: null,
                    isEmailVerified: true 
                });

                // Check Role and Redirect
                if (userData.role === 'citizen') {
                    alert("Verification successful! Welcome to GUB-UP.");
                    window.location.href = "dashboard.html";
                } else {
                    // It's a BHW or RHU Staff
                    alert("Email verified! Your staff application is now pending approval from Admin (Edward).");
                    window.location.href = "dashboard.html";
                }
            } else {
                throw new Error("The code you entered is incorrect. Please check your email again.");
            }

        } catch (error) {
            alert(error.message);
            btn.disabled = false;
            btn.innerText = "Verify Account";
        }
    });
</script>
</body>
</html>
